# Root Application: manages all ApplicationSets under appsets/obs
# Apply once: kubectl apply -f 0day-deployment-manifests/root-application.yaml
# The root app then syncs appsets/obs and creates/updates every ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saadisfy/bwcloud-gitops.git
    targetRevision: main
    path: appsets/obs
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
