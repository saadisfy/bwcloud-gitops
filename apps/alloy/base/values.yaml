# Alloy observability example (prod-first):
# - Alloy as DaemonSet on every node
# - Scrape kube-state-metrics, node-exporter, kubelet and cadvisor
# - Forward metrics to Mimir using OTEL exporter path (otelcol.exporter.otlphttp)
# - Label strategy: dual-label export, but k8s_* is primary for NEW dashboards/
#   alerts/queries; Prometheus-compatible labels are retained for legacy/imported
#   dashboards to keep fast community reuse.
#
# TODO(Observability): Introduce a central OTEL Collector Gateway in a follow-up
# task and change Alloy agents to export OTLP to that gateway service.

alloy:
  # Q: Why set a fullname override?
  # A: Ensures predictable resource names (e.g., Service/ConfigMap), which keeps
  #    discovery and operations stable across releases.
  fullnameOverride: alloy

  controller:
    # Q: Why daemonset mode?
    # A: Runs one Alloy per node for node-local scraping and simple rollout,
    #    matching the current strategy (gateway later).
    type: daemonset

  rbac:
    # Q: Why create RBAC?
    # A: Needed for Kubernetes discovery and kubelet/cadvisor access via API.
    create: true
    clusterRules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["nodes/pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["nodes/metrics"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
        verbs: ["get"]

  service:
    # Q: Why keep service enabled?
    # A: Exposes Alloy HTTP endpoint for health/debug/operations if needed.
    enabled: true

  # Upstream Alloy chart values (under the 'alloy' dependency key)
  alloy:
    extraArgs:
      # Q: What does this do?
      # A: Disables Alloy's anonymous usage reporting. It does NOT disable
      #    scraped Prometheus metrics from kube-state-metrics/node-exporter.
      - --disable-reporting
    resources:
      # Q: Why these requests/limits?
      # A: Conservative defaults for stable scheduling and memory protection.
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi

    # ConfigMap settings inside the upstream Alloy chart's 'alloy' block
    configMap:
      create: false
      name: alloy

    # Default mounts
    mounts:
      # metrics-only: disable host log mounts
      varlog: false
      dockercontainers: false

kube-state-metrics:
  # Q: Why fullname override?
  # A: Provides stable service name used by scrape relabel keep rule.
  fullnameOverride: kube-state-metrics
  prometheus:
    monitor:
      # Q: Why disable monitor here?
      # A: Alloy already scrapes directly; this avoids duplicate scrape setups.
      enabled: false

prometheus-node-exporter:
  # Q: Why fullname override?
  # A: Keeps service name deterministic for the node-exporter keep filter.
  fullnameOverride: node-exporter
  prometheus:
    monitor:
      # Q: Why disable monitor here?
      # A: Prevents parallel scrape paths when Alloy is the single scraper.
      enabled: false
