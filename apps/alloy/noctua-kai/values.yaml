customConfig:
  metadata:
    - "k8s.namespace.name"
    - "k8s.pod.name"
    - "k8s.pod.uid"
    - "k8s.node.name"
    - "k8s.container.name"
    - "k8s.deployment.name"
    - "k8s.statefulset.name"
    - "k8s.daemonset.name"
    - "k8s.cronjob.name"
    - "k8s.job.name"

k8s-monitoring:
  cluster:
    name: "prod-bwcloud"

  # Intercept chart-generated components and customize their behavior
  # NOTE: replaceComponent überschreibt chart-interne Alloy-Komponenten.
  # pod_logs (logs) und enrich (metrics) sind BEWUSST zwei separate k8sattributes-Instanzen:
  #   - pod_logs:  Lookup via k8s.pod.uid  → OTel-Collector kennt die UID direkt
  #   - enrich:    Lookup via k8s.pod.ip   → Prometheus liefert nur IPs, keine UIDs
  # extract.metadata ist in beiden IDENTISCH → gleiche Labels für denselben Pod in Loki und Mimir.
  replaceComponent:
    - type: otelcol.receiver.prometheus
      name: mimir
      content: |
        output {
          metrics = [otelcol.processor.memory_limiter.scrape_guard.input]
        }
    - type: otelcol.processor.k8sattributes
      name: pod_logs
      module: pod_logs_via_opentelemetry
      content: |
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.uid"
          }
        }
        extract {
          otel_annotations = false
          // Vollständige Metadaten — identisch mit enrich (metrics), damit derselbe Pod
          // in Loki und Mimir exakt dieselben Labels bekommt.
          // Nur der pod_association-Lookup unterscheidet sich (uid hier vs. ip dort).
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.pod.uid",
            "k8s.node.name",
            "k8s.container.name",
            "k8s.deployment.name",
            "k8s.statefulset.name",
            "k8s.daemonset.name",
            "k8s.cronjob.name",
            "k8s.job.name",
          ]
          deployment_name_from_replicaset = true
          annotation {
            key_regex = "resource.opentelemetry.io/(.*)"
            tag_name  = "$1"
            from      = "pod"
          }
          // Log-spezifisch: steuert ob Pod-Logs gesammelt werden (→ filter weiter unten)
          annotation {
            tag_name = "logs.grafana.com/pods.enabled"
            key      = "logs.grafana.com/pods.enabled"
            from     = "pod"
          }
          // Log-spezifisch: erkennt OTel-Operator Injection → gefilterte Pods
          annotation {
            key_regex = "instrumentation\\.opentelemetry\\.io/inject-.*"
            tag_name  = "otel_injected"
            from      = "pod"
          }
          // Gemeinsam mit enrich: app-Name für Dashboard-Queries
          label {
            tag_name = "app_kubernetes_io_name"
            key      = "app.kubernetes.io/name"
            from     = "pod"
          }
        }
        output {
          logs = [otelcol.processor.filter.pod_logs.input]
        }
    - type: otelcol.processor.filter
      name: pod_logs
      module: pod_logs_via_opentelemetry
      content: |
        error_mode = "ignore"
        logs {
          log_record = [
            // opt-out via annotation deaktiviert: wir wollen keine manuelle Aussteuerung pro Pod.
            // Bei Bedarf wieder aktivieren:
            // `resource.attributes["logs.grafana.com/pods.enabled"] == "false"`,
            // `resource.attributes["logs.grafana.com/pods.enabled"] == "no"`,
            // `resource.attributes["logs.grafana.com/pods.enabled"] == "skip"`,
            // OTel-Operator injizierte Pods herausfiltern: Logs kommen bereits via OTLP rein
            `resource.attributes["otel_injected"] != nil`,
          ]
        }
        output {
          logs = [otelcol.processor.transform.pod_logs.input]
        }
    - type: otelcol.processor.transform
      name: pod_logs
      module: pod_logs_via_opentelemetry
      content: |
        error_mode = "ignore"
        log_statements {
          context = "resource"
          statements = [
            `delete_key(attributes, "k8s.container.restart_count")`,
            `delete_key(attributes, "logs.grafana.com/pods.enabled")`,
            `delete_key(attributes, "http.request.header.authorization")`,
            `delete_key(attributes, "http.request.header.cookie")`,
            `delete_key(attributes, "http.request.header.set_cookie")`,
            `delete_key(attributes, "authorization")`,
            `delete_key(attributes, "cookie")`,
            `delete_key(attributes, "password")`,
            `delete_key(attributes, "token")`,
            `delete_key(attributes, "api_key")`,
            `delete_key(attributes, "apikey")`,
            `delete_key(attributes, "secret")`,

            `set(attributes["service.name"], attributes["app.kubernetes.io/name"]) where attributes["service.name"] == nil and attributes["app.kubernetes.io/name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.replicaset.name"]) where attributes["service.name"] == nil and attributes["k8s.replicaset.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.cronjob.name"]) where attributes["service.name"] == nil and attributes["k8s.cronjob.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.job.name"]) where attributes["service.name"] == nil and attributes["k8s.job.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil`,
            `set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil`,

            `set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["service.namespace"] == nil and attributes["k8s.namespace.name"] != nil`,
            `set(attributes["service.version"], attributes["app.kubernetes.io/version"]) where attributes["service.version"] == nil and attributes["app.kubernetes.io/version"] != nil`,
            `set(attributes["service.instance.id"], Concat([attributes["k8s.namespace.name"], attributes["k8s.pod.name"], attributes["k8s.container.name"]], ".")) where attributes["service.instance.id"] == nil and attributes["k8s.namespace.name"] != nil and attributes["k8s.pod.name"] != nil and attributes["k8s.container.name"] != nil`,
          ]
        }

        log_statements {
          context = "log"
          statements = [
            `delete_key(attributes, "log.file.path")`,
            `delete_key(attributes, "http.request.header.authorization")`,
            `delete_key(attributes, "http.request.header.cookie")`,
            `delete_key(attributes, "http.request.header.set_cookie")`,
            `delete_key(attributes, "authorization")`,
            `delete_key(attributes, "cookie")`,
            `delete_key(attributes, "password")`,
            `delete_key(attributes, "token")`,
            `delete_key(attributes, "api_key")`,
            `delete_key(attributes, "apikey")`,
            `delete_key(attributes, "secret")`,
          ]
        }

        output {
          logs = argument.logs_destinations.value
        }


  # Destinations: direkt zu den Backends, kein Gateway-Hop
  destinations:
    loki-otlp:
      type: otlp
      url: "http://loki-gateway.loki.svc.cluster.local/otlp"
      protocol: http
#      auth:  # default (type: none)
      tls:
        insecure: true
      logs:
        enabled: true
      metrics:
        enabled: false  # override: loki ist logs-only
      traces:
        enabled: false  # override: loki ist logs-only
      sendingQueue:
        blockOnOverflow: true
        numConsumers: 10
        queueSize: 5000
        storage: otelcol.storage.file.queue.handler
        batch:
          enabled: true
          sizer: items
          flushTimeout: 2s
          minSize: 8192
          maxSize: 16384
      processors:
        memoryLimiter:
          enabled: true
          checkInterval: 1s
          limit: 1536MiB
        resourceAttributes:
          removeList:
            - http.request.body
            - http.response.body
            - db.statement
        filters:
          enabled: true
          logs:
            logRecord:
              - "attributes[\"private_key\"] != nil"
        transform:
          logs:
            resource:
              - "delete_key(attributes, \"http.request.header.authorization\")"
              - "delete_key(attributes, \"http.request.header.cookie\")"
              - "delete_key(attributes, \"http.request.header.set_cookie\")"
              - "delete_key(attributes, \"authorization\")"
              - "delete_key(attributes, \"cookie\")"
              - "delete_key(attributes, \"password\")"
              - "delete_key(attributes, \"token\")"
              - "delete_key(attributes, \"api_key\")"
              - "delete_key(attributes, \"apikey\")"
              - "delete_key(attributes, \"secret\")"
            log:
              - "delete_key(attributes, \"http.request.header.authorization\")"
              - "delete_key(attributes, \"http.request.header.cookie\")"
              - "delete_key(attributes, \"http.request.header.set_cookie\")"
              - "delete_key(attributes, \"authorization\")"
              - "delete_key(attributes, \"cookie\")"
              - "delete_key(attributes, \"password\")"
              - "delete_key(attributes, \"token\")"
              - "delete_key(attributes, \"api_key\")"
              - "delete_key(attributes, \"apikey\")"
              - "delete_key(attributes, \"secret\")"
              - "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil"
              - "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil"
              - "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil"
              - "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil"
              - "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil"
              - "set(attributes[\"job\"],       resource.attributes[\"service.name\"])       where resource.attributes[\"service.name\"] != nil and attributes[\"job\"] == nil"
              - "set(attributes[\"instance\"],  resource.attributes[\"service.instance.id\"]) where resource.attributes[\"service.instance.id\"] != nil and attributes[\"instance\"] == nil"
              - "set(attributes[\"instance\"],  resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil and attributes[\"instance\"] == nil"
    elastic-logs:
      type: otlp
      url: "http://otel-elk-bridge-collector.elk.svc.cluster.local:4317"
      protocol: grpc
      tls:
        insecure: true
      logs:
        enabled: true
      metrics:
        enabled: false
      traces:
        enabled: false
      sendingQueue:
        blockOnOverflow: true
        numConsumers: 10
        queueSize: 5000
        storage: otelcol.storage.file.queue.handler
        batch:
          enabled: true
          sizer: items
          flushTimeout: 2s
          minSize: 8192
          maxSize: 16384
      processors:
        memoryLimiter:
          enabled: true
          checkInterval: 1s
          limit: 1536MiB
        resourceAttributes:
          removeList:
            - http.request.body
            - http.response.body
            - db.statement
        filters:
          enabled: true
          logs:
            logRecord:
              - "attributes[\"private_key\"] != nil"
        transform:
          logs:
            resource:
              - "delete_key(attributes, \"http.request.header.authorization\")"
              - "delete_key(attributes, \"http.request.header.cookie\")"
              - "delete_key(attributes, \"http.request.header.set_cookie\")"
              - "delete_key(attributes, \"authorization\")"
              - "delete_key(attributes, \"cookie\")"
              - "delete_key(attributes, \"password\")"
              - "delete_key(attributes, \"token\")"
              - "delete_key(attributes, \"api_key\")"
              - "delete_key(attributes, \"apikey\")"
              - "delete_key(attributes, \"secret\")"
            log:
              - "delete_key(attributes, \"http.request.header.authorization\")"
              - "delete_key(attributes, \"http.request.header.cookie\")"
              - "delete_key(attributes, \"http.request.header.set_cookie\")"
              - "delete_key(attributes, \"authorization\")"
              - "delete_key(attributes, \"cookie\")"
              - "delete_key(attributes, \"password\")"
              - "delete_key(attributes, \"token\")"
              - "delete_key(attributes, \"api_key\")"
              - "delete_key(attributes, \"apikey\")"
              - "delete_key(attributes, \"secret\")"
    mimir:
      type: otlp
      url: "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
      protocol: http
      tls:
        insecure: true
      extraHeaders:
        X-Scope-OrgID: "1"
      logs:
        enabled: false
      traces:
        enabled: false
      sendingQueue:
        blockOnOverflow: true
        numConsumers: 10
        queueSize: 5000
        storage: otelcol.storage.file.queue.handler
        batch:
          enabled: true
          sizer: items
          flushTimeout: 2s
          minSize: 8192
          maxSize: 16384
      processors:
        memoryLimiter:
          enabled: true
          checkInterval: 1s
          limit: 1536MiB
        transform:
          metrics:
            datapoint:
              - "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil"
              - "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil"
              - "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil"
              - "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil"
              - "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil"
              - "set(attributes[\"job\"],       resource.attributes[\"service.name\"])       where resource.attributes[\"service.name\"] != nil and attributes[\"job\"] == nil"
              - "set(attributes[\"instance\"],  resource.attributes[\"service.instance.id\"]) where resource.attributes[\"service.instance.id\"] != nil and attributes[\"instance\"] == nil"
              - "set(attributes[\"instance\"],  resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil and attributes[\"instance\"] == nil"
              - "set(attributes[\"metrics_path\"], \"/metrics/cadvisor\") where (resource.attributes[\"service.name\"] == \"cadvisor\" or resource.attributes[\"job\"] == \"cadvisor\") and IsMatch(metric.name, \"^container_\")"
    tempo:
      type: otlp
      url: "http://tempo.tempo.svc.cluster.local:4317"
      tls:
        insecure: true
      metrics:
        enabled: false
      logs:
        enabled: false
      sendingQueue:
        blockOnOverflow: true
        numConsumers: 10
        queueSize: 5000
        storage: otelcol.storage.file.queue.handler
        batch:
          enabled: true
          sizer: items
          flushTimeout: 2s
          minSize: 8192
          maxSize: 16384
      processors:
        memoryLimiter:
          enabled: true
          checkInterval: 1s
          limit: 1536MiB
        resourceAttributes:
          removeList:
            - http.request.body
            - http.response.body
            - db.statement
        filters:
          enabled: true
          traces:
            span:
              - "attributes[\"private_key\"] != nil"
        transform:
          traces:
            resource:
              - "delete_key(attributes, \"http.request.header.authorization\")"
              - "delete_key(attributes, \"http.request.header.cookie\")"
              - "delete_key(attributes, \"http.request.header.set_cookie\")"
              - "delete_key(attributes, \"authorization\")"
              - "delete_key(attributes, \"cookie\")"
              - "delete_key(attributes, \"password\")"
              - "delete_key(attributes, \"token\")"
              - "delete_key(attributes, \"api_key\")"
              - "delete_key(attributes, \"apikey\")"
              - "delete_key(attributes, \"secret\")"
              - "set(attributes[\"namespace\"], attributes[\"k8s.namespace.name\"]) where attributes[\"k8s.namespace.name\"] != nil"
              - "set(attributes[\"pod\"],       attributes[\"k8s.pod.name\"])       where attributes[\"k8s.pod.name\"] != nil"
              - "set(attributes[\"container\"], attributes[\"k8s.container.name\"]) where attributes[\"k8s.container.name\"] != nil"
              - "set(attributes[\"node\"],      attributes[\"k8s.node.name\"])      where attributes[\"k8s.node.name\"] != nil"
              - "set(attributes[\"cluster\"],   attributes[\"k8s.cluster.name\"])   where attributes[\"k8s.cluster.name\"] != nil"
              - "set(attributes[\"job\"],       attributes[\"service.name\"])       where attributes[\"service.name\"] != nil and attributes[\"job\"] == nil"
              - "set(attributes[\"instance\"],  attributes[\"service.instance.id\"]) where attributes[\"service.instance.id\"] != nil and attributes[\"instance\"] == nil"
              - "set(attributes[\"instance\"],  attributes[\"k8s.pod.name\"])       where attributes[\"k8s.pod.name\"] != nil and attributes[\"instance\"] == nil"
            span:
              - "delete_key(attributes, \"http.request.header.authorization\")"
              - "delete_key(attributes, \"http.request.header.cookie\")"
              - "delete_key(attributes, \"http.request.header.set_cookie\")"
              - "delete_key(attributes, \"authorization\")"
              - "delete_key(attributes, \"cookie\")"
              - "delete_key(attributes, \"password\")"
              - "delete_key(attributes, \"token\")"
              - "delete_key(attributes, \"api_key\")"
              - "delete_key(attributes, \"apikey\")"
              - "delete_key(attributes, \"secret\")"

  # Feature Enablement
  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    destinations:
      - mimir
    controlPlane:
      enabled: true
  hostMetrics:
    enabled: true
    collector: alloy-node
    destinations:
      - mimir
    linuxHosts:
      enabled: true
  # Chart sammelt Logs, reichert nativ mit k8s Resource Attributes an,
  # und schickt direkt via OTLP/HTTP zu Loki — kein Gateway nötig
  podLogsViaOpenTelemetry:
    enabled: true
    collector: alloy-node
    destinations:
      - loki-otlp
      - elastic-logs
  applicationObservability:
    enabled: true
    collector: alloy-node
    receivers:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
    processors:
      memoryLimiter:
        enabled: true
        checkInterval: 1s
        limit: 1536MiB
      resourceDetection:
        override: false
      k8sattributes:
        podAssociation:
          - from: resource_attribute
            name: k8s.pod.uid
          - from: resource_attribute
            name: k8s.pod.ip
          - from: connection
      filter:
        errorMode: ignore
      transform:
        errorMode: ignore
    logs:
      filters:
        log_record:
          - "attributes[\"private_key\"] != nil"
      transforms:
        resource:
          - "delete_key(attributes, \"http.request.header.authorization\")"
          - "delete_key(attributes, \"http.request.header.cookie\")"
          - "delete_key(attributes, \"http.request.header.set_cookie\")"
          - "delete_key(attributes, \"authorization\")"
          - "delete_key(attributes, \"cookie\")"
          - "delete_key(attributes, \"password\")"
          - "delete_key(attributes, \"token\")"
          - "delete_key(attributes, \"api_key\")"
          - "delete_key(attributes, \"apikey\")"
          - "delete_key(attributes, \"secret\")"
        log:
          - "delete_key(attributes, \"http.request.header.authorization\")"
          - "delete_key(attributes, \"http.request.header.cookie\")"
          - "delete_key(attributes, \"http.request.header.set_cookie\")"
          - "delete_key(attributes, \"authorization\")"
          - "delete_key(attributes, \"cookie\")"
          - "delete_key(attributes, \"password\")"
          - "delete_key(attributes, \"token\")"
          - "delete_key(attributes, \"api_key\")"
          - "delete_key(attributes, \"apikey\")"
          - "delete_key(attributes, \"secret\")"
    traces:
      filters:
        span:
          - "attributes[\"private_key\"] != nil"
      transforms:
        resource:
          - "delete_key(attributes, \"http.request.header.authorization\")"
          - "delete_key(attributes, \"http.request.header.cookie\")"
          - "delete_key(attributes, \"http.request.header.set_cookie\")"
          - "delete_key(attributes, \"authorization\")"
          - "delete_key(attributes, \"cookie\")"
          - "delete_key(attributes, \"password\")"
          - "delete_key(attributes, \"token\")"
          - "delete_key(attributes, \"api_key\")"
          - "delete_key(attributes, \"apikey\")"
          - "delete_key(attributes, \"secret\")"
        span:
          - "delete_key(attributes, \"http.request.header.authorization\")"
          - "delete_key(attributes, \"http.request.header.cookie\")"
          - "delete_key(attributes, \"http.request.header.set_cookie\")"
          - "delete_key(attributes, \"authorization\")"
          - "delete_key(attributes, \"cookie\")"
          - "delete_key(attributes, \"password\")"
          - "delete_key(attributes, \"token\")"
          - "delete_key(attributes, \"api_key\")"
          - "delete_key(attributes, \"apikey\")"
          - "delete_key(attributes, \"secret\")"

  # Discover ServiceMonitors, PodMonitors, etc.
  prometheusOperatorObjects:
    enabled: true
    collector: alloy-metrics
    destinations:
      - mimir
    podMonitors:
      enabled: false
    probes:
      enabled: false
    scrapeConfigs:
      enabled: false

  # Discover Pods/Services via annotations
  annotationAutodiscovery:
    enabled: true
    collector: alloy-metrics
    destinations:
      - mimir

  selfReporting:
    enabled: false

  alloy-operator:
    waitForAlloyRemoval:
      enabled: false

  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  # Collector configuration
  collectors:
    alloy-metrics:
      enabled: true
      presets: [clustered]
      includeDestinations:
        - mimir
      alloy:
        stabilityLevel: public-preview
        storagePath: /var/lib/alloy/data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        mounts:
          extra:
            - name: alloy-modules
              mountPath: /etc/alloy/modules
              readOnly: true
            - name: alloy-storage
              mountPath: /var/lib/alloy
      controller:
        volumes:
          extra:
            - name: alloy-modules
              configMap:
                name: alloy-modules
            - name: alloy-storage
              hostPath:
                path: /var/lib/alloy/noctua-kai/metrics
                type: DirectoryOrCreate
      extraConfig: &metricsPipeline |
        // Persistent queue storage for OTLP exporter sending_queue blocks.
        // The hostPath mount keeps queued payloads across Alloy container restarts.
        otelcol.storage.file "queue" {
          directory = "/var/lib/alloy/queue"
          compaction {
            on_start = true
            on_rebound = true
            directory = "/var/lib/alloy/queue-compaction"
          }
        }

        otelcol.processor.memory_limiter "scrape_guard" {
          check_interval = "1s"
          limit = "1536MiB"
          spike_limit = "384MiB"
          output {
            metrics = [otelcol.processor.groupbyattrs.group.input]
          }
        }

        // k8sattributes + dual_semantics kommen aus dem Modul (single source of truth).
        // Änderungen → templates/alloy-modules-configmap.yaml
        import.file "enrich" {
          filename = "/etc/alloy/modules/k8s-enrich.alloy"
        }

        enrich.metrics_enrichment "main" {
          output = otelcol.processor.attributes.mimir.input
        }

        // GROUPBYATTRS: Gruppiert Prometheus-Metriken nach Pod/Namespace in getrennte Batches,
        // damit k8sattributes (im Modul) korrekte Pro-Pod-Zuordnungen treffen kann.
        otelcol.processor.groupbyattrs "group" {
          keys = ["namespace", "pod", "k8s_pod_ip", "instance"]
          output {
            metrics = [otelcol.processor.transform.promote_meta.input]
          }
        }

        // TRANSFORM (promote_meta): Hebt Prometheus-Labels zu OTel-Resource-Attributes hoch
        // und normalisiert service.name/job für bekannte Integrations-Prefixes.
        // Notwendig weil k8sattributes (im Modul) OTel-Resource-Attributes für den IP-Lookup braucht.
        otelcol.processor.transform "promote_meta" {
          output {
            metrics = [enrich.metrics_enrichment.main.input]
          }
          metric_statements {
            context = "resource"
            statements = [
              "set(attributes[\"k8s.namespace.name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
              "set(attributes[\"k8s.pod.name\"],       attributes[\"pod\"])       where attributes[\"pod\"] != nil",
              "set(attributes[\"k8s.pod.ip\"],         attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
              "set(attributes[\"k8s.pod.ip\"],         attributes[\"instance\"]) where attributes[\"k8s_pod_ip\"] == nil and attributes[\"instance\"] != nil",
              "replace_pattern(attributes[\"k8s.pod.ip\"], \":\\\\d+$\", \"\") where attributes[\"k8s.pod.ip\"] != nil",
              "set(attributes[\"service.name\"], \"kube-state-metrics\") where attributes[\"service.name\"] == \"integrations/kubernetes/kube-state-metrics\"",
              "set(attributes[\"service.name\"], \"node-exporter\")      where attributes[\"service.name\"] == \"integrations/node_exporter\"",
              "set(attributes[\"service.name\"], \"cadvisor\")           where attributes[\"service.name\"] == \"integrations/kubernetes/cadvisor\"",
              "set(attributes[\"service.name\"], \"kubelet\")            where attributes[\"service.name\"] == \"integrations/kubernetes/kubelet\"",
              "set(attributes[\"service.name\"], \"kube-apiserver\")     where attributes[\"service.name\"] == \"integrations/kubernetes/kube-apiserver\"",
              "set(attributes[\"job\"], \"kube-state-metrics\") where attributes[\"job\"] == \"integrations/kubernetes/kube-state-metrics\"",
              "set(attributes[\"job\"], \"node-exporter\")      where attributes[\"job\"] == \"integrations/node_exporter\"",
              "set(attributes[\"job\"], \"cadvisor\")           where attributes[\"job\"] == \"integrations/kubernetes/cadvisor\"",
              "set(attributes[\"job\"], \"kubelet\")            where attributes[\"job\"] == \"integrations/kubernetes/kubelet\"",
              "set(attributes[\"job\"], \"kube-apiserver\")     where attributes[\"job\"] == \"integrations/kubernetes/kube-apiserver\"",
            ]
          }
          metric_statements {
            context = "datapoint"
            statements = [
              "set(resource.attributes[\"service.name\"], attributes[\"job\"]) where resource.attributes[\"service.name\"] == nil and attributes[\"job\"] != nil",
              "set(resource.attributes[\"service.instance.id\"], attributes[\"instance\"]) where resource.attributes[\"service.instance.id\"] == nil and attributes[\"instance\"] != nil and IsMatch(attributes[\"instance\"], \"^[^:]+:\\\\d+$\")",
            ]
          }
        }



    alloy-node:
      enabled: true
      presets: [daemonset, clustered, filesystem-log-reader]
      alloy:
        stabilityLevel: public-preview
        storagePath: /var/lib/alloy/data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        mounts:
          extra:
            - name: alloy-modules
              mountPath: /etc/alloy/modules
              readOnly: true
            - name: alloy-storage
              mountPath: /var/lib/alloy
      controller:
        volumes:
          extra:
            - name: alloy-modules
              configMap:
                name: alloy-modules
            - name: alloy-storage
              hostPath:
                path: /var/lib/alloy/noctua-kai/node
                type: DirectoryOrCreate
      extraConfig: *metricsPipeline
