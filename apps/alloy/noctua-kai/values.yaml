k8s-monitoring:
  cluster:
    name: "prod-bwcloud"

  # Intercept chart-generated components and customize their behavior
  replaceComponent:
    - type: otelcol.receiver.prometheus
      name: mimir
      content: |
        output {
          metrics = [otelcol.processor.groupbyattrs.group.input]
        }
    - type: otelcol.processor.k8sattributes
      name: pod_logs
      module: pod_logs_via_opentelemetry
      content: |
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.uid"
          }
        }
        extract {
          otel_annotations = false
          metadata = [
            "k8s.deployment.name",
            "k8s.statefulset.name",
            "k8s.daemonset.name",
            "k8s.cronjob.name",
            "k8s.job.name",
            "k8s.node.name",
          ]
          annotation {
            key_regex = "resource.opentelemetry.io/(.*)"
            tag_name  = "$1"
            from      = "pod"
          }
          annotation {
            tag_name = "logs.grafana.com/pods.enabled"
            key      = "logs.grafana.com/pods.enabled"
            from     = "pod"
          }
          // Dynamically detect any OTel Operator inject annotation and flag it as otel_injected
          annotation {
            key_regex = "instrumentation\\.opentelemetry\\.io/inject-.*"
            tag_name  = "otel_injected"
            from      = "pod"
          }
          label {
            tag_name = "app_kubernetes_io_name"
            key      = "app.kubernetes.io/name"
            from     = "pod"
          }
        }
        output {
          logs = [otelcol.processor.filter.pod_logs.input]
        }
    - type: otelcol.processor.filter
      name: pod_logs
      module: pod_logs_via_opentelemetry
      content: |
        error_mode = "ignore"
        logs {
          log_record = [
            `resource.attributes["logs.grafana.com/pods.enabled"] == "false"`,
            `resource.attributes["logs.grafana.com/pods.enabled"] == "no"`,
            `resource.attributes["logs.grafana.com/pods.enabled"] == "skip"`,
            // Auto-detect OTel Operator auto-instrumentation injection annotations
            `resource.attributes["otel_injected"] != nil`,
          ]
        }
        output {
          logs = [otelcol.processor.transform.pod_logs.input]
        }

  # Destinations: direkt zu den Backends, kein Gateway-Hop
  destinations:
    loki-otlp:
      type: otlp
      url: "http://loki-gateway.loki.svc.cluster.local/otlp"
      protocol: http
      auth:
        type: none
      tls:
        insecure: true
      logs:
        enabled: true
      metrics:
        enabled: false
      traces:
        enabled: false
    mimir:
      type: otlp
      url: "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
      protocol: http
      auth:
        type: none
      tls:
        insecure: true
      extraHeaders:
        X-Scope-OrgID: "1"
      metrics:
        enabled: true
      logs:
        enabled: false
      traces:
        enabled: false
    tempo:
      type: otlp
      url: "http://tempo.tempo.svc.cluster.local:4317"
      protocol: grpc
      auth:
        type: none
      tls:
        insecure: true
      metrics:
        enabled: false
      logs:
        enabled: false
      traces:
        enabled: true

  # Feature Enablement
  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    destinations:
      - mimir
    controlPlane:
      enabled: true
  hostMetrics:
    enabled: true
    collector: alloy-node
    destinations:
      - mimir
    linuxHosts:
      enabled: true
  podLogsViaLoki:
    enabled: false
  # Chart sammelt Logs, reichert nativ mit k8s Resource Attributes an,
  # und schickt direkt via OTLP/HTTP zu Loki — kein Gateway nötig
  podLogsViaOpenTelemetry:
    enabled: true
    collector: alloy-node
    destinations:
      - loki-otlp
    annotations: {}
  applicationObservability:
    enabled: true
    collector: alloy-node
    receivers:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
    metrics:
      enabled: true
      transforms:
        datapoint:
          - "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil"
          - "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil"
          - "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil"
          - "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil"
          - "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil"
          - "set(attributes[\"job\"],       resource.attributes[\"service.name\"])       where resource.attributes[\"service.name\"] != nil and attributes[\"job\"] == nil"
          - "set(attributes[\"instance\"],  resource.attributes[\"service.instance.id\"]) where resource.attributes[\"service.instance.id\"] != nil and attributes[\"instance\"] == nil"
          - "set(attributes[\"instance\"],  resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil and attributes[\"instance\"] == nil"

  # Discover ServiceMonitors, PodMonitors, etc.
  prometheusOperatorObjects:
    enabled: true
    collector: alloy-metrics
    destinations:
      - mimir

  # Discover Pods/Services via annotations
  annotationAutodiscovery:
    enabled: true
    collector: alloy-metrics
    destinations:
      - mimir

  selfReporting:
    enabled: true
    destinations:
      - mimir

  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  # Collector configuration
  collectors:
    alloy-metrics:
      enabled: true
      presets: [clustered]
      includeDestinations:
        - mimir
      extraConfig: &metricsPipeline |
        // ─────────────────────────────────────────────────────────────────────
        // METRICS ENRICHMENT PIPELINE
        // Prometheus-Labels → OTel Resource Attributes → k8sattributes → Mimir
        // ─────────────────────────────────────────────────────────────────────

        // 1. GROUPBYATTRS: Gruppiert Metriken nach Pod und Namespace in getrennte Batches.
        // Warum: In OTel werden Daten in Batches verarbeitet. Ohne Gruppierung würden Metriken
        // verschiedener Pods vermischt und k8sattributes würde falsche Zuordnungen treffen.
        otelcol.processor.groupbyattrs "group" {
          keys = ["namespace", "pod", "k8s_pod_ip", "instance"]
          output {
            metrics = [otelcol.processor.transform.promote_meta.input]
          }
        }

        // 2. TRANSFORM (promote_meta): Kopiert Prometheus-Labels in OTel-Resource-Attribute.
        // Warum: k8sattributes benötigt OTel-Resource-Attribute (wie k8s.pod.ip) für den Lookup.
        // IP-Fallback: Wir nutzen bevorzugt k8s_pod_ip, andernfalls instance (wo wir den Port :8080 abschneiden).
        otelcol.processor.transform "promote_meta" {
          output {
            metrics = [otelcol.processor.k8sattributes.enrich.input]
          }
          metric_statements {
            context = "resource"
            statements = [
              "set(attributes[\"k8s.namespace.name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
              "set(attributes[\"k8s.pod.name\"],       attributes[\"pod\"])       where attributes[\"pod\"] != nil",
              "set(attributes[\"k8s.pod.ip\"],         attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
              "set(attributes[\"k8s.pod.ip\"],         attributes[\"instance\"]) where attributes[\"k8s_pod_ip\"] == nil and attributes[\"instance\"] != nil",
              "replace_pattern(attributes[\"k8s.pod.ip\"], \":\\\\d+$\", \"\") where attributes[\"k8s.pod.ip\"] != nil",
              "set(attributes[\"service.name\"], \"kube-state-metrics\") where attributes[\"service.name\"] == \"integrations/kubernetes/kube-state-metrics\"",
              "set(attributes[\"service.name\"], \"node-exporter\")      where attributes[\"service.name\"] == \"integrations/node_exporter\"",
              "set(attributes[\"service.name\"], \"cadvisor\")           where attributes[\"service.name\"] == \"integrations/kubernetes/cadvisor\"",
              "set(attributes[\"service.name\"], \"kubelet\")            where attributes[\"service.name\"] == \"integrations/kubernetes/kubelet\"",
              "set(attributes[\"service.name\"], \"kube-apiserver\")     where attributes[\"service.name\"] == \"integrations/kubernetes/kube-apiserver\"",
              "set(attributes[\"job\"], \"kube-state-metrics\") where attributes[\"job\"] == \"integrations/kubernetes/kube-state-metrics\"",
              "set(attributes[\"job\"], \"node-exporter\")      where attributes[\"job\"] == \"integrations/node_exporter\"",
              "set(attributes[\"job\"], \"cadvisor\")           where attributes[\"job\"] == \"integrations/kubernetes/cadvisor\"",
              "set(attributes[\"job\"], \"kubelet\")            where attributes[\"job\"] == \"integrations/kubernetes/kubelet\"",
              "set(attributes[\"job\"], \"kube-apiserver\")     where attributes[\"job\"] == \"integrations/kubernetes/kube-apiserver\"",
            ]
          }
          metric_statements {
            context = "datapoint"
            statements = [
              "set(resource.attributes[\"service.name\"], attributes[\"job\"]) where resource.attributes[\"service.name\"] == nil and attributes[\"job\"] != nil",
              "set(resource.attributes[\"service.instance.id\"], attributes[\"instance\"]) where resource.attributes[\"service.instance.id\"] == nil and attributes[\"instance\"] != nil",
            ]
          }
        }

        // 3. K8SATTRIBUTES (enrich): Fragt K8s-API ab und reichert Metadaten für die IP an.
        // Warum: Fragt den K8s-API-Server nach echten Metadaten (z.B. Deployment-Name, Container-Name, Pod-UID)
        // basierend auf der k8s.pod.ip/connection und speichert sie als OTel-Resource-Attribute.
        otelcol.processor.k8sattributes "enrich" {
          output {
            metrics = [otelcol.processor.transform.dual_semantics.input]
          }
          extract {
            metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
            deployment_name_from_replicaset = true
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.ip"
            }
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.name"
            }
          }
          pod_association {
            source {
              from = "connection"
            }
          }
        }

        // 4. TRANSFORM (dual_semantics): Kopiert neu gewonnene K8s-Metadaten zurück auf Datenpunkt-Labels.
        // Warum: Ermöglicht die Abfrage über klassische Prometheus-Metrik-Labels (namespace, pod, container, node, cluster, job, instance)
        // in existierenden Grafana-Dashboards, da OTLP-Pushed-Metrics diese sonst auf Datenpunktebene nicht besitzen.
        otelcol.processor.transform "dual_semantics" {
          error_mode = "ignore"
          output {
            metrics = [otelcol.processor.attributes.mimir.input]
          }
          metric_statements {
            context = "datapoint"
            statements = [
              "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
              "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil",
              "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
              "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil",
              "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil",
              "set(attributes[\"job\"],       resource.attributes[\"service.name\"])       where resource.attributes[\"service.name\"] != nil and attributes[\"job\"] == nil",
              "set(attributes[\"instance\"],  resource.attributes[\"service.instance.id\"]) where resource.attributes[\"service.instance.id\"] != nil and attributes[\"instance\"] == nil",
              "set(attributes[\"instance\"],  resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil and attributes[\"instance\"] == nil",
              "set(attributes[\"metrics_path\"], \"/metrics/cadvisor\") where (resource.attributes[\"service.name\"] == \"cadvisor\" or resource.attributes[\"job\"] == \"cadvisor\") and IsMatch(metric.name, \"^container_\")",
            ]
          }
        }

    alloy-node:
      enabled: true
      presets: [daemonset, clustered, filesystem-log-reader]
      alloy:
        stabilityLevel: public-preview
      extraConfig: *metricsPipeline
