k8s-monitoring:
  cluster:
    name: "prod-bwcloud"
  
  # Stage 1: Pure Prometheus Remote Write
  destinations:
    mimir:
      type: prometheus
      url: "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
      auth:
        type: none
      extraHeaders:
        X-Scope-OrgID: "1"

  # Feature Enablement (v4 Schema)
  clusterMetrics:
    enabled: true
    collector: alloy-metrics
  hostMetrics:
    enabled: true
    collector: alloy-node

  # Specific metrics to scrape
  metrics:
    node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true

  # Discover ServiceMonitors, PodMonitors, etc.
  prometheusOperatorObjects:
    enabled: true
    collector: alloy-metrics

  # Discover Pods/Services via annotations
  annotationAutodiscovery:
    enabled: true
    collector: alloy-metrics

  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  # Collector configuration
  collectors:
    alloy-metrics:
      enabled: true
      # Correct level for extraConfig in k8s-monitoring chart
      extraConfig: |-
        discovery.kubernetes "alloy" {
          role = "pod"
          selectors {
            role = "pod"
            label = "app.kubernetes.io/name=alloy-metrics"
          }
        }
        prometheus.scrape "alloy" {
          targets    = discovery.kubernetes.alloy.targets
          forward_to = [prometheus.remote_write.mimir.receiver]
          job_name   = "integrations/alloy"
        }
      alloy:
        clustering:
          enabled: true
    alloy-node:
      enabled: true
      alloy:
        clustering:
          enabled: true

# Keep the Gateway deployed but it will be unused in Stage 1
alloy:
  fullnameOverride: alloy-gateway
  controller:
    type: deployment
    replicas: 1
    hostNetwork: false
    dnsPolicy: ClusterFirst
  alloy:
    configMap:
      create: true
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }
        // Gateway is idle in Stage 1
