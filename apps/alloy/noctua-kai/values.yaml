k8s-monitoring:
  cluster:
    name: "prod-bwcloud"
  
  # Stage 2: Two-Tier OTLP Loopback via Alloy Gateway
  destinations:
    alloy-gateway:
      type: otlp
      url: "http://alloy-gateway.alloy.svc.cluster.local:4318"
      protocol: http
      auth:
        type: none
      tls:
        insecure: true
    loki:
      type: loki
      url: "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
    loki-otlp:
      type: otlp
      url: "http://loki-gateway.loki.svc.cluster.local/otlp"
      protocol: http
      auth:
        type: none
      tls:
        insecure: true
      logs:
        enabled: true
      metrics:
        enabled: false
      traces:
        enabled: false
    mimir:
      type: otlp
      url: "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
      protocol: http
      auth:
        type: none
      tls:
        insecure: true
      extraHeaders:
        X-Scope-OrgID: "1"
      metrics:
        enabled: true
      logs:
        enabled: false
      traces:
        enabled: false

  # Feature Enablement (v4 Schema)
  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    destinations:
      - alloy-gateway
    controlPlane:
      enabled: true
  hostMetrics:
    enabled: true
    collector: alloy-node
    destinations:
      - alloy-gateway
    linuxHosts:
      enabled: true
  podLogsViaLoki:
    enabled: false
  podLogsViaOpenTelemetry:
    enabled: true
    collector: alloy-node
    destinations:
      - alloy-gateway

  # Discover ServiceMonitors, PodMonitors, etc.
  prometheusOperatorObjects:
    enabled: true
    collector: alloy-metrics
    destinations:
      - alloy-gateway

  # Discover Pods/Services via annotations
  annotationAutodiscovery:
    enabled: true
    collector: alloy-metrics
    destinations:
      - alloy-gateway

  selfReporting:
    enabled: true
    destinations:
      - alloy-gateway


  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  # Collector configuration
  collectors:
    alloy-metrics:
      enabled: true
      presets: [clustered]
    alloy-node:
      enabled: true
      presets: [daemonset, clustered, filesystem-log-reader]
      alloy:
        stabilityLevel: public-preview
    alloy-gateway:
      enabled: true
      presets: [deployment]
      extraService:
        enabled: true
        fullname: "alloy-gateway"
      alloy:
        extraPorts:
          - name: grpc-otlp
            port: 4317
            targetPort: 4317
            protocol: TCP
          - name: http-otlp
            port: 4318
            targetPort: 4318
            protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 4Gi
      includeDestinations:
        - mimir
        - loki-otlp
      extraConfig: |
        otelcol.receiver.otlp "gateway" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            metrics = [otelcol.processor.groupbyattrs.group.input]
            logs    = [otelcol.processor.k8sattributes.enrich_logs.input]
          }
        }

        // Group metrics by pod and namespace to prevent metadata cross-contamination
        otelcol.processor.groupbyattrs "group" {
          keys = ["namespace", "pod", "k8s_pod_ip", "instance"]
          output {
            metrics = [otelcol.processor.transform.promote_meta.input]
          }
        }

        // Promote IP and metadata from Prometheus metrics labels to OTel resource attributes
        otelcol.processor.transform "promote_meta" {
          output {
            metrics = [otelcol.processor.k8sattributes.enrich.input]
          }
          metric_statements {
            context = "resource"
            statements = [
              "set(attributes[\"k8s.namespace.name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
              "set(attributes[\"k8s.pod.name\"], attributes[\"pod\"]) where attributes[\"pod\"] != nil",
              "set(attributes[\"k8s.pod.ip\"], attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
              "set(attributes[\"k8s.pod.ip\"], attributes[\"instance\"]) where attributes[\"k8s_pod_ip\"] == nil and attributes[\"instance\"] != nil",
              "replace_pattern(attributes[\"k8s.pod.ip\"], \":\\\\d+$\", \"\") where attributes[\"k8s.pod.ip\"] != nil",
              "set(attributes[\"service.name\"], \"kube-state-metrics\") where attributes[\"service.name\"] == \"integrations/kubernetes/kube-state-metrics\"",
              "set(attributes[\"service.name\"], \"node-exporter\") where attributes[\"service.name\"] == \"integrations/node_exporter\"",
              "set(attributes[\"service.name\"], \"cadvisor\") where attributes[\"service.name\"] == \"integrations/kubernetes/cadvisor\"",
              "set(attributes[\"service.name\"], \"kubelet\") where attributes[\"service.name\"] == \"integrations/kubernetes/kubelet\"",
              "set(attributes[\"service.name\"], \"kube-apiserver\") where attributes[\"service.name\"] == \"integrations/kubernetes/kube-apiserver\"",
              "set(attributes[\"job\"], \"kube-state-metrics\") where attributes[\"job\"] == \"integrations/kubernetes/kube-state-metrics\"",
              "set(attributes[\"job\"], \"node-exporter\") where attributes[\"job\"] == \"integrations/node_exporter\"",
              "set(attributes[\"job\"], \"cadvisor\") where attributes[\"job\"] == \"integrations/kubernetes/cadvisor\"",
              "set(attributes[\"job\"], \"kubelet\") where attributes[\"job\"] == \"integrations/kubernetes/kubelet\"",
              "set(attributes[\"job\"], \"kube-apiserver\") where attributes[\"job\"] == \"integrations/kubernetes/kube-apiserver\"",
            ]
          }
        }

        // Enrich metrics with Kubernetes cluster metadata
        otelcol.processor.k8sattributes "enrich" {
          output {
            metrics = [otelcol.processor.transform.dual_semantics.input]
          }
          extract {
            metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
            deployment_name_from_replicaset = true
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.ip"
            }
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.name"
            }
          }
        }

        // Mirror OTel Resource attributes back to metric datapoint labels for backward compatibility with Prometheus dashboards
        otelcol.processor.transform "dual_semantics" {
          error_mode = "ignore"
          output {
            metrics = [otelcol.processor.attributes.mimir.input]
          }
          metric_statements {
            context = "datapoint"
            statements = [
              "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
              "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil",
              "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
              "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil",
              "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil",
              "set(attributes[\"metrics_path\"], \"/metrics/cadvisor\") where (resource.attributes[\"service.name\"] == \"cadvisor\" or resource.attributes[\"job\"] == \"cadvisor\") and IsMatch(metric.name, \"^container_\")",
            ]
          }
        }

        // Tag metrics with cluster label then forward to chart-generated Mimir exporter
        // NOTE: otelcol.processor.attributes "mimir" + exporter chain are
        //       generated by the chart via includeDestinations: [mimir]

        // ─────────────────────────────────────────────────────────────────────
        // LOG PIPELINE: alloy-node → gateway → k8sattributes → Loki
        // ─────────────────────────────────────────────────────────────────────

        // Enrich log records with Kubernetes resource attributes
        otelcol.processor.k8sattributes "enrich_logs" {
          output {
            logs = [otelcol.processor.transform.add_cluster_logs.input]
          }
          extract {
            metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
            deployment_name_from_replicaset = true
          }
          pod_association {
            source {
              from = "connection"
            }
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.name"
            }
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.uid"
            }
          }
        }

        // Stamp cluster name and prune noisy process.* attributes from logs
        otelcol.processor.transform "add_cluster_logs" {
          error_mode = "ignore"
          output {
            // Feed into chart-generated transform for full attribute normalization
            // (container/pod/namespace label→resource promotion, then batch→exporter)
            logs = [otelcol.processor.transform.loki_otlp.input]
          }
          log_statements {
            context = "resource"
            statements = [
              "set(attributes[\"k8s.cluster.name\"], \"prod-bwcloud\")",
              "set(attributes[\"cluster\"],           \"prod-bwcloud\")",
              "delete_key(attributes, \"process.pid\")",
              "delete_key(attributes, \"process.parent_pid\")",
              "delete_key(attributes, \"process.executable.path\")",
              "delete_key(attributes, \"process.command_line\")",
              "delete_key(attributes, \"process.command_args\")",
              "delete_key(attributes, \"process.owner\")",
            ]
          }
        }
