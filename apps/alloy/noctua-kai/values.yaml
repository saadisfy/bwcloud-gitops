k8s-monitoring:
  cluster:
    name: "prod-bwcloud"
  destinations:
    gateway:
      type: otlp
      url: "http://alloy-gateway-otlp.alloy.svc.cluster.local:4317"
      protocol: grpc
      tls:
        insecure: true
  clusterMetrics:
    enabled: true
    collector: alloy-metrics
  hostMetrics:
    enabled: true
    collector: alloy-node
  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true
  collectors:
    alloy-metrics:
      enabled: true
      alloy:
        clustering:
          enabled: true
    alloy-node:
      enabled: true
      alloy:
        clustering:
          enabled: true

alloy:
  fullnameOverride: alloy-gateway
  controller:
    type: deployment
    replicas: 1
    hostNetwork: false
    dnsPolicy: ClusterFirst
  alloy:
    configMap:
      create: true
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        otelcol.receiver.otlp "default" {
          grpc { endpoint = "0.0.0.0:4317" }
          http { endpoint = "0.0.0.0:4318" }
          output {
            metrics = [otelcol.processor.transform.promote_pod_ip.input]
            logs = []
            traces = []
          }
        }

        otelcol.processor.transform "promote_pod_ip" {
          output { metrics = [otelcol.processor.groupbyattrs.split_by_pod.input] }
          metric_statements {
            context = "datapoint"
            statements = [
              "set(resource.attributes[\"k8s.pod.ip\"], attributes[\"pod_ip\"]) where attributes[\"pod_ip\"] != nil",
            ]
          }
        }

        otelcol.processor.groupbyattrs "split_by_pod" {
          keys = ["k8s.pod.ip"]
          output { metrics = [otelcol.processor.k8sattributes.enrich.input] }
        }

        otelcol.processor.k8sattributes "enrich" {
          output { metrics = [otelcol.processor.transform.dual_semantics.input] }
          extract {
            metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.ip"
            }
          }
          pod_association {
            source {
              from = "connection"
            }
          }
        }

        otelcol.processor.transform "dual_semantics" {
          error_mode = "ignore"
          output { metrics = [otelcol.processor.batch.default.input] }
          metric_statements {
            context = "datapoint"
            statements = [
              // 1. Promote Resource attributes back to Labels (Datapoint attributes)
              "set(attributes[\"pod\"], resource.attributes[\"k8s.pod.name\"]) where resource.attributes[\"k8s.pod.name\"] != nil",
              "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
              "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
              "set(attributes[\"node\"], resource.attributes[\"k8s.node.name\"]) where resource.attributes[\"k8s.node.name\"] != nil",

              // 2. Ensure OTel-style labels (k8s_*) exist by copying from either Resource or existing Labels
              "set(attributes[\"k8s_pod_name\"], resource.attributes[\"k8s.pod.name\"]) where resource.attributes[\"k8s.pod.name\"] != nil",
              "set(attributes[\"k8s_pod_name\"], attributes[\"pod\"]) where attributes[\"pod\"] != nil and attributes[\"k8s_pod_name\"] == nil",
              
              "set(attributes[\"k8s_namespace_name\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
              "set(attributes[\"k8s_namespace_name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil and attributes[\"k8s_namespace_name\"] == nil",

              "set(attributes[\"k8s_node_name\"], resource.attributes[\"k8s.node.name\"]) where resource.attributes[\"k8s.node.name\"] != nil",
              "set(attributes[\"k8s_node_name\"], attributes[\"node\"]) where attributes[\"node\"] != nil and attributes[\"k8s_node_name\"] == nil",

              "set(attributes[\"k8s_container_name\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
              "set(attributes[\"k8s_container_name\"], attributes[\"container\"]) where attributes[\"container\"] != nil and attributes[\"k8s_container_name\"] == nil",
              
              "set(attributes[\"k8s_deployment_name\"], resource.attributes[\"k8s.deployment.name\"]) where resource.attributes[\"k8s.deployment.name\"] != nil",
            ]
          }
        }

        otelcol.processor.batch "default" {
          output { metrics = [otelcol.exporter.otlphttp.mimir.input] }
        }

        otelcol.exporter.otlphttp "mimir" {
          client {
            endpoint = "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
            headers = { "X-Scope-OrgID" = "1" }
          }
        }
