apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular architecture (Receive -> Process -> Export)
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ===============================================================
    // PHASE 3: EXPORT
    // ===============================================================

    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
        timeout  = "10s"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
      sending_queue {
        enabled    = true
        queue_size = 5000
      }
      retry_on_failure {
        enabled          = true
        max_elapsed_time = "5m"
      }
    }

    // ===============================================================
    // PHASE 2: PROCESS (Central Enrichment & Label Mapping)
    // ===============================================================

    // --- Pipeline: Dual-Semantics (Enrichment & Legacy Label Mirroring) ---
    declare "otelcol_pipeline_dual_semantics" {
      argument "forward_to" {}
      argument "enable_k8s_enrichment" {
        optional = true
        default  = true
      }

      // 6. Batching (Optimized for Mimir)
      otelcol.processor.batch "default" {
        output { metrics = [argument.forward_to.value] }
        send_batch_size = 8192
        timeout         = "10s"
      }

      // 5. Dual-Semantics Mirroring (Resource -> Datapoint)
      otelcol.processor.transform "mirror_dual_semantics" {
        error_mode = "ignore"
        output { metrics = [otelcol.processor.batch.default.input] }
        
        metric_statements {
          context = "datapoint"
          statements = [
            // CRITICAL: Force 'instance' to match 'service.instance.id' for reliable Metadata Joins
            "set(attributes[\"instance\"], resource.attributes[\"service.instance.id\"]) where resource.attributes[\"service.instance.id\"] != nil",

            // Fallback: Ensure 'instance' is also set from datapoint if resource was missing (e.g. meta_level)
            "set(attributes[\"instance\"], attributes[\"pod\"]) where attributes[\"pod\"] != nil and resource.attributes[\"service.instance.id\"] == nil",
            "set(attributes[\"instance\"], attributes[\"node\"]) where attributes[\"node\"] != nil and attributes[\"instance\"] == nil and resource.attributes[\"service.instance.id\"] == nil",

            {{- if .Values.enableMirroring }}
            // Map OTel Resource Attributes to legacy Prometheus Datapoint Labels
            "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
            "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil",
            "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
            "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil",
            "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil",

            // Fallback: If resource attribute was missing, ensure legacy labels are populated from k8s_* datapoint labels if they exist
            "set(attributes[\"namespace\"], attributes[\"k8s_namespace_name\"]) where attributes[\"k8s_namespace_name\"] != nil and attributes[\"namespace\"] == nil",
            "set(attributes[\"pod\"],       attributes[\"k8s_pod_name\"])       where attributes[\"k8s_pod_name\"] != nil and attributes[\"pod\"] == nil",
            "set(attributes[\"container\"], attributes[\"k8s_container_name\"]) where attributes[\"k8s_container_name\"] != nil and attributes[\"container\"] == nil",
            "set(attributes[\"node\"],      attributes[\"k8s_node_name\"])      where attributes[\"k8s_node_name\"] != nil and attributes[\"node\"] == nil",
            "set(attributes[\"cluster\"],   attributes[\"k8s_cluster_name\"])   where attributes[\"k8s_cluster_name\"] != nil and attributes[\"cluster\"] == nil",

            // Explicitly set k8s_* labels on the datapoint to ensure they exist regardless of backend behavior
            "set(attributes[\"k8s_namespace_name\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
            "set(attributes[\"k8s_pod_name\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil",
            "set(attributes[\"k8s_container_name\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
            "set(attributes[\"k8s_node_name\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil",
            "set(attributes[\"k8s_cluster_name\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil",

            // Fallback: If resource attribute was missing (e.g. meta_level), copy existing legacy datapoint labels to k8s_* format
            "set(attributes[\"k8s_namespace_name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil and attributes[\"k8s_namespace_name\"] == nil",
            "set(attributes[\"k8s_pod_name\"],       attributes[\"pod\"])       where attributes[\"pod\"] != nil and attributes[\"k8s_pod_name\"] == nil",
            "set(attributes[\"k8s_container_name\"], attributes[\"container\"]) where attributes[\"container\"] != nil and attributes[\"k8s_container_name\"] == nil",
            "set(attributes[\"k8s_node_name\"],      attributes[\"node\"])      where attributes[\"node\"] != nil and attributes[\"k8s_node_name\"] == nil",
            "set(attributes[\"k8s_cluster_name\"],   attributes[\"cluster\"])   where attributes[\"cluster\"] != nil and attributes[\"k8s_cluster_name\"] == nil",
            {{- else }}
            // Only ensure basic connectivity (minimal labels)
            "set(attributes[\"cluster\"], resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil",
            {{- end }}
          ]
        }

        metric_statements {
          context = "resource"
          statements = [
            "delete_key(attributes, \"k8s.pod.ip\")",
          ]
        }
      }

      // 4. Inject Cluster Name & Standardize Identity
      otelcol.processor.resource "standardize_identity" {
        output { metrics = [otelcol.processor.transform.mirror_dual_semantics.input] }
        attributes {
          action = "insert"
          key    = "k8s.cluster.name"
          value  = "prod-bwcloud"
        }
        // Step 4b: Set service.instance.id (OTel Standard)
        // Order: Pod UID -> Pod Name -> Node Name
        metric_statements {
          context = "resource"
          statements = [
            "set(attributes[\"service.instance.id\"], attributes[\"k8s.pod.uid\"]) where attributes[\"k8s.pod.uid\"] != nil",
            "set(attributes[\"service.instance.id\"], attributes[\"k8s.pod.name\"]) where attributes[\"k8s.pod.name\"] != nil and attributes[\"service.instance.id\"] == nil",
            "set(attributes[\"service.instance.id\"], attributes[\"k8s.node.name\"]) where attributes[\"k8s.node.name\"] != nil and attributes[\"service.instance.id\"] == nil",
          ]
        }
      }

      // 3. K8s Attributes Enrichment (Conditional)
      otelcol.processor.k8sattributes "enrich" {
        output { metrics = [otelcol.processor.resource.standardize_identity.input] }
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
          deployment_name_from_replicaset = true
        }
        pod_association {
          source { from = "resource_attribute" name = "k8s.pod.ip" }
        }
        pod_association {
          source { from = "connection" }
        }
      }

      // 2. Promote Pod IP/Meta to Resource Level (for k8sattributes)
      otelcol.processor.transform "promote_meta" {
        output {
          metrics = [
            argument.enable_k8s_enrichment.value ? otelcol.processor.k8sattributes.enrich.input : otelcol.processor.resource.inject_cluster.input,
          ]
        }
        metric_statements {
          context = "datapoint"
          statements = [
            "set(resource.attributes[\"k8s.pod.ip\"], attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
            "set(resource.attributes[\"k8s.pod.name\"], attributes[\"pod\"]) where attributes[\"pod\"] != nil",
            "set(resource.attributes[\"k8s.namespace.name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
            "delete_key(attributes, \"k8s_pod_ip\")",
          ]
        }
      }

      // 1. Memory Limiter (OOM Protection) - Optimized for high-power node
      otelcol.processor.memory_limiter "default" {
        output { metrics = [otelcol.processor.transform.promote_meta.input] }
        check_interval  = "1s"
        limit           = "1000MiB"
        spike_limit     = "200MiB"
      }

      export "input" {
        value = otelcol.processor.memory_limiter.default.input
      }
    }

    // ===============================================================
    // PHASE 1: RECEIVE (Target-Specific Scrapes)
    // ===============================================================

    // --- ServiceMonitors (e.g. for Mimir Components) ---
    prometheus.operator.servicemonitors "cluster" {
      forward_to = [otelcol.receiver.prometheus.servicemonitors.receiver]
    }

    otelcol.receiver.prometheus "servicemonitors" {
      output {
        metrics = [otelcol_pipeline_dual_semantics.pod_level.input]
      }
    }

    // ===============================================================
    // MODULE IMPORTS
    // ===============================================================
    import.file "alloy_scrape" { filename = "/etc/alloy/alloy_scrape.alloy" }
    import.file "kubelet_scrape" { filename = "/etc/alloy/kubelet_scrape.alloy" }
    import.file "cadvisor_scrape" { filename = "/etc/alloy/cadvisor_scrape.alloy" }
    import.file "ksm_scrape" { filename = "/etc/alloy/ksm_scrape.alloy" }
    import.file "controllermanager_scrape" { filename = "/etc/alloy/controllermanager_scrape.alloy" }
    import.file "scheduler_scrape" { filename = "/etc/alloy/scheduler_scrape.alloy" }
    import.file "kubeproxy_scrape" { filename = "/etc/alloy/kubeproxy_scrape.alloy" }
    import.file "apiserver_scrape" { filename = "/etc/alloy/apiserver_scrape.alloy" }
    import.file "node_exporter_scrape" { filename = "/etc/alloy/node_exporter_scrape.alloy" }

    // ===============================================================
    // INSTANTIATION
    // ===============================================================

    otelcol_pipeline_dual_semantics "pod_level" {
      forward_to = otelcol.exporter.otlphttp.mimir.input
      enable_k8s_enrichment = true
    }

    otelcol_pipeline_dual_semantics "meta_level" {
      forward_to = otelcol.exporter.otlphttp.mimir.input
      enable_k8s_enrichment = false
    }

    alloy_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.pod_level.input
    }

    kubelet_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    cadvisor_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    ksm_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    node_exporter_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    apiserver_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    controllermanager_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    scheduler_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

    kubeproxy_scrape.scrape "default" {
      forward_to = otelcol_pipeline_dual_semantics.meta_level.input
    }

  alloy_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "alloy" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip"
        }
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
      }

      prometheus.scrape "alloy" {
        targets    = discovery.relabel.alloy.output
        forward_to = [otelcol.receiver.prometheus.alloy.receiver]
        scrape_interval = "15s"
      }

      otelcol.receiver.prometheus "alloy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  kubelet_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "job"
          replacement  = "kubelet"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }
      
      // ==========================================
      // LOCAL METRIC DROP (Performance optimized)
      // ==========================================
      prometheus.relabel "drop_unwanted" {
        forward_to = [otelcol.receiver.prometheus.kubelet.receiver]
        
        // Example: Drop highly cardinal/noisy kubelet metrics right at scrape time
        rule {
          source_labels = ["__name__"]
          regex         = "container_network_receive_errors_total|example_noisy_metric_.*"
          action        = "drop"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        // Point forward_to to the local relabel rule instead of otelcol directly
        forward_to = [prometheus.relabel.drop_unwanted.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "kubelet" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  cadvisor_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }
      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        forward_to = [otelcol.receiver.prometheus.cadvisor.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "cadvisor" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  ksm_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }
      discovery.relabel "ksm" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "^(alloy-)?kube-state-metrics$"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http|http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip"
        }
        rule {
          target_label = "job"
          replacement  = "kube-state-metrics"
        }
      }
      prometheus.scrape "ksm" {
        targets    = discovery.relabel.ksm.output
        forward_to = [otelcol.receiver.prometheus.ksm.receiver]
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "ksm" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  controllermanager_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "controllermanager" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-controller-manager"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label  = "__address__"
          replacement   = "127.0.0.1:10257"
        }
      }
      prometheus.scrape "controllermanager" {
        targets    = discovery.relabel.controllermanager.output
        forward_to = [otelcol.receiver.prometheus.controllermanager.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "controllermanager" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  scheduler_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "scheduler" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-scheduler"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label  = "__address__"
          replacement   = "127.0.0.1:10259"
        }
      }
      prometheus.scrape "scheduler" {
        targets    = discovery.relabel.scheduler.output
        forward_to = [otelcol.receiver.prometheus.scheduler.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "scheduler" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  kubeproxy_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "kubeproxy" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-proxy"
        }
        rule {
          target_label  = "__address__"
          replacement   = "127.0.0.1:10249"
        }
      }
      prometheus.scrape "kubeproxy" {
        targets    = discovery.relabel.kubeproxy.output
        forward_to = [otelcol.receiver.prometheus.kubeproxy.receiver]
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "kubeproxy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  apiserver_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "apiserver" {
        role = "endpoints"
      }
      discovery.relabel "apiserver" {
        targets = discovery.kubernetes.apiserver.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "kubernetes"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "default"
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-apiserver"
        }
      }
      prometheus.scrape "apiserver" {
        targets    = discovery.relabel.apiserver.output
        forward_to = [otelcol.receiver.prometheus.apiserver.receiver]
        scheme     = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          server_name = "kubernetes"
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "apiserver" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

  node_exporter_scrape.alloy: |-
    declare "scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:9100"
        }
        rule {
          target_label = "job"
          replacement = "node-exporter"
        }
      }
      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [otelcol.receiver.prometheus.node_exporter.receiver]
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "node_exporter" {
        output { metrics = [argument.forward_to.value] }
      }
    }
