apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular architecture (Receive -> Process -> Export)
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ===============================================================
    // PHASE 3: EXPORT
    // ===============================================================

    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
        timeout  = "10s"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
      sending_queue {
        enabled    = true
        queue_size = 5000
      }
      retry_on_failure {
        enabled          = true
        max_elapsed_time = "5m"
      }
    }

    // ===============================================================
    // PHASE 2: PROCESS (Central Enrichment & Label Mapping)
    // ===============================================================

    // --- Chain 1: Enriched (for Pod Scrapes) ---

    otelcol.processor.batch "enriched" {
      output {
        metrics = [otelcol.exporter.otlphttp.mimir.input]
      }
      send_batch_size = 1024
      timeout         = "5s"
    }

    otelcol.processor.transform "mirror_enriched" {
      error_mode = "ignore"
      output {
        metrics = [otelcol.processor.batch.enriched.input]
      }
      metric_statements {
        context = "datapoint"
        statements = [
          // 1. Mirror from Resource Attributes (populated by k8sattributes) to Datapoint Attributes
          "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
          "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"])       where resource.attributes[\"k8s.pod.name\"] != nil",
          "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
          "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"])      where resource.attributes[\"k8s.node.name\"] != nil",
          "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"])   where resource.attributes[\"k8s.cluster.name\"] != nil",

          // 2. Mirror between underscore and plain formats for broad compatibility
          "set(attributes[\"k8s_namespace_name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
          "set(attributes[\"k8s_pod_name\"],       attributes[\"pod\"])       where attributes[\"pod\"] != nil",
          "set(attributes[\"k8s_container_name\"], attributes[\"container\"]) where attributes[\"container\"] != nil",
          "set(attributes[\"k8s_node_name\"],      attributes[\"node\"])      where attributes[\"node\"] != nil",
          "set(attributes[\"k8s_cluster_name\"],   attributes[\"cluster\"])   where attributes[\"cluster\"] != nil",
          
          // 3. Back-mirror (if only underscores are present)
          "set(attributes[\"namespace\"], attributes[\"k8s_namespace_name\"]) where attributes[\"k8s_namespace_name\"] != nil and attributes[\"namespace\"] == nil",
          "set(attributes[\"pod\"],       attributes[\"k8s_pod_name\"])       where attributes[\"k8s_pod_name\"] != nil and attributes[\"pod\"] == nil",
          "set(attributes[\"container\"], attributes[\"k8s_container_name\"]) where attributes[\"k8s_container_name\"] != nil and attributes[\"container\"] == nil",
          "set(attributes[\"node\"],      attributes[\"k8s_node_name\"])      where attributes[\"k8s_node_name\"] != nil and attributes[\"node\"] == nil",
          "set(attributes[\"cluster\"],   attributes[\"k8s_cluster_name\"])   where attributes[\"k8s_cluster_name\"] != nil and attributes[\"cluster\"] == nil",
        ]
      }
      metric_statements {
        context = "resource"
        statements = [
          "delete_key(attributes, \"k8s.pod.ip\")",
        ]
      }
    }

    otelcol.processor.transform "inject_cluster_enriched" {
      output {
        metrics = [otelcol.processor.transform.mirror_enriched.input]
      }
      metric_statements {
        context = "resource"
        statements = [
          "set(attributes[\"k8s.cluster.name\"], \"prod-bwcloud\")",
        ]
      }
    }

    otelcol.processor.k8sattributes "enriched" {
      output {
        metrics = [otelcol.processor.transform.inject_cluster_enriched.input]
      }
      extract {
        metadata = [
          "k8s.namespace.name",
          "k8s.pod.name",
          "k8s.node.name",
          "k8s.deployment.name",
          "k8s.container.name",
        ]
        deployment_name_from_replicaset = true
      }
      pod_association {
        source {
          from = "resource_attribute"
          name = "k8s.pod.ip"
        }
      }
      pod_association {
        source {
          from = "resource_attribute"
          name = "k8s.pod.name"
        }
      }
      pod_association {
        source {
          from = "resource_attribute"
          name = "k8s.namespace.name"
        }
      }
      pod_association {
        source {
          from = "connection"
        }
      }
    }

    otelcol.processor.transform "promote_pod_ip_enriched" {
      output {
        metrics = [otelcol.processor.k8sattributes.enriched.input]
      }
      metric_statements {
        context = "datapoint"
        statements = [
          "set(resource.attributes[\"k8s.pod.ip\"], attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
          "set(resource.attributes[\"k8s.pod.name\"], attributes[\"pod\"]) where attributes[\"pod\"] != nil",
          "set(resource.attributes[\"k8s.namespace.name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
          "delete_key(attributes, \"k8s_pod_ip\") where attributes[\"k8s_pod_ip\"] != nil",
        ]
      }
    }
    otelcol.processor.memory_limiter "enriched" {
      output {
        metrics = [otelcol.processor.transform.promote_pod_ip_enriched.input]
      }
      check_interval  = "1s"
      limit           = "1500MiB"
      spike_limit     = "300MiB"
    }

    // --- Chain 2: Simple (for Meta-Exporters) ---

    otelcol.processor.batch "simple" {
      output {
        metrics = [otelcol.exporter.otlphttp.mimir.input]
      }
      send_batch_size = 1024
      timeout         = "5s"
    }

    otelcol.processor.transform "mirror_simple" {
      error_mode = "ignore"
      output {
        metrics = [otelcol.processor.batch.simple.input]
      }
      metric_statements {
        context = "datapoint"
        statements = [
          // 1. Mirror from Resource Attributes (like cluster)
          "set(attributes[\"cluster\"], resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil",
          "set(attributes[\"k8s_cluster_name\"], resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil",

          // 2. Sync between underscore and plain formats (important for KSM metrics)
          "set(attributes[\"k8s_namespace_name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil",
          "set(attributes[\"k8s_pod_name\"],       attributes[\"pod\"])       where attributes[\"pod\"] != nil",
          "set(attributes[\"k8s_container_name\"], attributes[\"container\"]) where attributes[\"container\"] != nil",
          "set(attributes[\"k8s_node_name\"],      attributes[\"node\"])      where attributes[\"node\"] != nil",

          "set(attributes[\"namespace\"], attributes[\"k8s_namespace_name\"]) where attributes[\"k8s_namespace_name\"] != nil and attributes[\"namespace\"] == nil",
          "set(attributes[\"pod\"],       attributes[\"k8s_pod_name\"])       where attributes[\"k8s_pod_name\"] != nil and attributes[\"pod\"] == nil",
          "set(attributes[\"container\"], attributes[\"k8s_container_name\"]) where attributes[\"k8s_container_name\"] != nil and attributes[\"container\"] == nil",
          "set(attributes[\"node\"],      attributes[\"k8s_node_name\"])      where attributes[\"k8s_node_name\"] != nil and attributes[\"node\"] == nil",
        ]
      }
    }

    otelcol.processor.transform "inject_cluster_simple" {
      output {
        metrics = [otelcol.processor.transform.mirror_simple.input]
      }
      metric_statements {
        context = "resource"
        statements = [
          "set(attributes[\"k8s.cluster.name\"], \"prod-bwcloud\")",
        ]
      }
    }

    otelcol.processor.memory_limiter "simple" {
      output {
        metrics = [otelcol.processor.transform.inject_cluster_simple.input]
      }
      check_interval  = "1s"
      limit           = "1500MiB"
      spike_limit     = "300MiB"
    }

    // ===============================================================
    // PHASE 1: RECEIVE (Target-Specific Scrapes)
    // ===============================================================

    // --- ServiceMonitors (e.g. for Mimir Components) ---
    prometheus.operator.servicemonitors "cluster" {
      forward_to = [otelcol.receiver.prometheus.servicemonitors.receiver]
    }

    otelcol.receiver.prometheus "servicemonitors" {
      output {
        metrics = [otelcol.processor.memory_limiter.enriched.input]
      }
    }

    // --- Module: Alloy Scrape ---
    declare "otelcol_alloy_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "alloy" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip"
        }
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
      }

      prometheus.scrape "alloy" {
        targets    = discovery.relabel.alloy.output
        forward_to = [otelcol.receiver.prometheus.alloy.receiver]
        scrape_interval = "15s"
      }

      otelcol.receiver.prometheus "alloy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kubelet Scrape ---
    declare "otelcol_kubelet_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "job"
          replacement  = "kubelet"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }
      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        forward_to = [otelcol.receiver.prometheus.kubelet.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "kubelet" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: cAdvisor Scrape ---
    declare "otelcol_cadvisor_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }
      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        forward_to = [otelcol.receiver.prometheus.cadvisor.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "cadvisor" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kube-State-Metrics Scrape ---
    declare "otelcol_ksm_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }
      discovery.relabel "ksm" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "^(alloy-)?kube-state-metrics$"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http|http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip"
        }
        rule {
          target_label = "job"
          replacement  = "kube-state-metrics"
        }
      }
      prometheus.scrape "ksm" {
        targets    = discovery.relabel.ksm.output
        forward_to = [otelcol.receiver.prometheus.ksm.receiver]
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "ksm" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Controller Manager Scrape ---
    declare "otelcol_controllermanager_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "controllermanager" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-controller-manager"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label  = "__address__"
          replacement   = "127.0.0.1:10257"
        }
      }
      prometheus.scrape "controllermanager" {
        targets    = discovery.relabel.controllermanager.output
        forward_to = [otelcol.receiver.prometheus.controllermanager.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "controllermanager" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Scheduler Scrape ---
    declare "otelcol_scheduler_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "scheduler" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-scheduler"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label  = "__address__"
          replacement   = "127.0.0.1:10259"
        }
      }
      prometheus.scrape "scheduler" {
        targets    = discovery.relabel.scheduler.output
        forward_to = [otelcol.receiver.prometheus.scheduler.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "scheduler" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kube Proxy Scrape ---
    declare "otelcol_kubeproxy_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "kubeproxy" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-proxy"
        }
        rule {
          target_label  = "__address__"
          replacement   = "127.0.0.1:10249"
        }
      }
      prometheus.scrape "kubeproxy" {
        targets    = discovery.relabel.kubeproxy.output
        forward_to = [otelcol.receiver.prometheus.kubeproxy.receiver]
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "kubeproxy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: API Server Scrape ---
    declare "otelcol_apiserver_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "apiserver" {
        role = "endpoints"
      }
      discovery.relabel "apiserver" {
        targets = discovery.kubernetes.apiserver.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "kubernetes"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "default"
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-apiserver"
        }
      }
      prometheus.scrape "apiserver" {
        targets    = discovery.relabel.apiserver.output
        forward_to = [otelcol.receiver.prometheus.apiserver.receiver]
        scheme     = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          server_name = "kubernetes"
          insecure_skip_verify = true
        }
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "apiserver" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Node-Exporter Scrape ---
    declare "otelcol_node_exporter_scrape" {
      argument "forward_to" {}
      discovery.kubernetes "nodes" {
        role = "node"
      }
      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:9100"
        }
        rule {
          target_label = "job"
          replacement = "node-exporter"
        }
      }
      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [otelcol.receiver.prometheus.node_exporter.receiver]
        scrape_interval = "15s"
      }
      otelcol.receiver.prometheus "node_exporter" {
        output { metrics = [argument.forward_to.value] }
      }
    }

    // ===============================================================
    // INSTANTIATION
    // ===============================================================

    otelcol_alloy_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.enriched.input
    }

    otelcol_kubelet_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_cadvisor_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_ksm_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_node_exporter_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_apiserver_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_controllermanager_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_scheduler_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }

    otelcol_kubeproxy_scrape "default" {
      forward_to = otelcol.processor.memory_limiter.simple.input
    }
