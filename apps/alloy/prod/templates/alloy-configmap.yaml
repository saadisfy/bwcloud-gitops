apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular architecture (Receive -> Process -> Export)
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ===============================================================
    // PHASE 3: EXPORT
    // ===============================================================

    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
      sending_queue {
        enabled    = true
        queue_size = 5000
      }
      retry_on_failure {
        enabled          = true
        max_elapsed_time = "5m"
      }
    }

    // ===============================================================
    // PHASE 2: PROCESS (Central Enrichment & Label Mapping)
    // ===============================================================

    declare "otelcol_pipeline_process_enriched" {
      argument "forward_to" {}

      // 6. Batching
      otelcol.processor.batch "default" {
        output { metrics = [argument.forward_to.value] }
        send_batch_size = 1024
        timeout         = "5s"
      }

      // 5. Mirror Legacy Labels and Cleanup
      otelcol.processor.transform "mirror_legacy_labels" {
        error_mode = "ignore"
        output { metrics = [otelcol.processor.batch.default.input] }
        
        metric_statements {
          context = "datapoint"
          statements = [
            // OTel Resource Attributes -> Prometheus Datapoint Labels (Conditional)
            "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil and attributes[\"namespace\"] == nil",
            "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil and attributes[\"cluster\"] == nil",
            "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"]) where resource.attributes[\"k8s.pod.name\"] != nil and attributes[\"pod\"] == nil",
            "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil and attributes[\"container\"] == nil",
            "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"]) where resource.attributes[\"k8s.node.name\"] != nil and attributes[\"node\"] == nil",
            
            // Ensure k8s_* labels are also set from resource attributes if missing
            "set(attributes[\"k8s_namespace_name\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil and attributes[\"k8s_namespace_name\"] == nil",
            "set(attributes[\"k8s_pod_name\"],       resource.attributes[\"k8s.pod.name\"]) where resource.attributes[\"k8s.pod.name\"] != nil and attributes[\"k8s_pod_name\"] == nil",
            "set(attributes[\"k8s_container_name\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil and attributes[\"k8s_container_name\"] == nil",
            "set(attributes[\"k8s_node_name\"],      resource.attributes[\"k8s.node.name\"]) where resource.attributes[\"k8s.node.name\"] != nil and attributes[\"k8s_node_name\"] == nil",
            "set(attributes[\"k8s_cluster_name\"],   resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil and attributes[\"k8s_cluster_name\"] == nil",

            // Fallback: Prometheus Datapoint Labels -> OTel Datapoint Labels
            "set(attributes[\"k8s_namespace_name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil and attributes[\"k8s_namespace_name\"] == nil",
            "set(attributes[\"k8s_pod_name\"],       attributes[\"pod\"]) where attributes[\"pod\"] != nil and attributes[\"k8s_pod_name\"] == nil",
            "set(attributes[\"k8s_container_name\"], attributes[\"container\"]) where attributes[\"container\"] != nil and attributes[\"k8s_container_name\"] == nil",
            "set(attributes[\"k8s_node_name\"],      attributes[\"node\"]) where attributes[\"node\"] != nil and attributes[\"k8s_node_name\"] == nil",
            "set(attributes[\"k8s_cluster_name\"],   attributes[\"cluster\"]) where attributes[\"cluster\"] != nil and attributes[\"k8s_cluster_name\"] == nil",
          ]
        }

        metric_statements {
          context = "resource"
          statements = [
            "delete_key(attributes, \"k8s.pod.ip\")",
          ]
        }
      }

      // 4. Inject Cluster Name
      otelcol.processor.transform "inject_cluster" {
        output { metrics = [otelcol.processor.transform.mirror_legacy_labels.input] }
        metric_statements {
          context = "resource"
          statements = [
            "set(attributes[\"k8s.cluster.name\"], \"prod-bwcloud\")",
          ]
        }
      }
      // 3. K8s Attributes Enrichment
      otelcol.processor.k8sattributes "global_enrich" {
        output { metrics = [otelcol.processor.resource.inject_cluster.input] }
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
          deployment_name_from_replicaset = true
        }
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.ip"
          }
        }
        pod_association {
          source {
            from = "connection"
          }
        }
      }

      // 2. Promote Pod IP to Resource Level
      otelcol.processor.transform "promote_pod_ip" {
        output { metrics = [otelcol.processor.k8sattributes.global_enrich.input] }
        metric_statements {
          context = "datapoint"
          statements = [
            "set(resource.attributes[\"k8s.pod.ip\"], attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
            "delete_key(attributes, \"k8s_pod_ip\") where attributes[\"k8s_pod_ip\"] != nil",
          ]
        }
      }

      // 1. Memory Limiter (OOM Schutz) Limit: 400 MiB (80% of 512 MiB limit)
      otelcol.processor.memory_limiter "default" {
        output { metrics = [otelcol.processor.transform.promote_pod_ip.input] }
        check_interval  = "1s"
        limit           = "400MiB"
        spike_limit     = "100MiB"
      }

      export "input" {
        value = otelcol.processor.memory_limiter.default.input
      }
    }

    declare "otelcol_pipeline_process_simple" {
      argument "forward_to" {}

      // 4. Batching
      otelcol.processor.batch "default" {
        output { metrics = [argument.forward_to.value] }
        send_batch_size = 1024
        timeout         = "5s"
      }

      // 3. Mirror & Fallback Labels
      otelcol.processor.transform "mirror_legacy_labels" {
        error_mode = "ignore"
        output { metrics = [otelcol.processor.batch.default.input] }
        
        metric_statements {
          context = "datapoint"
          statements = [
            // Ensure Cluster label is present
            "set(attributes[\"cluster\"], resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil and attributes[\"cluster\"] == nil",
            
            // Fallback: Prometheus Datapoint Labels -> OTel Datapoint Labels
            "set(attributes[\"k8s_namespace_name\"], attributes[\"namespace\"]) where attributes[\"namespace\"] != nil and attributes[\"k8s_namespace_name\"] == nil",
            "set(attributes[\"k8s_pod_name\"],       attributes[\"pod\"]) where attributes[\"pod\"] != nil and attributes[\"k8s_pod_name\"] == nil",
            "set(attributes[\"k8s_container_name\"], attributes[\"container\"]) where attributes[\"container\"] != nil and attributes[\"k8s_container_name\"] == nil",
            "set(attributes[\"k8s_node_name\"],      attributes[\"node\"]) where attributes[\"node\"] != nil and attributes[\"k8s_node_name\"] == nil",
            "set(attributes[\"k8s_cluster_name\"],   attributes[\"cluster\"]) where attributes[\"cluster\"] != nil and attributes[\"k8s_cluster_name\"] == nil",
          ]
        }
      }

      // 2. Inject Cluster Name
      otelcol.processor.resource "inject_cluster" {
        output { metrics = [otelcol.processor.transform.mirror_legacy_labels.input] }
        attributes {
          action = "insert"
          key    = "k8s.cluster.name"
          value  = "prod-bwcloud"
        }
      }

      // 1. Memory Limiter
      otelcol.processor.memory_limiter "default" {
        output { metrics = [otelcol.processor.resource.inject_cluster.input] }
        check_interval  = "1s"
        limit           = "400MiB"
        spike_limit     = "100MiB"
      }

      export "input" {
        value = otelcol.processor.memory_limiter.default.input
      }
    }

    // ===============================================================
    // PHASE 1: RECEIVE (Target-Specific Scrapes)
    // ===============================================================

    // --- ServiceMonitors (e.g. for Mimir Components) ---
    prometheus.operator.servicemonitors "cluster" {
      forward_to = [otelcol.receiver.prometheus.servicemonitors.receiver]
    }

    otelcol.receiver.prometheus "servicemonitors" {
      output {
        metrics = [pod_level.input]
      }
    }

    // ... (rest of instantiations)

    otelcol_alloy_scrape "default" {
      forward_to = pod_level.input
    }

    otelcol_kubelet_scrape "default" {
      forward_to = meta_level.input
    }

    otelcol_cadvisor_scrape "default" {
      forward_to = meta_level.input
    }

    otelcol_ksm_scrape "default" {
      forward_to = meta_level.input
    }

    otelcol_node_exporter_scrape "default" {
      forward_to = meta_level.input
    }
