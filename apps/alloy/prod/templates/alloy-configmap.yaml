apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – consolidated for stability (bypassing node limits).
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ---------------------------------------------------------------
    // Module: otelcol_k8s_enrich
    // Centralized K8s label enrichment and mapping for OTelCol pipelines.
    // ---------------------------------------------------------------
    declare "otelcol_k8s_enrich" {
      argument "forward_to" {}

      otelcol.processor.k8sattributes "enrich" {
        output {
          metrics = [otelcol.processor.transform.add_legacy_labels.input]
        }
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.container.name", "k8s.node.name"]
        }
        pod_association {
          source {
            from = "connection"
          }
        }
      }

      otelcol.processor.transform "add_legacy_labels" {
        error_mode = "ignore"
        output {
          metrics = argument.forward_to.value
        }
        transformation {
          context = "resource"
          statements = [
            "set(attributes[\"namespace\"], attributes[\"k8s.namespace.name\"]) where attributes[\"k8s.namespace.name\"] != nil",
            "set(attributes[\"pod\"], attributes[\"k8s.pod.name\"]) where attributes[\"k8s.pod.name\"] != nil",
            "set(attributes[\"container\"], attributes[\"k8s.container.name\"]) where attributes[\"k8s.container.name\"] != nil",
            "set(attributes[\"node\"], attributes[\"k8s.node.name\"]) where attributes[\"k8s.node.name\"] != nil",
          ]
        }
      }

      export "input" {
        value = otelcol.processor.k8sattributes.enrich.input
      }
    }

    // ---------------------------------------------------------------
    // Module: otelcol_mimir_scrape
    // OTelCol-native scrape for Mimir microservices.
    // ---------------------------------------------------------------
    declare "otelcol_mimir_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "mimir"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "mimir" {
        targets = discovery.kubernetes.endpoints.targets
        
        // Keep only Mimir component services
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "mimir-(alertmanager|compactor|distributor|gateway|ingester|overrides-exporter|querier|query-frontend|query-scheduler|store-gateway)(-headless)?"
          action        = "keep"
        }
        // Keep http-metrics (gateway also exposes legacy-http-metrics)
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics|legacy-http-metrics"
          action        = "keep"
        }

        // App-specific labels via discovery metadata (most reliable)
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        rule {
          target_label = "job"
          replacement  = "mimir"
        }
        rule {
          target_label = "cluster"
          replacement  = "prod-bwcloud"
        }
        rule {
          target_label = "k8s_cluster_name"
          replacement  = "prod-bwcloud"
        }
      }

      prometheus.scrape "mimir" {
        targets    = discovery.relabel.mimir.output
        forward_to = [otelcol.receiver.prometheus.mimir.receiver]
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value

        clustering {
          enabled = true
        }
      }

      otelcol.receiver.prometheus "mimir" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ---------------------------------------------------------------
    // Module: otelcol_alloy_scrape
    // OTelCol-native scrape for Alloy self-metrics.
    // ---------------------------------------------------------------
    declare "otelcol_alloy_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "alloy" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
        rule {
          target_label = "cluster"
          replacement  = "prod-bwcloud"
        }
        rule {
          target_label = "k8s_cluster_name"
          replacement  = "prod-bwcloud"
        }
      }

      prometheus.scrape "alloy" {
        targets    = discovery.relabel.alloy.output
        forward_to = [otelcol.receiver.prometheus.alloy.receiver]
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value

        clustering {
          enabled = true
        }
      }

      otelcol.receiver.prometheus "alloy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ---------------------------------------------------------------
    // Module: otelcol_kubelet_scrape
    // OTelCol-native scrape for Kubelet metrics.
    // ---------------------------------------------------------------
    declare "otelcol_kubelet_scrape" {
      argument "forward_to" {}
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        
        // Filter: each Alloy pod only scrapes its OWN node to avoid duplication.
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
          action        = "keep"
        }

        rule {
          target_label = "job"
          replacement  = "kubelet"
        }
        rule {
          target_label = "cluster"
          replacement  = "prod-bwcloud"
        }
        rule {
          target_label = "k8s_cluster_name"
          replacement  = "prod-bwcloud"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        // Use InternalIP for reliable connectivity
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        forward_to = [otelcol.receiver.prometheus.kubelet.receiver]
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
      }

      otelcol.receiver.prometheus "kubelet" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ---------------------------------------------------------------
    // Module: otelcol_cadvisor_scrape
    // OTelCol-native scrape for cAdvisor metrics.
    // ---------------------------------------------------------------
    declare "otelcol_cadvisor_scrape" {
      argument "forward_to" {}
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        // Filter: each Alloy pod only scrapes its OWN node to avoid duplication.
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
          action        = "keep"
        }

        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        rule {
          target_label = "cluster"
          replacement  = "prod-bwcloud"
        }
        rule {
          target_label = "k8s_cluster_name"
          replacement  = "prod-bwcloud"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        // Use InternalIP for reliable connectivity
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }

      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        forward_to = [otelcol.receiver.prometheus.cadvisor.receiver]
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
      }

      otelcol.receiver.prometheus "cadvisor" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ---------------------------------------------------------------
    // Sink – OTelCol OTLP/HTTP exporter to Mimir distributor.
    // Mimir recommended path is OTLP over HTTP to port 8080.
    // ---------------------------------------------------------------
    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-gateway.mimir.svc.cluster.local/otlp"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
    }

    // ---------------------------------------------------------------
    // Instantiation
    // ---------------------------------------------------------------
    otelcol_k8s_enrich "global" {
      forward_to = [otelcol.exporter.otlphttp.mimir.input]
    }

    otelcol_mimir_scrape "default" {
      forward_to = otelcol_k8s_enrich.global.input
    }

    otelcol_alloy_scrape "default" {
      forward_to = otelcol_k8s_enrich.global.input
    }

    otelcol_kubelet_scrape "default" {
      forward_to = otelcol_k8s_enrich.global.input
    }

    otelcol_cadvisor_scrape "default" {
      forward_to = otelcol_k8s_enrich.global.input
    }
