apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    logging {
      level  = "info"
      format = "logfmt"
    }

    // ServiceMonitor-first ingestion for Kubernetes metrics domains.
    // Required ServiceMonitors are documented in docs/how-to-alloy.md.
    
    prometheus.operator.servicemonitors "kubernetes" {
      forward_to = [prometheus.relabel.metrics_normalize_filter.receiver]
    }

    // Central metric governance for all Prometheus-scraped components.
    // Strategy:
    // - target-specific relabeling remains in each discovery.relabel block
    // - metric-level normalization/filtering happens once here
    // - k8s_* mirror labels are generated here from canonical labels
    prometheus.relabel "metrics_normalize_filter" {
      // cAdvisor namespace scope (alloy|mimir); other jobs are unaffected.
      // This applies when cadvisor metrics are ingested via ServiceMonitor path.
      rule {
        source_labels = ["job", "namespace"]
        action        = "drop"
        regex         = "cadvisor;(?!alloy$|mimir$).+"
      }

      // Drop volatile/high-cardinality labels globally.
      rule {
        action = "labeldrop"
        regex  = "pod_uid|uid|container_id|image_id|annotation_.*"
      }

      // Build k8s_* mirror labels before labelkeep.
      // These are query-facing compatibility labels for dashboards/contracts.
      rule {
        source_labels = ["cluster"]
        target_label  = "k8s_cluster_name"
      }

      rule {
        source_labels = ["namespace"]
        target_label  = "k8s_namespace_name"
      }

      rule {
        source_labels = ["pod"]
        target_label  = "k8s_pod_name"
      }

      rule {
        source_labels = ["node"]
        target_label  = "k8s_node_name"
      }

      // Keep canonical query labels and selected metric dimensions.
      // This enforces a unified label contract across all scraped components.
      rule {
        action = "labelkeep"
        regex  = "__name__|job|instance|cluster|namespace|pod|node|k8s_cluster_name|k8s_namespace_name|k8s_pod_name|k8s_node_name|container|device|mountpoint|mode|cpu|interface|fstype|le|quantile|deployment|phase|condition|status"
      }

      forward_to = [otelcol.receiver.prometheus.all_metrics.receiver]
    }

    // Bridge flow-based Prometheus metrics into OTel processors.
    otelcol.receiver.prometheus "all_metrics" {
      output {
        metrics = [otelcol.processor.k8sattributes.enrich.input]
      }
    }

    // Accept application metrics pushed via OTLP (gRPC/HTTP).
    // This complements infrastructure scraping and uses the same export path.
    otelcol.receiver.otlp "apps" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.k8sattributes.enrich.input]
      }
    }

    // Kubernetes and cloud resource enrichment before export.
    otelcol.processor.k8sattributes "enrich" {
      auth_type = "serviceAccount"
      output {
        metrics = [otelcol.processor.resourcedetection.gcp.input]
      }
    }

    otelcol.processor.resourcedetection "gcp" {
      detectors = ["gcp"]
      override  = false
      output {
        metrics = [otelcol.processor.batch.default.input]
      }
    }

    //Keep one canonical key set (`namespace`, `pod`, `node`) to avoid
    //duplicate dimensions with both Prometheus-style and OTel-style labels.
    //TODO(Observability): When Gateway is introduced, move label governance
    //and multi-backend routing to the gateway pipeline.
    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.otlphttp.mimir.input]
      }
    }

    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "{{ .Values.alloy.alloyExample.mimir.endpoint }}"
        headers  = { "X-Scope-OrgID" = "{{ .Values.alloy.alloyExample.mimir.orgID }}" }
        tls {
          insecure = {{ .Values.alloy.alloyExample.mimir.insecure }}
        }
      }
    }
