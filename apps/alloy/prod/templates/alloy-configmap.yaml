apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – consolidated for stability (bypassing node limits).
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ---------------------------------------------------------------
    // Module: otelcol_k8s_enrich
    // Centralized K8s label enrichment for OTelCol pipelines.
    // ---------------------------------------------------------------
    declare "otelcol_k8s_enrich" {
      argument "forward_to" {}

      otelcol.processor.k8sattributes "enrich" {
        output {
          metrics = argument.forward_to.value
        }
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.container.name", "k8s.node.name"]
        }
      }
      export "input" {
        value = otelcol.processor.k8sattributes.enrich.input
      }
    }

    // ---------------------------------------------------------------
    // Module: otelcol_mimir_scrape
    // OTelCol-native scrape for Mimir microservices.
    // ---------------------------------------------------------------
    declare "otelcol_mimir_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "mimir"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "mimir" {
        targets = discovery.kubernetes.endpoints.targets
        
        // Keep only Mimir component services
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "mimir-(alertmanager|compactor|distributor|gateway|ingester|overrides-exporter|querier|query-frontend|query-scheduler|store-gateway)(-headless)?"
          action        = "keep"
        }
        // Keep http-metrics (gateway also exposes legacy-http-metrics)
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics|legacy-http-metrics"
          action        = "keep"
        }

        // App-specific label only
        rule {
          source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        rule {
          target_label = "job"
          replacement  = "mimir"
        }
        rule {
          target_label = "cluster"
          replacement  = "prod-bwcloud"
        }
        rule {
          target_label = "k8s_cluster_name"
          replacement  = "prod-bwcloud"
        }
      }

      prometheus.scrape "mimir" {
        targets    = discovery.relabel.mimir.output
        forward_to = [otelcol.receiver.prometheus.mimir.receiver]
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value

        clustering {
          enabled = true
        }
      }

      otelcol.receiver.prometheus "mimir" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ---------------------------------------------------------------
    // Module: otelcol_alloy_scrape
    // OTelCol-native scrape for Alloy self-metrics.
    // ---------------------------------------------------------------
    declare "otelcol_alloy_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "alloy" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
        rule {
          target_label = "cluster"
          replacement  = "prod-bwcloud"
        }
        rule {
          target_label = "k8s_cluster_name"
          replacement  = "prod-bwcloud"
        }
      }

      prometheus.scrape "alloy" {
        targets    = discovery.relabel.alloy.output
        forward_to = [otelcol.receiver.prometheus.alloy.receiver]
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value

        clustering {
          enabled = true
        }
      }

      otelcol.receiver.prometheus "alloy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ---------------------------------------------------------------
    // Sink – OTelCol OTLP/HTTP exporter to Mimir distributor.
    // Mimir recommended path is OTLP over HTTP to port 8080.
    // ---------------------------------------------------------------
    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-gateway.mimir.svc.cluster.local/otlp"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
    }

    // ---------------------------------------------------------------
    // Instantiation
    // ---------------------------------------------------------------
    otelcol_k8s_enrich "global" {
      forward_to = [otelcol.exporter.otlphttp.mimir.input]
    }

    otelcol_mimir_scrape "default" {
      forward_to = otelcol_k8s_enrich.global.input
    }

    otelcol_alloy_scrape "default" {
      forward_to = otelcol_k8s_enrich.global.input
    }
