apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular via River `declare` blocks.
    //
    // Layout:
    //   - declare "k8s_target_enrich"       : ONE place for k8s -> label
    //                                         enrichment (Prometheus +
    //                                         OpenTelemetry conventions).
    //   - declare "mimir_component_scrape"  : Mimir microservices
    //   - declare "alloy_self_scrape"       : Alloy self-metrics
    //   - prometheus.remote_write "mimir"   : single sink, sets
    //                                         external_labels (cluster).
    //   - <module> "default" { ... }        : instantiation / wiring
    //
    // Convention:
    //   * Static, environment-wide labels (cluster, k8s_cluster_name)
    //     live ONCE on remote_write.external_labels.
    //   * Per-target k8s attributes (namespace, pod, node, container,
    //     service) live ONCE in k8s_target_enrich.
    //   * Scrape modules only do: keep-filters + job label + app-specific
    //     labels (e.g. `component` for Mimir).
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ---------------------------------------------------------------
    // Module: k8s_target_enrich
    // Single source of truth for promoting Kubernetes meta-labels onto
    // the wire-level Prometheus labels of every scraped sample.
    //
    // Emits two parallel label families on every target:
    //   1. Prometheus de-facto convention (short names):
    //        namespace, pod, container, node, service
    //   2. OpenTelemetry semantic conventions (k8s.* -> k8s_*):
    //        k8s_namespace_name, k8s_pod_name, k8s_container_name,
    //        k8s_node_name
    //
    // Why both? Prom-native dashboards/alerts use the short names;
    // OTel-native tooling and traces/logs correlation use k8s_*. Having
    // both makes joins (e.g. metrics<->logs<->traces) trivial.
    // ---------------------------------------------------------------
    declare "k8s_target_enrich" {
      argument "targets" {
        comment = "List of discovery targets to enrich."
      }

      discovery.relabel "enriched" {
        targets = argument.targets.value

        // ---- Prometheus convention (short names) ----
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          target_label  = "service"
        }

        // ---- OpenTelemetry semantic conventions (k8s.*) ----
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "k8s_namespace_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "k8s_pod_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "k8s_container_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "k8s_node_name"
        }
      }

      export "output" {
        value = discovery.relabel.enriched.output
      }
    }

    // ---------------------------------------------------------------
    // Module: mimir_component_scrape
    // Discovers http-metrics endpoints of Mimir microservices, runs
    // them through k8s_target_enrich, then applies Mimir-specific
    // keep-filters and the `component` + `job` labels.
    // ---------------------------------------------------------------
    declare "mimir_component_scrape" {
      argument "forward_to" {
        comment = "List of prometheus receivers to forward samples to."
      }
      argument "namespace" {
        optional = true
        default  = "mimir"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      // Centralized k8s attribute promotion (namespace/pod/node/container/service
      // and k8s_* OTel conventions).
      k8s_target_enrich "mimir" {
        targets = discovery.kubernetes.endpoints.targets
      }

      discovery.relabel "components" {
        targets = k8s_target_enrich.mimir.output

        // Keep only Mimir component services
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "mimir-(alertmanager|compactor|distributor|gateway|ingester|overrides-exporter|querier|query-frontend|query-scheduler|store-gateway)(-headless)?"
          action        = "keep"
        }
        // Keep http-metrics (gateway also exposes legacy-http-metrics)
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics|legacy-http-metrics"
          action        = "keep"
        }

        // App-specific label only
        rule {
          source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        rule {
          target_label = "job"
          replacement  = "mimir"
        }
      }

      prometheus.scrape "components" {
        targets         = discovery.relabel.components.output
        forward_to      = argument.forward_to.value
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value
      }
    }

    // ---------------------------------------------------------------
    // Module: alloy_self_scrape
    // Scrapes Alloy's own http-metrics endpoint (default port 12345).
    // Enrichment is centralized in k8s_target_enrich; this module only
    // adds the `job` label and keep-filters.
    // ---------------------------------------------------------------
    declare "alloy_self_scrape" {
      argument "forward_to" {
        comment = "List of prometheus receivers to forward samples to."
      }
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      k8s_target_enrich "self" {
        targets = discovery.kubernetes.endpoints.targets
      }

      discovery.relabel "self" {
        targets = k8s_target_enrich.self.output

        // Keep only the Alloy Service
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        // Alloy exposes its own metrics on http-metrics
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }

        rule {
          target_label = "job"
          replacement  = "alloy"
        }
      }

      prometheus.scrape "self" {
        targets         = discovery.relabel.self.output
        forward_to      = argument.forward_to.value
        scrape_interval = argument.scrape_interval.value
        scrape_timeout  = argument.scrape_timeout.value
      }
    }

    // ---------------------------------------------------------------
    // Sink – single remote_write to Mimir distributor (tenant "1").
    //
    // Static, environment-wide labels live here (NOT in scrape modules),
    // so adding a new module never duplicates them and switching cluster
    // is a one-line change. Both Prom and OTel conventions are emitted.
    // ---------------------------------------------------------------
    prometheus.remote_write "mimir" {
      external_labels = {
        cluster          = "prod-bwcloud",
        k8s_cluster_name = "prod-bwcloud",
      }

      endpoint {
        url = "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"

        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
    }

    // ---------------------------------------------------------------
    // Instantiation – wire modules to the sink.
    // ---------------------------------------------------------------
    mimir_component_scrape "default" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    alloy_self_scrape "default" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
