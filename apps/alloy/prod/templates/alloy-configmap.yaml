apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular via River `declare` blocks and imports.
    //
    // Layout:
    //   - declare "otelcol_k8s_enrich"      : OTelCol-native k8s label enrichment
    //   - declare "otelcol_alloy_scrape"    : Alloy self-metrics scrape (OTelCol)
    //   - import.file "mimir"               : Load Mimir scrape modules from volume
    //   - otelcol.exporter.otlp "mimir"     : single sink, sets resource attributes (cluster)
    //   - <module> "default" { ... }        : instantiation / wiring
    //
    // Convention:
    //   * Static, environment-wide resource attributes (cluster, k8s_cluster_name)
    //     live ONCE on otelcol.exporter.otlp.resource.
    //   * Per-target k8s attributes (namespace, pod, node, container,
    //     service, k8s_*) live ONCE in otelcol.processor.k8sattributes.
    //   * Scrape modules only do: keep-filters + job label + app-specific
    //     labels (e.g. `component` for Mimir).
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ---------------------------------------------------------------
    // Module: otelcol_k8s_enrich
    // OTelCol-native k8sattributes processor for resource enrichment.
    // Applies both Prometheus and OTel semantic conventions.
    // ---------------------------------------------------------------
    declare "otelcol_k8s_enrich" {
      argument "input" {
        comment = "Input pipeline for metrics."
      }
      otelcol.processor.k8sattributes "enrich" {
        inputs = [argument.input.value]
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.container.name", "k8s.node.name"]
        }
        pod_association {
          sources = ["resource_attribute"]
        }
      }
      export "output" {
        value = otelcol.processor.k8sattributes.enrich.output
      }
    }

    // ---------------------------------------------------------------
    // Import: Mimir Scrape Modules
    // Loads the otelcol_mimir_scrape module from the mounted ConfigMap.
    // ---------------------------------------------------------------
    import.file "mimir" {
      filename = "/etc/alloy/modules/mimir-modules.river"
    }

    // ---------------------------------------------------------------
    // Module: otelcol_alloy_scrape
    // OTelCol-native scrape for Alloy self-metrics, with k8s enrichment.
    // ---------------------------------------------------------------
    declare "otelcol_alloy_scrape" {
      argument "forward_to" {
        comment = "List of OTelCol exporters to forward metrics to."
      }
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      otelcol.receiver.prometheus "alloy" {
        config {
          scrape_configs = [{
            job_name        = "alloy"
            kubernetes_sd_configs = [{
              role = "endpoints"
              namespaces = { names = [argument.namespace.value] }
            }]
            relabel_configs = [
              {
                source_labels = ["__meta_kubernetes_service_name"]
                regex         = argument.service_name.value
                action        = "keep"
              },
              {
                source_labels = ["__meta_kubernetes_endpoint_port_name"]
                regex         = "http-metrics"
                action        = "keep"
              },
              {
                target_label = "job"
                replacement  = "alloy"
                action       = "replace"
              }
            ]
            scrape_interval = argument.scrape_interval.value
            scrape_timeout  = argument.scrape_timeout.value
          }]
        }
      }

      otelcol_k8s_enrich "alloy" {
        input = otelcol.receiver.prometheus.alloy.output
      }

      export "output" {
        value = otelcol_k8s_enrich.alloy.output
      }
    }

    // ---------------------------------------------------------------
    // Sink – OTelCol OTLP exporter to Mimir distributor (tenant "1").
    //
    // Static, environment-wide resource attributes live here (NOT in scrape modules),
    // so adding a new module never duplicates them and switching cluster
    // is a one-line change. Both Prom and OTel conventions are emitted.
    // ---------------------------------------------------------------
    otelcol.exporter.otlp "mimir" {
      client {
        endpoint = "mimir-distributor.mimir.svc.cluster.local:4317"
        tls {
          insecure = true
        }
        headers = {
          "X-Scope-OrgID" = "1"
        }
        resource {
          attributes = {
            cluster          = "prod-bwcloud"
            k8s_cluster_name = "prod-bwcloud"
          }
        }
      }
    }

    // ---------------------------------------------------------------
    // Instantiation – wire modules to the OTelCol OTLP exporter sink.
    // ---------------------------------------------------------------
    mimir.otelcol_mimir_scrape "default" {
      forward_to = [otelcol.exporter.otlp.mimir.input]
    }

    otelcol_alloy_scrape "default" {
      forward_to = [otelcol.exporter.otlp.mimir.input]
    }
