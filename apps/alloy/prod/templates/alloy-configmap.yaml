apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular architecture (Receive -> Process -> Export)
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ===============================================================
    // PHASE 3: EXPORT
    // ===============================================================

    local.file_match "queue_storage" {
      path_targets = [{"__path__" = "/tmp/alloy/queue"}]
    }

    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-distributor.mimir.svc.cluster.local:8080/otlp"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
      sending_queue {
        enabled    = true
        queue_size = 5000
        storage    = local.file_match.queue_storage.targets[0] 
      }
      retry_on_failure {
        enabled          = true
        max_elapsed_time = "5m"
      }
    }

    // ===============================================================
    // PHASE 2: PROCESS (Central Enrichment & Label Mapping)
    // ===============================================================

    declare "otelcol_pipeline_process" {
      argument "forward_to" {}

      // 6. Batching
      otelcol.processor.batch "default" {
        output { metrics = [argument.forward_to.value] }
        send_batch_size = 1024
        timeout         = "5s"
      }

      // 5. Mirror Legacy Labels and Cleanup
      otelcol.processor.transform "mirror_legacy_labels" {
        error_mode = "ignore"
        output { metrics = [otelcol.processor.batch.default.input] }
        
        metric_statements {
          context = "datapoint"
          statements = [
            "set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
            "set(attributes[\"cluster\"],   resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil",
            "set(attributes[\"k8s_cluster_name\"], resource.attributes[\"k8s.cluster.name\"]) where resource.attributes[\"k8s.cluster.name\"] != nil",
            "set(attributes[\"pod\"],       resource.attributes[\"k8s.pod.name\"]) where resource.attributes[\"k8s.pod.name\"] != nil",
            "set(attributes[\"k8s_pod_name\"], resource.attributes[\"k8s.pod.name\"]) where resource.attributes[\"k8s.pod.name\"] != nil",
            "set(attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
            "set(attributes[\"k8s_container_name\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
            "set(attributes[\"node\"],      resource.attributes[\"k8s.node.name\"]) where resource.attributes[\"k8s.node.name\"] != nil",
            "set(attributes[\"k8s_node_name\"], resource.attributes[\"k8s.node.name\"]) where resource.attributes[\"k8s.node.name\"] != nil",
            "set(attributes[\"k8s_namespace_name\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
          ]
        }

        metric_statements {
          context = "resource"
          statements = [
            "delete_key(attributes, \"k8s.pod.ip\")",
          ]
        }
      }

      // 4. Inject Cluster Name
      otelcol.processor.resource "inject_cluster" {
        output { metrics = [otelcol.processor.transform.mirror_legacy_labels.input] }
        attributes {
          action = "insert"
          key    = "k8s.cluster.name"
          value  = "prod-bwcloud"
        }
      }

      // 3. K8s Attributes Enrichment
      otelcol.processor.k8sattributes "global_enrich" {
        output { metrics = [otelcol.processor.resource.inject_cluster.input] }
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"]
          deployment_name_from_replicaset = true
        }
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.ip"
          }
        }
        pod_association {
          source {
            from = "connection"
          }
        }
      }

      // 2. Promote Pod IP to Resource Level
      otelcol.processor.transform "promote_pod_ip" {
        output { metrics = [otelcol.processor.k8sattributes.global_enrich.input] }
        metric_statements {
          context = "datapoint"
          statements = [
            "set(resource.attributes[\"k8s.pod.ip\"], attributes[\"k8s_pod_ip\"]) where attributes[\"k8s_pod_ip\"] != nil",
            "delete_key(attributes, \"k8s_pod_ip\") where attributes[\"k8s_pod_ip\"] != nil",
          ]
        }
      }

      // 1. Memory Limiter (OOM Schutz) Limit: 400 MiB (80% of 512 MiB limit)
      otelcol.processor.memory_limiter "default" {
        output { metrics = [otelcol.processor.transform.promote_pod_ip.input] }
        check_interval  = "1s"
        limit_mib       = 400
        spike_limit_mib = 100
      }

      export "input" {
        value = otelcol.processor.memory_limiter.default.input
      }
    }

    // ===============================================================
    // PHASE 1: RECEIVE (Target-Specific Scrapes)
    // ===============================================================

    // --- Module: Mimir Scrape ---
    declare "otelcol_mimir_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "mimir"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "mimir" {
        targets = discovery.kubernetes.endpoints.targets
        
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "mimir-(alertmanager|compactor|distributor|gateway|ingester|overrides-exporter|querier|query-frontend|query-scheduler|store-gateway)(-headless)?"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics|legacy-http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip" 
        }
        rule {
          source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        rule {
          target_label = "job"
          replacement  = "mimir"
        }
      }

      prometheus.scrape "mimir" {
        targets    = discovery.relabel.mimir.output
        forward_to = [otelcol.receiver.prometheus.mimir.receiver]
      }

      otelcol.receiver.prometheus "mimir" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Alloy Scrape ---
    declare "otelcol_alloy_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "alloy" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip" 
        }
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
      }

      prometheus.scrape "alloy" {
        targets    = discovery.relabel.alloy.output
        forward_to = [otelcol.receiver.prometheus.alloy.receiver]
      }

      otelcol.receiver.prometheus "alloy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kubelet Scrape ---
    declare "otelcol_kubelet_scrape" {
      argument "forward_to" {}

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kubelet"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        forward_to = [otelcol.receiver.prometheus.kubelet.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
      }

      otelcol.receiver.prometheus "kubelet" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: cAdvisor Scrape ---
    declare "otelcol_cadvisor_scrape" {
      argument "forward_to" {}

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }

      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        forward_to = [otelcol.receiver.prometheus.cadvisor.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
      }

      otelcol.receiver.prometheus "cadvisor" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kube-State-Metrics Scrape ---
    declare "otelcol_ksm_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "ksm" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "(alloy-)?kube-state-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http|http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip" 
        }
        rule {
          target_label = "job"
          replacement  = "kube-state-metrics"
        }
      }

      prometheus.scrape "ksm" {
        targets    = discovery.relabel.ksm.output
        forward_to = [otelcol.receiver.prometheus.ksm.receiver]
      }

      otelcol.receiver.prometheus "ksm" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Node-Exporter Scrape ---
    declare "otelcol_node_exporter_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "(alloy-)?(prometheus-)?node-exporter"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "metrics|http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "k8s_pod_ip" 
        }
        rule {
          target_label = "job"
          replacement  = "node-exporter"
        }
      }

      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [otelcol.receiver.prometheus.node_exporter.receiver]
      }

      otelcol.receiver.prometheus "node_exporter" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ===============================================================
    // INSTANTIATION
    // ===============================================================

    otelcol_pipeline_process "global" {
      forward_to = otelcol.exporter.otlphttp.mimir.input
    }

    otelcol_mimir_scrape "default" {
      forward_to = [otelcol_pipeline_process.global.exports.input]
    }

    otelcol_alloy_scrape "default" {
      forward_to = [otelcol_pipeline_process.global.exports.input]
    }

    otelcol_kubelet_scrape "default" {
      forward_to = [otelcol_pipeline_process.global.exports.input]
    }

    otelcol_cadvisor_scrape "default" {
      forward_to = [otelcol_pipeline_process.global.exports.input]
    }

    otelcol_ksm_scrape "default" {
      forward_to = [otelcol_pipeline_process.global.exports.input]
    }

    otelcol_node_exporter_scrape "default" {
      forward_to = [otelcol_pipeline_process.global.exports.input]
    }
