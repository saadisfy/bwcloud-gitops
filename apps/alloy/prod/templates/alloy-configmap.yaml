apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // =================================================================
    // Alloy config – modular architecture (Receive -> Process -> Export)
    // =================================================================

    logging {
      level  = "info"
      format = "logfmt"
    }

    // ===============================================================
    // PHASE 2: PROCESS (Central Enrichment & Label Mapping)
    // ===============================================================

    declare "otelcol_pipeline_process" {
      argument "forward_to" {}

      // 1. Enrich with Kubernetes Metadata
      otelcol.processor.k8sattributes "enrich" {
        output {
          metrics = [otelcol.processor.transform.mirror_labels.input]
        }
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.container.name",
            "k8s.node.name",
            "k8s.deployment.name",
            "k8s.statefulset.name",
            "k8s.daemonset.name",
            "k8s.cronjob.name",
            "k8s.job.name",
          ]
        }
        pod_association {
          source {
            from = "connection"
          }
        }
      }

      // 2. Mirror OTel attributes to legacy Prometheus labels for dashboard compatibility
      otelcol.processor.transform "mirror_labels" {
        error_mode = "ignore"
        output {
          metrics = argument.forward_to.value
        }
        metric_statements {
          context = "resource"
          statements = [
            "set(attributes[\"namespace\"], attributes[\"k8s.namespace.name\"]) where attributes[\"k8s.namespace.name\"] != nil",
            "set(attributes[\"pod\"], attributes[\"k8s.pod.name\"]) where attributes[\"k8s.pod.name\"] != nil",
            "set(attributes[\"container\"], attributes[\"k8s.container.name\"]) where attributes[\"k8s.container.name\"] != nil",
            "set(attributes[\"node\"], attributes[\"k8s.node.name\"]) where attributes[\"k8s.node.name\"] != nil",
            "set(attributes[\"cluster\"], \"prod-bwcloud\")",
            "set(attributes[\"k8s_cluster_name\"], \"prod-bwcloud\")",
          ]
        }
      }

      export "input" {
        value = otelcol.processor.k8sattributes.enrich.input
      }
    }

    // ===============================================================
    // PHASE 1: RECEIVE (Target-Specific Scrapes)
    // ===============================================================

    // --- Module: Mimir Scrape ---
    declare "otelcol_mimir_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "mimir"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "mimir" {
        targets = discovery.kubernetes.endpoints.targets
        
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "mimir-(alertmanager|compactor|distributor|gateway|ingester|overrides-exporter|querier|query-frontend|query-scheduler|store-gateway)(-headless)?"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics|legacy-http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        rule {
          target_label = "job"
          replacement  = "mimir"
        }
      }

      prometheus.scrape "mimir" {
        targets    = discovery.relabel.mimir.output
        forward_to = [otelcol.receiver.prometheus.mimir.receiver]
      }

      otelcol.receiver.prometheus "mimir" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Alloy Scrape ---
    declare "otelcol_alloy_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }
      argument "service_name" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "alloy" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = argument.service_name.value
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
      }

      prometheus.scrape "alloy" {
        targets    = discovery.relabel.alloy.output
        forward_to = [otelcol.receiver.prometheus.alloy.receiver]
      }

      otelcol.receiver.prometheus "alloy" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kubelet Scrape ---
    declare "otelcol_kubelet_scrape" {
      argument "forward_to" {}

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kubelet"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        forward_to = [otelcol.receiver.prometheus.kubelet.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
      }

      otelcol.receiver.prometheus "kubelet" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: cAdvisor Scrape ---
    declare "otelcol_cadvisor_scrape" {
      argument "forward_to" {}

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "${1}:10250"
        }
      }

      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        forward_to = [otelcol.receiver.prometheus.cadvisor.receiver]
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
      }

      otelcol.receiver.prometheus "cadvisor" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Kube-State-Metrics Scrape ---
    declare "otelcol_ksm_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "ksm" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "(alloy-)?kube-state-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "http|http-metrics"
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "kube-state-metrics"
        }
      }

      prometheus.scrape "ksm" {
        targets    = discovery.relabel.ksm.output
        forward_to = [otelcol.receiver.prometheus.ksm.receiver]
      }

      otelcol.receiver.prometheus "ksm" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // --- Module: Node-Exporter Scrape ---
    declare "otelcol_node_exporter_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "alloy"
      }

      discovery.kubernetes "endpoints" {
        role = "endpoints"
        namespaces {
          names = [argument.namespace.value]
        }
      }

      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          regex         = "(alloy-)?(prometheus-)?node-exporter"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          regex         = "metrics|http-metrics"
          action        = "keep"
        }
        rule {
          target_label = "job"
          replacement  = "node-exporter"
        }
      }

      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [otelcol.receiver.prometheus.node_exporter.receiver]
      }

      otelcol.receiver.prometheus "node_exporter" {
        output {
          metrics = [argument.forward_to.value]
        }
      }
    }

    // ===============================================================
    // PHASE 3: EXPORT (Sink)
    // ===============================================================

    otelcol.exporter.otlphttp "mimir" {
      client {
        endpoint = "http://mimir-gateway.mimir.svc.cluster.local/otlp"
        headers = {
          "X-Scope-OrgID" = "1",
        }
      }
    }

    // ===============================================================
    // INSTANTIATION
    // ===============================================================

    otelcol_pipeline_process "global" {
      forward_to = [otelcol.exporter.otlphttp.mimir.input]
    }

    otelcol_mimir_scrape "default" {
      forward_to = otelcol_pipeline_process.global.input
    }

    otelcol_alloy_scrape "default" {
      forward_to = otelcol_pipeline_process.global.input
    }

    otelcol_kubelet_scrape "default" {
      forward_to = otelcol_pipeline_process.global.input
    }

    otelcol_cadvisor_scrape "default" {
      forward_to = otelcol_pipeline_process.global.input
    }

    otelcol_ksm_scrape "default" {
      forward_to = otelcol_pipeline_process.global.input
    }

    otelcol_node_exporter_scrape "default" {
      forward_to = otelcol_pipeline_process.global.input
    }
