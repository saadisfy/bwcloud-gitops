apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  config.alloy: |-
    // Temporary no-op config:
    // - Alloy runs as DaemonSet but does not scrape or export anything.
    // - Keep only logging so pods stay healthy and observable.
    logging {
      level  = "info"
      format = "logfmt"
    }
