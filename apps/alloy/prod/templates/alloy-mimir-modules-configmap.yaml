apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-mimir-modules
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-wrapper
data:
  mimir-modules.river: |
    // Module: otelcol_mimir_scrape
    declare "otelcol_mimir_scrape" {
      argument "forward_to" {}
      argument "namespace" {
        optional = true
        default  = "mimir"
      }
      argument "scrape_interval" {
        optional = true
        default  = "30s"
      }
      argument "scrape_timeout" {
        optional = true
        default  = "10s"
      }

      otelcol.receiver.prometheus "mimir" {
        config = <<-EOT
          scrape_configs:
            - job_name: mimir
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names:
                      - ${argument.namespace.value}
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  regex: mimir-(alertmanager|compactor|distributor|gateway|ingester|overrides-exporter|querier|query-frontend|query-scheduler|store-gateway)(-headless)?
                  action: keep
                - source_labels: [__meta_kubernetes_endpoint_port_name]
                  regex: http-metrics|legacy-http-metrics
                  action: keep
                - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
                  target_label: component
                  action: replace
                - target_label: job
                  replacement: mimir
                  action: replace
              scrape_interval: ${argument.scrape_interval.value}
              scrape_timeout: ${argument.scrape_timeout.value}
        EOT
      }

      otelcol_k8s_enrich "mimir" {
        input = otelcol.receiver.prometheus.mimir.output
      }

      export "output" {
        value = otelcol_k8s_enrich.mimir.output
      }
    }
