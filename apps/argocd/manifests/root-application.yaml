# Root Application: managed alle ApplicationSets unter appsets/
# Einmal anwenden: kubectl apply -f apps/argocd/manifests/root-application.yaml
# Danach synct die Root-App die appsets/ und erzeugt/aktualisiert alle ApplicationSets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saadisfy/bwcloud-gitops.git
    targetRevision: main
    path: appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
