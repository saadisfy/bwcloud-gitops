# Argo CD prod – alle gewünschten Argo-CD-Konfigurationen (Repositories etc.)
# Git-Repo mit Token: separat über manifests/argocd-repo-bwcloud-gitops.yaml anwenden (nicht hier, Token nicht ins Git).
argo-cd:
  global:
    domain: argocd.saadisfy.me
  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - argocd.saadisfy.me
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      tls:
        - secretName: argocd-tls
          hosts:
            - argocd.saadisfy.me
  configs:
    params:
      server.insecure: true
    repositories:
      # Public Helm-Repos für Wrapper-Chart-Dependencies
      repo-grafana-helm:
        type: helm
        name: grafana
        url: https://grafana.github.io/helm-charts
      repo-open-telemetry-helm:
        type: helm
        name: open-telemetry
        url: https://open-telemetry.github.io/opentelemetry-helm-charts
      repo-argo-helm:
        type: helm
        name: argo
        url: https://argoproj.github.io/argo-helm
