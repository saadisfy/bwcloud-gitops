# Argo CD prod – alle gewünschten Argo-CD-Konfigurationen (Repositories etc.)
# Git-Repo mit Token: separat über 0day-deployment-manifests/argocd-repo-bwcloud-gitops.yaml anwenden (nicht hier, Token nicht ins Git).
argo-cd:
  global:
    domain: argocd.saadisfy.me
  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - argocd.saadisfy.me
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      tls:
        - secretName: argocd-tls
          hosts:
            - argocd.saadisfy.me
  configs:
    cm:
      # Dedizierter API-Account für MCP-Nutzung (kein UI-Login).
      accounts.mcp: apiKey
      accounts.mcp.enabled: "true"
      # GitHub SSO via built-in Dex. Client ID/Secret werden aus dem
      # Secret `argocd-github-oauth` (Namespace argocd, Label
      # app.kubernetes.io/part-of=argocd) per `$<secret>:<key>` interpoliert.
      # Secret stammt aus 0day-deployment-manifests/sso-secrets.yaml (gitignored).
      url: https://argocd.saadisfy.me
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $argocd-github-oauth:clientID
              clientSecret: $argocd-github-oauth:clientSecret
              # Kein orgs:-Filter -> jeder GitHub-User darf sich anmelden.
              # Berechtigungen werden ausschließlich über RBAC unten gesteuert.
              # GitHub-Login statt E-Mail als User-ID verwenden. Sonst schlägt
              # der Login fehl, wenn der User keine verifizierte/öffentliche
              # primäre E-Mail hat ("github: user has no verified, primary email").
              # Die RBAC-Regel `g, saadisfy, role:admin` matched dann direkt auf
              # den GitHub-Username.
              useLoginAsID: true
      # UI-/CLI-Session-Lebensdauer: 30 Tage, damit ein Pod-Roll (Self-Sync von
      # Argo CD) oder das Default-24h-TTL einen nicht ständig ausloggt.
      users.session.duration: 720h
      # Banner im UI (auch auf der Login-Seite) — weist User darauf hin, warum
      # GitHub-SSO "Internal Server Error" zeigt, wenn ihr GitHub-Account keine
      # verifizierte, öffentliche primäre E-Mail hat. Dex' eigene Fehlerseite
      # lässt sich nicht anpassen, also machen wir es hier prominent.
      ui.bannercontent: "GitHub-SSO Login failed? GitHub account needs a verified, public primary email. Check https://github.com/settings/emails, then revoke the sso_argo OAuth app under https://github.com/settings/applications and log in again."
      ui.bannerpermanent: "true"
      ui.bannerposition: "top"
    params:
      server.insecure: true
    rbac:
      # Default-Rolle für alle authentifizierten Nutzer (inkl. SSO):
      # readonly = nur `get` auf alle Ressourcen, kein sync/refresh/override/etc.
      policy.default: role:readonly
      # Nur mein eigener GitHub-Login bekommt Admin. Alle anderen GitHub-User
      # bleiben bei policy.default = role:readonly (absolutes Minimum).
      # Die mcp-Rolle bleibt für den lokalen API-Account erhalten.
      scopes: "[preferred_username, email, groups]"
      policy.csv: |
        p, role:mcp, applications, get, */*, allow
        p, role:mcp, applications, sync, */*, allow
        p, role:mcp, projects, get, *, allow
        g, mcp, role:mcp
        g, saadisfy, role:admin
    secret:
      # Argo CD (Go bcrypt) erwartet i.d.R. $2a/$2b. Mit $2y kann es zu unerwünschter Rotation kommen.
      # Plaintext-Passwort liegt im Passwort-Manager; hier nur der bcrypt-Hash.
      argocdServerAdminPassword: "$2a$10$P3NxFPXA4063yhcR1alN/eyVmkv/QZ7T4tTCvM4aBmPETdM1p92Fq"
      argocdServerAdminPasswordMtime: "2026-04-18T21:30:00Z"
    repositories:
      # Public Helm-Repos für Wrapper-Chart-Dependencies
      repo-grafana-helm:
        type: helm
        name: grafana
        url: https://grafana.github.io/helm-charts
      repo-open-telemetry-helm:
        type: helm
        name: open-telemetry
        url: https://open-telemetry.github.io/opentelemetry-helm-charts
      repo-argo-helm:
        type: helm
        name: argo
        url: https://argoproj.github.io/argo-helm
      repo-stakater-helm:
        type: helm
        name: stakater
        url: https://stakater.github.io/stakater-charts
