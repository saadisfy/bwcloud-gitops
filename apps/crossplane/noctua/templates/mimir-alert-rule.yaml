apiVersion: ruler.mimir.crossplane.io/v1alpha1
kind: GroupAlerting
metadata:
  name: mimir-test-alerts
  annotations:
    crossplane.io/external-name: "1/mimir-test-alerts/test-alerts"
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  forProvider:
    orgId: "1"
    namespace: "mimir-test-alerts"
    interval: "1m"
    rule:
      - alert: "MimirAlwaysFiringAlert"
        expr: "vector(1)"
        for: "10s"
        labels:
          severity: "warning"
        annotations:
          summary: "Mimir test alert is firing!"
          description: "This alert is generated by Mimir Ruler and routed to Telegram via Crossplane Alertmanager config."
  providerConfigRef:
    name: default
