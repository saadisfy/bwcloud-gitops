# Phase 2 of Kibana SSO: inject OIDC client secret, enable the Dex OIDC realm, restart ES.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "configmaps"]
    verbs: ["get", "list", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configure-oidc-keystore
subjects:
  - kind: ServiceAccount
    name: configure-oidc-keystore
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: configure-oidc-keystore
      restartPolicy: Never
      containers:
        - name: configure-oidc-keystore
          image: bitnami/kubectl:1.31
          imagePullPolicy: IfNotPresent
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kibana-oidc-credentials
                  key: xpack.security.authc.realms.oidc.oidc1.rp.client_secret
          command:
            - bash
            - -ec
            - |
              set -euo pipefail
              NS="{{ .Release.Namespace }}"
              CM="elasticsearch-master-config"
              POD=""
              for i in $(seq 1 60); do
                POD=$(kubectl get pod -n "$NS" -l app=elasticsearch-master -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' 2>/dev/null | awk '{print $1}')
                if [ -n "$POD" ]; then
                  CODE=$(kubectl exec -n "$NS" "$POD" -c elasticsearch -- curl -sk -o /dev/null -w "%{http_code}" https://127.0.0.1:9200/ || true)
                  if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
                    break
                  fi
                fi
                sleep 5
              done
              [ -n "$POD" ] || { echo "Elasticsearch pod not ready"; exit 1; }

              echo "Adding OIDC client secret to keystore on $POD..."
              if ! kubectl exec -n "$NS" "$POD" -c elasticsearch -- bin/elasticsearch-keystore list | grep -q 'xpack.security.authc.realms.oidc.oidc1.rp.client_secret'; then
                printf '%s' "$OIDC_CLIENT_SECRET" | kubectl exec -i -n "$NS" "$POD" -c elasticsearch -- \
                  bin/elasticsearch-keystore add -x -f xpack.security.authc.realms.oidc.oidc1.rp.client_secret
              fi

              CURRENT=$(kubectl get configmap "$CM" -n "$NS" -o jsonpath='{.data.elasticsearch\.yml}')
              if echo "$CURRENT" | grep -q 'realms.oidc.oidc1'; then
                echo "OIDC realm already present in ConfigMap"
              else
                echo "Enabling OIDC realm in $CM..."
                kubectl get configmap "$CM" -n "$NS" -o json | python3 -c "
              import json, os, sys
              doc = json.load(sys.stdin)
              oidc = '''xpack.security.authc.realms.oidc.oidc1:
                order: 2
                rp.client_id: kibana
                rp.response_type: code
                rp.redirect_uri: https://kibana.saadisfy.me/api/security/oidc/callback
                rp.post_logout_redirect_uri: https://kibana.saadisfy.me/security/logged_out
                op.issuer: https://argocd.saadisfy.me/api/dex
                op.authorization_endpoint: https://argocd.saadisfy.me/api/dex/auth
                op.token_endpoint: https://argocd.saadisfy.me/api/dex/token
                op.jwkset_path: https://argocd.saadisfy.me/api/dex/keys
                op.userinfo_endpoint: https://argocd.saadisfy.me/api/dex/userinfo
                claims.principal: preferred_username
              '''
              doc['data']['elasticsearch.yml'] = doc['data']['elasticsearch.yml'].rstrip() + '\n' + oidc
              json.dump(doc, sys.stdout)
              " | kubectl apply -f -
              fi

              echo "Restarting $POD to load OIDC configuration..."
              kubectl delete pod -n "$NS" "$POD" --wait=false
              echo "OIDC SSO configured."
