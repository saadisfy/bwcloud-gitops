# Writes the OIDC client secret into the Elasticsearch keystore and restarts the node.
# Helm's keystore subPath mount conflicts with the ES docker entrypoint on rollout.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configure-oidc-keystore
subjects:
  - kind: ServiceAccount
    name: configure-oidc-keystore
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-oidc-keystore
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: configure-oidc-keystore
      restartPolicy: Never
      containers:
        - name: configure-oidc-keystore
          image: bitnami/kubectl:1.31
          imagePullPolicy: IfNotPresent
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kibana-oidc-credentials
                  key: xpack.security.authc.realms.oidc.oidc1.rp.client_secret
          command:
            - bash
            - -ec
            - |
              set -euo pipefail
              NS="{{ .Release.Namespace }}"
              POD=""
              for i in $(seq 1 60); do
                POD=$(kubectl get pod -n "$NS" -l app=elasticsearch-master -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' 2>/dev/null | awk '{print $1}')
                if [ -n "$POD" ]; then
                  if kubectl exec -n "$NS" "$POD" -c elasticsearch -- curl -sk -o /dev/null -w "%{http_code}" https://127.0.0.1:9200/ | grep -qE '200|401'; then
                    break
                  fi
                fi
                sleep 5
              done
              [ -n "$POD" ] || { echo "Elasticsearch pod not ready"; exit 1; }

              echo "Adding OIDC client secret to keystore on $POD..."
              if kubectl exec -n "$NS" "$POD" -c elasticsearch -- bin/elasticsearch-keystore list | grep -q 'xpack.security.authc.realms.oidc.oidc1.rp.client_secret'; then
                echo "OIDC client secret already in keystore"
              else
                printf '%s' "$OIDC_CLIENT_SECRET" | kubectl exec -i -n "$NS" "$POD" -c elasticsearch -- \
                  bin/elasticsearch-keystore add -x -f xpack.security.authc.realms.oidc.oidc1.rp.client_secret
              fi

              echo "Restarting $POD to load keystore..."
              kubectl delete pod -n "$NS" "$POD" --wait=false
              echo "OIDC keystore configured."
