elasticsearch:
  replicas: 1
  minimumMasterNodes: 1
  antiAffinity: "soft"
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  volumeClaimTemplate:
    resources:
      requests:
        storage: 2Gi

  # OIDC realm is applied by post-install hook after the client secret is in the keystore.
  esConfig:
    elasticsearch.yml: |
      xpack.security.authc.token.enabled: true
    role_mapping.yml: |
      oidc_admin:
        enabled: true
        roles:
          - superuser
        rules:
          - field:
              username: saadisfy
              realm.name: oidc1
      oidc_viewer:
        enabled: true
        roles:
          - viewer
        rules:
          - field:
              realm.name: oidc1
