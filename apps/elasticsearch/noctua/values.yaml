elasticsearch:
  replicas: 1
  minimumMasterNodes: 1
  antiAffinity: "soft"
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  volumeClaimTemplate:
    resources:
      requests:
        storage: 2Gi

  # OIDC realm: Argo CD Dex (GitHub SSO) — Client-Secret via keystore secret
  # `kibana-oidc-credentials` (0day-deployment-manifests/grafana-secrets.yaml).
  keystore:
    - secretName: kibana-oidc-credentials

  esConfig:
    elasticsearch.yml: |
      xpack.security.authc.token.enabled: true
      xpack.security.authc.realms.oidc.oidc1:
        order: 2
        rp.client_id: kibana
        rp.response_type: code
        rp.redirect_uri: https://kibana.saadisfy.me/api/security/oidc/callback
        rp.post_logout_redirect_uri: https://kibana.saadisfy.me/security/logged_out
        op.issuer: https://argocd.saadisfy.me/api/dex
        op.authorization_endpoint: https://argocd.saadisfy.me/api/dex/auth
        op.token_endpoint: https://argocd.saadisfy.me/api/dex/token
        op.jwkset_path: https://argocd.saadisfy.me/api/dex/keys
        op.userinfo_endpoint: https://argocd.saadisfy.me/api/dex/userinfo
        claims.principal: preferred_username
    role_mapping.yml: |
      oidc_admin:
        enabled: true
        roles:
          - superuser
        rules:
          - field:
              username: saadisfy
              realm.name: oidc1
      oidc_viewer:
        enabled: true
        roles:
          - viewer
        rules:
          - field:
              realm.name: oidc1
