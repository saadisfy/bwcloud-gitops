# Grafana - base values (all stages)
grafana:
  adminUser: admin
  # adminPassword: set in <stage>/values.yaml so Helm chart creates/updates the Secret (GitOps)
  podAnnotations:
    reloader.stakater.com/auto: "true"  # Stakater Reloader: Rolling Restart bei Secret-Änderung
  # Nach jedem Start (inkl. nach Reloader-Neustart bei Passwort-Änderung) DB-Passwort an Secret angleichen
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - 'sleep 25 && grafana cli admin reset-admin-password "$GF_SECURITY_ADMIN_PASSWORD" || true'
  # Mimir als Prometheus-Datasource über lokales Netz (Service, kein Ingress)
  datasources:
    alertmanager.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir Alertmanager
          type: alertmanager
          uid: mimir-am
          access: proxy
          url: http://mimir-gateway.mimir.svc.cluster.local
          jsonData:
            handleGrafanaManagedAlerts: true
            implementation: mimir
            httpHeaderName1: X-Scope-OrgID
          secureJsonData:
            httpHeaderValue1: "1"
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          access: proxy
          uid: mimir
          url: http://mimir-gateway.mimir.svc.cluster.local/prometheus
          isDefault: true
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            manageAlerts: true
            alertmanagerUid: mimir-am
          secureJsonData:
            httpHeaderValue1: "1"
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki.loki.svc.cluster.local:3100
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.saadisfy.me
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me
  persistence:
    enabled: true
    size: 1Gi
  deploymentStrategy:
    type: Recreate
  initChownData:
    enabled: false
  securityContext:
    fsGroup: 472
  containerSecurityContext:
    runAsUser: 472
    runAsGroup: 472
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Default values for Grafana Operator Custom Resources
grafanaOperatorCRs:
  enabled: false
  instanceSelector:
    matchLabels:
      dashboards: grafana
  instance:
    name: grafana
    labels:
      dashboards: grafana
    external:
      url: https://grafana.saadisfy.me
      adminUser:
        name: grafana
        key: admin-user
      adminPassword:
        name: grafana
        key: admin-password
    client:
      tls:
        insecureSkipVerify: true
