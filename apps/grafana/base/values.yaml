# Grafana - base values (all stages)
grafana:
  adminUser: admin
  # adminPassword: set in <stage>/values.yaml so Helm chart creates/updates the Secret (GitOps)
  # Mimir als Prometheus-Datasource über lokales Netz (Service, kein Ingress)
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://mimir-mimir-distributed-gateway.mimir.svc.cluster.local
          isDefault: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.saadisfy.me
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
