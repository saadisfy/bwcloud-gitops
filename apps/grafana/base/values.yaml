# Grafana - base values (all stages)
grafana:
  adminUser: admin
  # adminPassword: set in <stage>/values.yaml so Helm chart creates/updates the Secret (GitOps)
  podAnnotations:
    reloader.stakater.com/auto: "true"  # Stakater Reloader: Rolling Restart bei Secret-Änderung
  # Nach jedem Start (inkl. nach Reloader-Neustart bei Passwort-Änderung) DB-Passwort an Secret angleichen
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - 'sleep 25 && grafana cli admin reset-admin-password "$GF_SECURITY_ADMIN_PASSWORD" || true'
  # Mimir als Prometheus-Datasource über lokales Netz (Service, kein Ingress)
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          access: proxy
          url: http://mimir-mimir-distributed-gateway.mimir.svc.cluster.local
          isDefault: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.saadisfy.me
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
