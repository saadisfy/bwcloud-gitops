# Grafana - base values (all stages)
grafana:
  adminUser: admin
  # adminPassword: set in <stage>/values.yaml so Helm chart creates/updates the Secret (GitOps)
  podAnnotations:
    reloader.stakater.com/auto: "true"  # Stakater Reloader: Rolling Restart bei Secret-Änderung
  # Nach jedem Start (inkl. nach Reloader-Neustart bei Passwort-Änderung) DB-Passwort an Secret angleichen
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - '/bin/sh /opt/bootstrap/bootstrap.sh &'
  # Mimir als Prometheus-Datasource über lokales Netz (Service, kein Ingress)
  datasources:
    alertmanager.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir Alertmanager
          type: alertmanager
          uid: mimir-am
          access: proxy
          url: http://mimir-gateway.mimir.svc.cluster.local
          jsonData:
            handleGrafanaManagedAlerts: true
            implementation: mimir
            httpHeaderName1: X-Scope-OrgID
          secureJsonData:
            httpHeaderValue1: "1"
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          access: proxy
          uid: mimir
          url: http://mimir-gateway.mimir.svc.cluster.local/prometheus
          isDefault: true
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            manageAlerts: true
            alertmanagerUid: mimir-am
            exemplarTraceIdDestinations:
              - datasourceUid: tempo
                name: traceID
              - datasourceUid: tempo
                name: trace_id
          secureJsonData:
            httpHeaderValue1: "1"
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki.loki.svc.cluster.local:3100
          jsonData:
            derivedFields:
              - datasourceUid: tempo
                matcherRegex: "(?:traceID|trace_id|traceId)[:=]\\s*([a-fA-F0-9]+)"
                name: TraceID
                url: "${__value.raw}"
        - name: Tempo
          type: tempo
          access: proxy
          uid: tempo
          url: http://tempo.tempo.svc.cluster.local:3100
          jsonData:
            httpMethod: POST
            tracesToLogsV2:
              # Link traces to Loki logs using the 'traceID' label
              datasourceUid: loki
              spanStartTimeShift: '1h'
              spanEndTimeShift: '1h'
              tags:
                - { key: 'service.name', value: 'service' }
                - { key: 'service.name', value: 'service_name' }
                - { key: 'k8s.pod.name', value: 'pod' }
                - { key: 'k8s.namespace.name', value: 'namespace' }
              filterByTraceID: true
              filterBySpanID: false
            tracesToMetrics:
              datasourceUid: mimir
              spanStartTimeShift: '1h'
              spanEndTimeShift: '1h'
              tags:
                - { key: 'k8s.pod.name', value: 'pod' }
                - { key: 'k8s.namespace.name', value: 'namespace' }
              queries:
                - name: 'Request rate (this pod)'
                  query: 'sum(rate(http_server_request_duration_seconds_count{job=~"spring-petclinic.*", $$__tags}[$__rate_interval]))'
                - name: 'JVM memory (this pod)'
                  query: 'sum by (jvm_memory_type, jvm_memory_pool_name) (jvm_memory_used_bytes{job=~"spring-petclinic.*", $$__tags})'
                - name: 'Pod CPU vs limit'
                  query: 'sum by (pod) (max by (cluster, namespace, pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{cluster="prod-bwcloud", $$__tags})) / sum by (pod) (max by (cluster, namespace, pod, container) (cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits{cluster="prod-bwcloud", $$__tags}))'
            correlations:
              - label: 'Spring Petclinic / LGTM Dashboard'
                description: 'RED, JVM, Pod CPU, Logs — pod from this trace pre-selected'
                type: external
                config:
                  field: traceId
                  target:
                    url: '/d/spring-petclinic-correlation?var-pod=$${__span.tags["k8s.pod.name"]}&var-namespace=$${__span.tags["k8s.namespace.name"]}&var-cluster=prod-bwcloud&from=$${__from}&to=$${__to}'
            serviceMap:
              datasourceUid: mimir
            nodeGraph:
              enabled: true
            search:
              hide: false
            lokiSearch:
              datasourceUid: loki
        - name: Elasticsearch
          type: elasticsearch
          access: proxy
          uid: elasticsearch
          url: http://elasticsearch.elk.svc.cluster.local:9200
          jsonData:
            timeField: "@timestamp"
            version: "7.10.0"
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.saadisfy.me
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me
  persistence:
    enabled: true
    size: 1Gi
  deploymentStrategy:
    type: Recreate
  initChownData:
    enabled: false
  securityContext:
    fsGroup: 472
  containerSecurityContext:
    runAsUser: 472
    runAsGroup: 472
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  sidecar:
    dashboards:
      enabled: true
      label: app.kubernetes.io/component
      labelValue: dashboard

# Default values for Grafana Operator Custom Resources
grafanaOperatorCRs:
  enabled: false
  instanceSelector:
    matchLabels:
      dashboards: grafana
  instance:
    name: grafana
    labels:
      dashboards: grafana
    external:
      url: https://grafana.saadisfy.me
      adminUser:
        name: grafana
        key: admin-user
      adminPassword:
        name: grafana
        key: admin-password
    client:
      tls:
        insecureSkipVerify: true
