{{- $grafanaOperatorCRs := .Values.grafanaOperatorCRs | default dict }}
{{- if ($grafanaOperatorCRs.enabled | default false) }}
{{- $selector := $grafanaOperatorCRs.instanceSelector }}

{{- /* Collect all unique folders from the files directory */ -}}
{{- $folders := dict }}
{{- $folderSources := list "files/**/*.json" "files/**/alerts*.yaml" "files/**/alerts*.yml" "files/**/alert-rules*.yaml" "files/**/alert-rules*.yml" }}
{{- range $glob := $folderSources }}
{{- range $path, $bytes := $.Files.Glob $glob }}
  {{- $relDir := dir $path | trimPrefix "files/" | trimPrefix "files" }}
  {{- if ne $relDir "" }}
    {{- $parts := splitList "/" $relDir }}
    {{- $currentPath := "" }}
    {{- range $i, $part := $parts }}
      {{- if ne $part "" }}
        {{- if eq $currentPath "" }}
          {{- $currentPath = $part }}
        {{- else }}
          {{- $currentPath = printf "%s/%s" $currentPath $part }}
        {{- end }}
        {{- $_ := set $folders $currentPath $part }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}

{{- /* Generate GrafanaFolder CRs for each directory */ -}}
{{- range $folderPath, $folderTitle := $folders }}
{{- $safeFolderName := $folderPath | replace "/" "-" | lower }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ $safeFolderName | quote }}
spec:
  instanceSelector:
{{- toYaml $selector | nindent 4 }}
  title: {{ $folderTitle | quote }}
---
{{- end }}

{{- /* Generate ConfigMaps and GrafanaDashboard CRs for each JSON file */ -}}
{{- range $path, $bytes := .Files.Glob "files/**/*.json" }}
{{- $relDir := dir $path | trimPrefix "files/" | trimPrefix "files" }}
{{- $safeFolderName := $relDir | replace "/" "-" | lower }}
{{- $dashboardName := base $path | replace ".json" "" | replace "_" "-" | lower }}
{{- /* Unique name for the dashboard and configmap */ -}}
{{- $resourceName := printf "dash-%s-%s" $safeFolderName $dashboardName | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $resourceName | quote }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
data:
  dashboard.json: |-
{{ $.Files.Get $path | indent 4 }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $resourceName | quote }}
spec:
  instanceSelector:
{{- toYaml $selector | nindent 4 }}
  folderRef: {{ $safeFolderName | quote }}
  configMapRef:
    name: {{ $resourceName | quote }}
    key: dashboard.json
---
{{- end }}
{{- end }}
