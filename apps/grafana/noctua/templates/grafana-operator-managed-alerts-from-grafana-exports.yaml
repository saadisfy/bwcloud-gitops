{{- if (((($.Values).grafanaOperatorCRs | default dict).enabled) | default false) }}
  {{- /* Einlesen aller Grafana-UI-Exportdateien (yaml + yml) */ -}}
  {{- range $path, $_ := $.Files.Glob "files/**/alert-rules*.y*" }}
      {{- $sourceYaml := $.Files.Get $path }}
      {{- $source := $sourceYaml | fromYaml | default dict }}
      {{- /* Nur Grafana Alerting Provisioning Format unterstützen (apiVersion: 1) */ -}}
      {{- $apiVersion := printf "%v" ($source.apiVersion | default "") }}
      {{- if eq $apiVersion "1" }}
        {{- /* Folder aus Dateipfad ableiten, z.B. files/team-a/... -> team-a */ -}}
        {{- $relDir := dir $path | trimPrefix "files/" | trimPrefix "files" }}
        {{- $pathFolderName := $relDir | replace "/" "-" | lower | default "general" }}

        {{- /* Jede exportierte Gruppe wird zu einer GrafanaAlertRuleGroup */ -}}
        {{- range $group := ($source.groups | default (list)) }}
          {{- $groupName := $group.name | default "default" }}
          {{- $rules := $group.rules | default (list) }}
          {{- if gt (len $rules) 0 }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
{{- /* Stabilen, k8s-sicheren Namen aus Pfad + Gruppenname erzeugen */ -}}
{{- $groupSlugRaw := $groupName | lower | replace "_" "-" | replace "/" "-" | replace " " "-" }}
{{- $groupSlug := $groupSlugRaw | regexReplaceAll "[^a-z0-9-]" "" | trimAll "-" | default "default" }}
{{- $groupHash := (printf "%s|%s" $path $groupName) | sha256sum | trunc 8 }}
{{- $resourceName := printf "agrp-managed-%s-%s-%s" $pathFolderName $groupSlug $groupHash | trunc 63 | trimSuffix "-" }}
  name: {{ $resourceName | quote }}
spec:
  instanceSelector:
{{- toYaml ((($.Values).grafanaOperatorCRs | default dict).instanceSelector) | nindent 4 }}
  name: {{ $groupName | quote }}
{{- /* group.folder aus Export hat Vorrang; sonst Pfad-Folder verwenden */ -}}
{{- $groupFolderRef := $pathFolderName }}
{{- if $group.folder }}
  {{- $groupFolderRef = ($group.folder | replace "/" "-" | lower) }}
{{- end }}
  folderRef: {{ $groupFolderRef | quote }}
  interval: {{ default "1m" $group.interval | quote }}
  rules:
{{- toYaml $rules | nindent 4 }}
---
          {{- end }}
        {{- end }}
      {{- end }}
  {{- end }}
{{- end }}
