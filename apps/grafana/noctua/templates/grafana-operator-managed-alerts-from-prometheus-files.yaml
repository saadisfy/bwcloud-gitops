{{- if (((($.Values).grafanaOperatorCRs | default dict).enabled) | default false) }}
{{- $alertingCfg := ($.Values.grafanaOperatorCRs.alerting | default dict) }}
{{- if ($alertingCfg.syncPrometheusRules | default true) }}
{{- $alertFileGlobs := list "files/**/alerts*.yaml" "files/**/alerts*.yml" }}
{{- range $glob := $alertFileGlobs }}
{{- range $path, $_ := $.Files.Glob $glob }}
{{- $sourceYaml := $.Files.Get $path }}
{{- $source := $sourceYaml | fromYaml | default dict }}
{{- $groups := $source.groups | default (list) }}
{{- $relDir := dir $path | trimPrefix "files/" | trimPrefix "files" }}
{{- $safeFolderName := $relDir | replace "/" "-" | lower }}

{{- range $group := $groups }}
{{- $groupName := $group.name | default "default" }}
{{- $renderableRules := list }}
{{- range $rule := ($group.rules | default (list)) }}
  {{- if and (hasKey $rule "uid") (hasKey $rule "data") }}
    {{- $renderableRules = append $renderableRules $rule }}
  {{- else if and (hasKey $rule "alert") (ne ($rule.alert | default "") "") (hasKey $rule "expr") }}
    {{- $renderableRules = append $renderableRules $rule }}
  {{- end }}
{{- end }}

{{- if gt (len $renderableRules) 0 }}
{{- $groupSlugRaw := $groupName | lower | replace "_" "-" | replace "/" "-" | replace " " "-" }}
{{- $groupSlug := $groupSlugRaw | regexReplaceAll "[^a-z0-9-]" "" | trimAll "-" | default "default" }}
{{- $groupHash := (printf "%s|%s" $path $groupName) | sha256sum | trunc 8 }}
{{- $resourceName := printf "agrp-%s-%s-%s" $safeFolderName $groupSlug $groupHash | trunc 63 | trimSuffix "-" }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ $resourceName | quote }}
  annotations:
    bwcloud.io/source-file: {{ $path | quote }}
    bwcloud.io/source-group: {{ $groupName | quote }}
    bwcloud.io/source-sha256: {{ $sourceYaml | sha256sum | quote }}
spec:
  instanceSelector:
{{- toYaml ((($.Values).grafanaOperatorCRs | default dict).instanceSelector) | nindent 4 }}
  name: {{ $groupName | quote }}
  folderRef: {{ $safeFolderName | quote }}
  interval: {{ default "1m" $group.interval | quote }}
  rules:
{{- range $rule := $renderableRules }}
{{- if and (hasKey $rule "uid") (hasKey $rule "data") }}
{{- toYaml (list $rule) | nindent 4 }}
{{- else }}
{{- $ruleUid := printf "mmr-%s" ((printf "%s|%s|%s|%s|%s|%s" $path $groupName ($rule.alert | default "") ($rule.expr | default "") ($rule.for | default "") (toYaml ($rule.labels | default dict) | sha256sum)) | sha256sum | trunc 20) }}
    - uid: {{ $ruleUid | quote }}
      title: {{ $rule.alert | quote }}
      condition: B
      for: {{ $rule.for | default "0s" | quote }}
      noDataState: NoData
      execErrState: Error
{{- if $rule.labels }}
      labels:
{{- toYaml $rule.labels | nindent 8 }}
{{- end }}
{{- if $rule.annotations }}
      annotations:
{{- toYaml $rule.annotations | nindent 8 }}
{{- end }}
      data:
        - refId: A
          datasourceUid: "mimir"
          relativeTimeRange:
            from: 600
            to: 0
          model:
            datasource:
              type: prometheus
              uid: "mimir"
            editorMode: code
            expr: |-
{{ printf "%s\n" ($rule.expr | trimSuffix "\n") | indent 14 }}
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 0
            to: 0
          model:
            conditions:
              - evaluator:
                  params:
                    - -1e99
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
            type: threshold
{{- end }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
