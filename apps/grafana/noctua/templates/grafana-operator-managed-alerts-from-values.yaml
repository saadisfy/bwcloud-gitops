{{- if (((($.Values).grafanaOperatorCRs | default dict).enabled) | default false) }}
{{- range $folder := (((((($.Values).grafanaOperatorCRs | default dict).alerting) | default dict).folders) | default (list)) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ $folder.name | quote }}
spec:
  instanceSelector:
{{- toYaml ((($.Values).grafanaOperatorCRs | default dict).instanceSelector) | nindent 4 }}
  title: {{ default $folder.name $folder.title | quote }}
---
{{- range $group := ($folder.groups | default (list)) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ printf "%s-%s" $folder.name $group.name | trunc 63 | trimSuffix "-" | quote }}
spec:
  instanceSelector:
{{- toYaml ((($.Values).grafanaOperatorCRs | default dict).instanceSelector) | nindent 4 }}
  name: {{ default $group.name $group.title | quote }}
  folderRef: {{ $folder.name | quote }}
  interval: {{ default "1m" $group.interval | quote }}
  rules:
{{- range $rule := ($group.rules | default (list)) }}
    - uid: {{ $rule.uid | quote }}
      title: {{ $rule.title | quote }}
      condition: B
      for: {{ default "5m" $rule.for | quote }}
      noDataState: {{ default "NoData" $rule.noDataState | quote }}
      execErrState: {{ default "Error" $rule.execErrState | quote }}
{{- if $rule.labels }}
      labels:
{{- toYaml $rule.labels | nindent 8 }}
{{- end }}
{{- if $rule.annotations }}
      annotations:
{{- toYaml $rule.annotations | nindent 8 }}
{{- end }}
      data:
        - refId: A
          datasourceUid: "mimir"
          relativeTimeRange:
            from: {{ default 600 $rule.relativeTimeRangeFrom }}
            to: {{ default 0 $rule.relativeTimeRangeTo }}
          model:
            datasource:
              type: prometheus
              uid: "mimir"
            editorMode: code
            expr: {{ $rule.expr | quote }}
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 0
            to: 0
          model:
            conditions:
              - evaluator:
                  params:
                    - {{ default 0 $rule.threshold }}
                  type: {{ default "gt" $rule.evalOperator | quote }}
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
            type: threshold
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
