{{- $grafanaOperatorCRs := .Values.grafanaOperatorCRs | default dict }}
{{- if ($grafanaOperatorCRs.enabled | default false) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: dummy-contact-point
spec:
  instanceSelector:
    matchLabels:
      {{- toYaml $grafanaOperatorCRs.instanceSelector.matchLabels | nindent 6 }}
  name: dummy-contact-point
  type: email
  settings:
    addresses: "dummy@example.com"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: root-notification-policy
spec:
  instanceSelector:
    matchLabels:
      {{- toYaml $grafanaOperatorCRs.instanceSelector.matchLabels | nindent 6 }}
  route:
    receiver: dummy-contact-point
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
    routeSelector:
      matchLabels:
        app: grafana-notification-policy-route
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicyRoute
metadata:
  name: subroot-route-1
  labels:
    app: grafana-notification-policy-route
spec:
  receiver: dummy-contact-point
  object_matchers:
    - - severity
      - =
      - critical
    - - service
      - =
      - argocd
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicyRoute
metadata:
  name: subroot-route-2
  labels:
    app: grafana-notification-policy-route
spec:
  receiver: dummy-contact-point
  object_matchers:
    - - severity
      - =
      - warning
    - - service
      - =
      - crossplane
{{- end }}

