# Grafana dev stage overrides
grafana:
  nameOverride: grafana
  fullnameOverride: grafana
  podAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  admin:
    existingSecret: grafana-admin-credentials
    passwordKey: admin-password
  ingress:
    hosts:
      - grafana.saadisfy.me
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me

  # Secrets (SSO, SMTP) are injected as env vars from the manually
  # applied Secret 0day-deployment-manifests/grafana-secrets.yaml (gitignored).
  # Reloader (podAnnotations in base/values.yaml) restarts the pod on change.
  envFromSecret: grafana-github-oauth

  grafana.ini:
    server:
      root_url: https://grafana.saadisfy.me
    log:
      level: debug
    # Local admin login stays enabled as a fallback (do not set disable_login_form).
    auth:
      # No anonymous access; only signed-in users see anything.
      disable_login_form: false
    auth.github:
      enabled: true
      name: GitHub
      allow_sign_up: true
      # Only my own GitHub login becomes Admin; everyone else gets Viewer (read-only).
      # JMESPath is evaluated against the GitHub user info JSON returned by the
      # OAuth API; `login` is the GitHub username.
      role_attribute_path: "login == 'saadisfy' && 'Admin' || 'Viewer'"
      role_attribute_strict: true
      skip_org_role_sync: false
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
    smtp:
      enabled: true
      host: $__env{GF_SMTP_HOST}
      user: $__env{GF_SMTP_USER}
      password: $__env{GF_SMTP_PASSWORD}
      from_address: $__env{GF_SMTP_FROM_ADDRESS}
      from_name: Grafana
      starttls_policy: MandatoryStartTLS

# Operator CRs configuration
grafana-operator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

grafanaOperatorCRs:
  enabled: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  instance:
    name: grafana
    labels:
      dashboards: grafana
    external:
      url: https://grafana.saadisfy.me
      # The operator needs to know how to log in to the external Grafana instance
      # to provision dashboards. It uses the admin credentials from the secret
      # managed via 0day-deployment-manifests.
      adminUser:
        name: grafana-admin-credentials
        key: admin-user
      adminPassword:
        name: grafana-admin-credentials
        key: admin-password
    client:
      tls:
        insecureSkipVerify: true

  # Mandatory alerting configuration for the operator
  alerting:
    syncPrometheusRules: false
    folders:
      - name: "infrastruktur"
        title: "Infrastruktur"
  contactPoints:
    - name: "default-contact-point"
      spec:
        # Using deprecated top-level fields for compatibility
        type: email
        disableResolveMessage: false
        settings:
          addresses: "dummy@example.com"
        # Keep receivers list just in case
        receivers:
          - disableResolveMessage: false
            type: email
            settings:
              addresses: "dummy@example.com"
  notificationPolicies:
    - name: "root"
      spec:
        route:
          receiver: "default-contact-point"
