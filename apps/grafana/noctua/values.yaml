# Grafana dev stage overrides
grafana:
  nameOverride: grafana
  fullnameOverride: grafana
  podAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  admin:
    existingSecret: grafana-admin-credentials
    passwordKey: admin-password
  ingress:
    hosts:
      - grafana.saadisfy.me
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me

  # Secrets (SSO, SMTP, Telegram) are injected as env vars from the manually
  # applied Secret 0day-deployment-manifests/grafana-secrets.yaml (gitignored).
  # Reloader (podAnnotations in base/values.yaml) restarts the pod on change.
  envFromSecret: grafana-secrets

  grafana.ini:
    server:
      root_url: https://grafana.saadisfy.me
    log:
      level: debug
    # Local admin login stays enabled as a fallback (do not set disable_login_form).
    auth:
      # No anonymous access; only signed-in users see anything.
      disable_login_form: false
    auth.github:
      enabled: true
      name: GitHub
      allow_sign_up: true
      # Only my own GitHub login becomes Admin; everyone else gets Viewer (read-only).
      # JMESPath is evaluated against the GitHub user info JSON returned by the
      # OAuth API; `login` is the GitHub username.
      role_attribute_path: "login == 'saadisfy' && 'Admin' || 'Viewer'"
      role_attribute_strict: true
      skip_org_role_sync: false
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
    # Enable reception of external alerts (from Mimir Ruler) into Grafana's internal Alertmanager
    alerting:
      receive_external_alerts: true
    smtp:
      enabled: false

# Operator CRs configuration
grafana-operator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

grafanaOperatorCRs:
  enabled: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  instance:
    name: grafana
    labels:
      dashboards: grafana
    external:
      url: https://grafana.saadisfy.me
      # The operator needs to know how to log in to the external Grafana instance
      # to provision dashboards. It uses the admin credentials from the secret
      # managed via 0day-deployment-manifests.
      adminUser:
        name: grafana-admin-credentials
        key: admin-user
      adminPassword:
        name: grafana-admin-credentials
        key: admin-password
    client:
      tls:
        insecureSkipVerify: true

  # Mandatory alerting configuration for the operator
  alerting:
    syncPrometheusRules: false
    folders:
      - name: "infrastruktur"
        title: "Infrastruktur"
        groups:
          - name: "mimir-alerts-forwarder"
            interval: "1m"
            rules:
              - uid: "mimir_alerts_forwarder_rule"
                title: "Mimir Alerts Forwarder"
                expr: 'ALERTS{alertstate="firing"}'
                for: "1m"
                threshold: 0
                evalOperator: "gt"
                noDataState: "OK"
                execErrState: "OK"
                labels:
                  source: "mimir-ruler"
                annotations:
                  summary: "Mimir Alert Firing: {{ $labels.alertname }}"
                  description: "An alert is firing in Mimir Ruler.\nAlertname: {{ $labels.alertname }}\nSeverity: {{ $labels.severity }}\nDetails: {{ $labels.description }}"
              - uid: "test_always_firing_rule"
                title: "Grafana Alerting Test"
                expr: "vector(1)"
                for: "10s"
                threshold: 0
                evalOperator: "gt"
                noDataState: "OK"
                execErrState: "OK"
                labels:
                  severity: "warning"
                annotations:
                  summary: "Grafana Alerting is working!"
                  description: "If you see this and receive it in Telegram, the complete Grafana Alerting notification pipeline is functional!"
  contactPoints:
    - name: "telegram-alerts"
      spec:
        receivers:
          - disableResolveMessage: false
            type: telegram
            settings:
              # chatid is a plain settings field and is not sensitive.
              chatid: "462723448"
            # valuesFrom injects the bot token from the Kubernetes Secret at operator reconciliation time,
            # so the operator passes the actual token value to the Grafana API rather than a literal env var string.
            valuesFrom:
              - targetPath: "bottoken"
                valueFrom:
                  secretKeyRef:
                    name: grafana-secrets
                    key: GF_TELEGRAM_BOT_TOKEN
  notificationPolicies:
    - name: "root"
      spec:
        route:
          receiver: "telegram-alerts"
          group_by: ["alertname", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
