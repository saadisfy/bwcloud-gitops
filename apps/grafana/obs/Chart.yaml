apiVersion: v2
name: grafana-wrapper
description: Wrapper for Grafana and Grafana Operator charts
version: 0.2.0
dependencies:
  - name: grafana
    version: "10.5.15"
    repository: https://grafana.github.io/helm-charts
  - name: grafana-operator
    version: "5.22.1"
    repository: https://grafana.github.io/helm-charts
    condition: grafana-operator.enabled
