{{- if (((($.Values).grafanaOperatorCRs | default dict).enabled) | default false) }}
{{- if eq (len (((($.Values).grafanaOperatorCRs | default dict).contactPoints) | default (list))) 0 }}
{{- fail "grafanaOperatorCRs.contactPoints is required (fallback removed)" }}
{{- end }}

{{- range $cp := (((($.Values).grafanaOperatorCRs | default dict).contactPoints) | default (list)) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: {{ $cp.name | quote }}
spec:
  instanceSelector:
{{- toYaml ((($.Values).grafanaOperatorCRs | default dict).instanceSelector) | nindent 4 }}
{{- toYaml $cp.spec | nindent 2 }}
---
{{- end }}
{{- end }}
