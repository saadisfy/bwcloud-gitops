{{- $grafanaOperatorCRs := .Values.grafanaOperatorCRs | default dict }}
{{- if ($grafanaOperatorCRs.enabled | default false) }}
{{- $selector := $grafanaOperatorCRs.instanceSelector }}
{{- $alerting := $grafanaOperatorCRs.alerting | default dict }}
{{- $alertingFolders := $alerting.folders | default (list) }}
{{- $datasourceUid := "mimir" }}
{{- $customContactPoints := $grafanaOperatorCRs.contactPoints | default (list) }}
{{- $customNotificationPolicies := $grafanaOperatorCRs.notificationPolicies | default (list) }}
{{- if eq (len $alertingFolders) 0 }}
{{- fail "grafanaOperatorCRs.alerting.folders is required (fallback removed)" }}
{{- end }}
{{- if eq (len $customContactPoints) 0 }}
{{- fail "grafanaOperatorCRs.contactPoints is required (fallback removed)" }}
{{- end }}
{{- if eq (len $customNotificationPolicies) 0 }}
{{- fail "grafanaOperatorCRs.notificationPolicies is required (fallback removed)" }}
{{- end }}

{{- range $folder := $alertingFolders }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ $folder.name }}
spec:
  instanceSelector:
{{- toYaml $selector | nindent 4 }}
  title: {{ default $folder.name $folder.title | quote }}
---
{{- range $group := ($folder.groups | default (list)) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ printf "%s-%s" $folder.name $group.name | trunc 63 | trimSuffix "-" }}
spec:
  instanceSelector:
{{- toYaml $selector | nindent 4 }}
  name: {{ default $group.name $group.title | quote }}
  folderRef: {{ $folder.name }}
  interval: {{ default "1m" $group.interval }}
  rules:
{{- range $rule := ($group.rules | default (list)) }}
    - uid: {{ $rule.uid }}
      title: {{ $rule.title | quote }}
      condition: B
      for: {{ default "5m" $rule.for }}
      noDataState: {{ default "NoData" $rule.noDataState }}
      execErrState: {{ default "Error" $rule.execErrState }}
{{- if $rule.labels }}
      labels:
{{- toYaml $rule.labels | nindent 8 }}
{{- end }}
{{- if $rule.annotations }}
      annotations:
{{- toYaml $rule.annotations | nindent 8 }}
{{- end }}
      data:
        - refId: A
          datasourceUid: {{ $datasourceUid }}
          relativeTimeRange:
            from: {{ default 600 $rule.relativeTimeRangeFrom }}
            to: {{ default 0 $rule.relativeTimeRangeTo }}
          model:
            datasource:
              type: prometheus
              uid: {{ $datasourceUid }}
            editorMode: code
            expr: {{ $rule.expr | quote }}
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange:
            from: 0
            to: 0
          model:
            conditions:
              - evaluator:
                  params:
                    - {{ default 0 $rule.threshold }}
                  type: {{ default "gt" $rule.evalOperator }}
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            refId: B
            type: threshold
{{- end }}
---
{{- end }}
{{- end }}
{{- range $cp := $customContactPoints }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: {{ $cp.name }}
spec:
  instanceSelector:
{{- toYaml $selector | nindent 4 }}
{{- toYaml $cp.spec | nindent 2 }}
---
{{- end }}
{{- range $np := $customNotificationPolicies }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: {{ $np.name }}
spec:
  instanceSelector:
{{- toYaml $selector | nindent 4 }}
{{- toYaml $np.spec | nindent 2 }}
---
{{- end }}
{{- end }}
