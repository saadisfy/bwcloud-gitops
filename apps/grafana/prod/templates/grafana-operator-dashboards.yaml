{{- if .Values.grafanaOperatorCRs.enabled }}
{{- $selector := .Values.grafanaOperatorCRs.instanceSelector }}
{{- range $dashboard := .Values.grafanaOperatorCRs.dashboards }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $dashboard.name }}
spec:
  instanceSelector:
    matchLabels:
{{- toYaml $selector | nindent 6 }}
{{- toYaml $dashboard.spec | nindent 2 }}
---
{{- end }}
{{- end }}
