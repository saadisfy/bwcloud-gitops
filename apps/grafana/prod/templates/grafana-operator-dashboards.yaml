{{- $grafanaOperatorCRs := .Values.grafanaOperatorCRs | default dict }}
{{- if ($grafanaOperatorCRs.enabled | default false) }}
{{- $selector := $grafanaOperatorCRs.instanceSelector }}
{{- range $dashboard := ($grafanaOperatorCRs.dashboards | default (list)) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $dashboard.name }}
spec:
  instanceSelector:
    matchLabels:
{{- toYaml $selector | nindent 6 }}
{{- toYaml $dashboard.spec | nindent 2 }}
---
{{- end }}
{{- end }}
