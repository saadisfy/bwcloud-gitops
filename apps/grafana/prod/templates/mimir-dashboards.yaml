{{- $grafanaOperatorCRs := .Values.grafanaOperatorCRs | default dict }}
{{- if ($grafanaOperatorCRs.enabled | default false) }}
{{- $selector := $grafanaOperatorCRs.instanceSelector }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: mimir
spec:
  instanceSelector:
    matchLabels:
{{- toYaml $selector | nindent 6 }}
  title: "Mimir"
---
{{- range $path, $bytes := .Files.Glob "files/mimir/dashboards/*.json" }}
{{- $dashboardName := base $path | replace ".json" "" }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $dashboardName }}
spec:
  folder: "Mimir"
  instanceSelector:
    matchLabels:
{{- toYaml $selector | nindent 6 }}
  json: |-
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}
{{- end }}