# Grafana dev stage overrides
grafana:
  nameOverride: grafana
  fullnameOverride: grafana
  adminPassword: "REPLACE_GRAFANA_ADMIN_PASSWORD"
  ingress:
    hosts:
      - grafana.saadisfy.me
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.saadisfy.me

  # GitHub OAuth client ID + secret are injected as env vars from the manually
  # applied Secret 0day-deployment-manifests/sso-secrets.yaml (gitignored).
  # Reloader (podAnnotations in base/values.yaml) restarts the pod on change.
  envFromSecret: grafana-github-oauth

  grafana.ini:
    server:
      root_url: https://grafana.saadisfy.me
    # Local admin login stays enabled as a fallback (do not set disable_login_form).
    auth:
      # No anonymous access; only signed-in users see anything.
      disable_login_form: false
    auth.github:
      enabled: true
      name: GitHub
      allow_sign_up: true
      # Only my own GitHub login becomes Admin; everyone else gets Viewer (read-only).
      # JMESPath is evaluated against the GitHub user info JSON returned by the
      # OAuth API; `login` is the GitHub username.
      role_attribute_path: "login == 'saadisfy' && 'Admin' || 'Viewer'"
      role_attribute_strict: true
      skip_org_role_sync: false
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}

# Operator CRs configuration
grafanaOperatorCRs:
  enabled: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  instance:
    name: grafana
    labels:
      dashboards: grafana
    external:
      url: https://grafana.saadisfy.me
      # The operator needs to know how to log in to the external Grafana instance
      # to provision dashboards. It uses the admin credentials from the secret
      # created by the Grafana Helm chart.
      adminUser:
        name: grafana
        key: admin-user
      adminPassword:
        name: grafana
        key: admin-password
    tls:
      insecureSkipVerify: true

  # Mandatory alerting configuration for the operator
  alerting:
    folders:
      - name: "infrastruktur"
        title: "Infrastruktur"
  contactPoints:
    - name: "default-contact-point"
      spec:
        # Dummy contact point
        receivers: []
  notificationPolicies:
    - name: "root"
      spec:
        route:
          receiver: "default-contact-point"
