# Istio obs overrides
base: {}
istiod: {}

# Kiali: configuration is kept here but DISABLED pending a decision on the
# session signing key.
#
# kiali-server 2.26 renders login_token.signing_key into the ConfigMap
# `kiali` (config.yaml) and reads it from there -- NOT from the Secret
# istio-system/kiali. Kiali refuses to start unless the key is exactly 16, 24
# or 32 characters, so the "REPLACE_SIGNING_KEY" placeholder (19 chars) makes
# the pod CrashLoopBackOff. The ignoreDifferences entry in appsets/obs/istio.yaml
# targets the Secret's .data.signing_key and therefore has no effect on the
# value Kiali actually uses.
#
# This never surfaced before because base sets enabled: false and the overlay
# that enabled it was never synced on this cluster.
#
# Two ways forward, both needing a call:
#   a) commit a valid 32-character key here -- it then lives in a PUBLIC repo,
#      acceptable only while Kiali has no external exposure;
#   b) switch auth.strategy to anonymous, dropping the need for a signing key,
#      at the cost of Kiali having no login at all.
kiali-server:
  enabled: false
  login_token:
    signing_key: "REPLACE_SIGNING_KEY"
  external_services:
    prometheus:
      enabled: true
      # OTel demo Prometheus service running in this cluster.
      url: "http://prometheus.opentelemetry-demo.svc.cluster.local:9090"
    grafana:
      enabled: true
      # Kiali backend uses internal_url from inside the cluster.
      internal_url: "http://grafana.grafana.svc.cluster.local"
      # Browser links should use the external Grafana URL.
      external_url: "https://grafana.saadisfy.me"
    tracing:
      enabled: true
      provider: "tempo"
      # Monolithic Tempo exposes its HTTP API on the `tempo` service, port 3100.
      internal_url: "http://tempo.tempo.svc.cluster.local:3100"
      use_grpc: false
      # Links from Kiali should open in external Grafana Tempo UI.
      external_url: "https://grafana.saadisfy.me"
      tempo_config:
        datasource_uid: "tempo"
