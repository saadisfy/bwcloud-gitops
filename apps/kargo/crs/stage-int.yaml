# Stage int: Freight nur nach Verifikation in dev; Promotion aktualisiert Values + Chart
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: int
  namespace: kargo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: bwcloud-warehouse
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/saadisfy/bwcloud-gitops.git
        - name: targetBranch
          value: stage/${{ ctx.stage }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: ${{ vars.targetBranch }}
                path: ./out
                create: true
        - uses: yaml-update
          as: update-values
          config:
            path: ./out/apps/spring-petclinic/int/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom("ghcr.io/saadisfy/spring-petclinic").Tag }}
        # Chart-Version-Bump: Warehouse um chart-Subscription ergänzen, dann Schritt:
        # - uses: helm-update-chart
        #   config:
        #     path: ./out/apps/grafana/int
        #     charts:
        #       - repository: https://grafana.github.io/helm-charts
        #         name: grafana
        #         version: ${{ chartFrom("https://grafana.github.io/helm-charts").Version }}
        - uses: git-commit
          config:
            path: ./out
            message: |
              ${{ ctx.stage }}: ${{ outputs["update-values"].commitMessage }}
        - uses: git-push
          config:
            path: ./out
            branch: ${{ vars.targetBranch }}
