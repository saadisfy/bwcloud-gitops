kibana:
  # Point to the official ES master service
  elasticsearchHosts: "https://elasticsearch-master:9200"

  # Use the cert and credentials secrets created by the elasticsearch chart
  elasticsearchCertificateSecret: elasticsearch-master-certs
  elasticsearchCertificateAuthoritiesFile: ca.crt
  elasticsearchCredentialSecret: elasticsearch-master-credentials

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  # GitHub SSO via Argo CD Dex (OIDC). Basic-Login bleibt als Fallback (elastic-User).
  kibanaConfig:
    kibana.yml: |
      server.publicBaseUrl: "https://kibana.saadisfy.me"
      xpack.security.authc.providers:
        oidc.oidc1:
          order: 0
          realm: oidc1
          description: "Log in with GitHub"
          icon: logoGithub
        basic.basic1:
          order: 1
          description: "Log in with Elasticsearch"
