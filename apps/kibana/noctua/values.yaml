kibana:
  elasticsearchHosts: "https://elasticsearch-master.elk.svc:9200"

  # Use credentials from the elasticsearch-master-credentials secret
  extraEnvs:
    - name: ELASTICSEARCH_USERNAME
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: username
    - name: ELASTICSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: password

  # Mount the CA cert so Kibana can trust the self-signed ES TLS cert
  extraVolumes:
    - name: es-certs
      secret:
        secretName: elasticsearch-master-certs

  extraVolumeMounts:
    - name: es-certs
      mountPath: /usr/share/kibana/config/certs
      readOnly: true

  kibanaConfig:
    kibana.yml: |
      server.host: "0.0.0.0"
      elasticsearch.hosts: ["https://elasticsearch-master.elk.svc:9200"]
      elasticsearch.username: "${ELASTICSEARCH_USERNAME}"
      elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"
      elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
      monitoring.ui.container.elasticsearch.enabled: true

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
