# Loki monolithic wrapper chart values for noctua stage (PoC)
loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary
  
  memberlist:
    service:
      publishNotReadyAddresses: true
  
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path

  # Explicitly disable scalable components
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

  loki:
    storage:
      type: s3
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      s3:
        endpoint: minio.minio.svc.cluster.local:9000
        accessKeyId: minioadmin
        secretAccessKey: minioadminpassword
        insecure: true
        s3ForcePathStyle: true

    auth_enabled: false
    commonConfig:
      replication_factor: 1
    
    rulerConfig:
      storage:
        type: s3
        s3:
          bucketnames: loki
          endpoint: minio.minio.svc.cluster.local:9000
          access_key_id: minioadmin
          secret_access_key: minioadminpassword
          insecure: true
          s3forcepathstyle: true

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      retention_period: 24h
    
    compactor:
      retention_enabled: true
      delete_request_store: s3
      retention_delete_delay: 2h
      retention_delete_worker_count: 15
