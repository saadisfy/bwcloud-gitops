# Loki monolithic wrapper chart values for the obs cluster (PoC)
#
# Storage is the local filesystem on the SingleBinary PVC. The former S3 setup
# pointed at the in-cluster MinIO, which is gone: MinIO no longer publishes a
# publicly pullable container image, so the deployment could not start at all.
# SingleBinary mode is designed for filesystem storage, so this is the native
# configuration rather than a workaround.
loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary

  memberlist:
    service:
      publishNotReadyAddresses: true

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi
      # AKS has no local-path provisioner; "default" maps to disk.csi.azure.com.
      storageClass: default

  # Explicitly disable scalable components
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

  loki:
    storage:
      type: filesystem
    storage_config:
      filesystem:
        directory: /var/loki/chunks

    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki

    rulerConfig:
      storage:
        type: local
        local:
          directory: /var/loki/rules

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      retention_period: 24h

    compactor:
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
      retention_delete_worker_count: 15
