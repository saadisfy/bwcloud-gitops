# Azure OBS stage overrides
mimir-distributed:
  distributor:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 200m
        memory: 1Gi
  gateway:
    ingress:
      hosts:
        - host: az-mimir.saadisfy.me
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: mimir-tls
          hosts:
            - az-mimir.saadisfy.me
  ingester:
    resources:
      requests:
        cpu: 300m
        memory: 3Gi
      limits:
        cpu: 300m
        memory: 3Gi
    zoneAwareReplication:
      enabled: true

queryFrontendIngress:
  host: az-mimir-query.saadisfy.me
