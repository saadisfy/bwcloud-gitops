# Mimir - very low resources (base)
# Single replica per component, minimal resources, MinIO for object storage
# Values are for the mimir-distributed subchart

mimir-distributed:
  fullnameOverride: mimir
  global:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  gateway:
    enabledNonEnterprise: true
    replicas: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: mimir.saadisfy.me
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: mimir-tls
          hosts:
            - mimir.saadisfy.me
  mimir:
    structuredConfig:
      alertmanager:
        data_dir: /tmp/alertmanager-data
      blocks_storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks
      alertmanager_storage:
        backend: local
        local:
          path: /data
      compactor:
        data_dir: /data/compactor
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      ruler:
        rule_path: /tmp/ruler-rules
      ruler_storage:
        backend: local
        local:
          directory: /tmp/ruler-storage

  alertmanager:
    replicas: 1
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  compactor:
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  distributor:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  ingester:
    replicas: 1
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    zoneAwareReplication:
      enabled: false

  querier:
    replicas: 1
    extraArgs:
      querier.cardinality-analysis-enabled: "true"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  query_frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  store_gateway:
    replicas: 1
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    zoneAwareReplication:
      enabled: false

  ruler:
    enabled: false

  chunks-cache:
    enabled: false
  index-cache:
    enabled: false
  metadata-cache:
    enabled: false
  results-cache:
    enabled: false

  minio:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

  kafka:
    enabled: false
