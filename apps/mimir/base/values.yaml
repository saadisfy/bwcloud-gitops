# Mimir - very low resources (base)
# Single replica per component, minimal resources, MinIO for object storage
# Values are for the mimir-distributed subchart

mimir-distributed:
  fullnameOverride: mimir
  global:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  metaMonitoring:
    serviceMonitor:
      enabled: true
      labels:
        app.kubernetes.io/part-of: mimir
      clusterLabel: prod-bwcloud
  gateway:
    replicas: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: mimir.saadisfy.me
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: mimir-tls
          hosts:
            - mimir.saadisfy.me
  mimir:
    structuredConfig:
      alertmanager:
        data_dir: /tmp/alertmanager-data
      blocks_storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks
      limits:
        compactor_blocks_retention_period: 24h
        max_global_series_per_user: 500000
        ruler_max_rules_per_rule_group: 100
        ruler_max_rule_groups_per_tenant: 100
      alertmanager_storage:
        backend: filesystem
        filesystem:
          dir: /data/alertmanager
      compactor:
        data_dir: /data/compactor
      ingest_storage:
        enabled: false
      distributor: {}
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      ruler:
        rule_path: /tmp/ruler-rules
      ruler_storage:
        backend: local
        local:
          directory: /tmp/ruler-storage

  alertmanager:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  compactor:
    persistentVolume:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  distributor:
    replicas: 1
    resources:
      requests:
        cpu: 400m
        memory: 512Mi
      limits:
        cpu: 800m
        memory: 1Gi

  ingester:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    zoneAwareReplication:
      enabled: false

  querier:
    replicas: 1
    extraArgs:
      querier.cardinality-analysis-enabled: "true"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  query_frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  store_gateway:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    zoneAwareReplication:
      enabled: false

  ruler:
    enabled: false
