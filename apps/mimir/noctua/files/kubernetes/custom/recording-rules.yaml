apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    role: alert-rules
  name: kubernetes-custom-rules
  namespace: monitoring
spec:
  groups:
  - name: kubernetes-custom.rules
    rules:
    - expr: sum by (cluster, namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
      record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
    - expr: sum by (cluster, namespace, pod, container) (container_memory_working_set_bytes{container!=""})
      record: node_namespace_pod_container:container_memory_working_set_bytes:container_memory_rss:container_memory_cache:sum
    - expr: max by (cluster, namespace, pod, workload, workload_type) (label_replace(label_replace(kube_pod_owner, "workload", "$1", "owner_name", "(.*)"), "workload_type", "$1", "owner_kind", "(.*)"))
      record: namespace_workload_pod:kube_pod_owner:relabel
    - expr: sum by (verb, cluster) (rate(apiserver_request_total{code=~"2..|3.."}[5m])) / sum by (verb, cluster) (rate(apiserver_request_total[5m]))
      record: apiserver_request:availability30d
