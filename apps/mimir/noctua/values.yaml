# Mimir prod stage overrides
mimir-distributed:
  mimir:
    structuredConfig:
      blocks_storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks
      limits:
        store_gateway_tenant_shard_size: 0
        ingestion_rate: 100000
        ingestion_burst_size: 500000
        max_global_series_per_user: 1500000
      ruler:
        # rule_path: writable temp dir for rule evaluation.
        # /tmp is read-only (readOnlyRootFilesystem=true on this container),
        # so we use the EmptyDir storage volume mounted at /data instead.
        rule_path: /data/ruler-rules
        alertmanager_url: "http://mimir-alertmanager-headless.mimir.svc.cluster.local:8080"
      # local backend: read-only, reads standard Prometheus YAML directly from filesystem.
      # The ConfigMap (mimir-rules-bundle) is mounted via extraVolumeMounts at
      # /rules-storage/1/rules.yaml (tenantId=1, namespace=rules).
      # No Job, no initContainer copy, no API call needed.
      # Stakater Reloader restarts the ruler pod when the ConfigMap changes.
      ruler_storage:
        backend: local
        local:
          directory: /rules-storage

  ingester:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 4Gi

  ruler:
    enabled: true
    replicas: 1
    persistentVolume:
      enabled: true
      size: 1Gi
    initContainers:
      - name: setup-storage
        image: busybox:latest
        command: ["sh", "-c", "mkdir -p /data/blocks"]
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: storage
            mountPath: /data

    # Mount the mimir-rules-bundle ConfigMap directly into the ruler_storage local directory.
    # Path: /rules-storage/<tenantId>/<namespace>.yaml  →  /rules-storage/1/rules.yaml
    # Mimir local backend reads this as tenant=1, namespace=rules on every startup.
    extraVolumes:
      - name: ruler-rules-storage
        configMap:
          name: mimir-rules-bundle
    extraVolumeMounts:
      - name: ruler-rules-storage
        mountPath: /rules-storage/1/rules.yaml
        subPath: rules.yaml
        readOnly: true


queryFrontendIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: mimir-query.saadisfy.me
  tlsSecretName: mimir-query-tls

# rulerRuleSync: enabled=true keeps the mimir-rules-bundle ConfigMap rendered.
# The ConfigMap is mounted directly into the ruler pod at /rules-storage/1/rules.yaml
# via ruler.extraVolumeMounts (subPath). No Job, no initContainer copy needed.
# Stakater Reloader auto-restarts the ruler when the ConfigMap changes (via Git push).
rulerRuleSync:
  enabled: true
  argocdHook: false
  image:
    repository: grafana/mimirtool
    tag: "3.0.1"
    pullPolicy: IfNotPresent
