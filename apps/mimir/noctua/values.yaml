# Mimir prod stage overrides
mimir-distributed:
  mimir:
    structuredConfig:
      limits:
        store_gateway_tenant_shard_size: 0
        ingestion_rate: 100000
        ingestion_burst_size: 500000
        max_global_series_per_user: 1500000
        # Default 0 disables exemplar storage → Grafana shows no clickable markers.
        max_global_exemplars_per_user: 100000
        out_of_order_time_window: 5m
        ignore_ooo_exemplars: true
      ruler:
        # rule_path: writable temp dir for rule evaluation.
        # /tmp is read-only (readOnlyRootFilesystem=true on this container),
        # so we use the EmptyDir storage volume mounted at /data instead.
        rule_path: /data/ruler-rules
        # Send alerts to Mimir's local Alertmanager
        alertmanager_url: "http://mimir-alertmanager.mimir.svc.cluster.local:8080/alertmanager"


  ingester:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 4Gi

  ruler:
    enabled: true
    replicas: 1
    extraVolumes:
      - name: rules-storage
        emptyDir: {}
    extraVolumeMounts:
      - name: rules-storage
        mountPath: /rules-storage
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    # filesystem backend uses the ruler emptyDir at /rules-storage.
    # No ConfigMap mount needed — Crossplane pushes rules via the Ruler HTTP API.


queryFrontendIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: mimir-query.saadisfy.me
  tlsSecretName: mimir-query-tls


