{{- $cfg := .Values.rulerRuleSync | default dict }}
{{- if ($cfg.enabled | default false) }}
{{- $ruleGlobs := list "files/**/alerts*.yaml" "files/**/alerts*.yml" }}
{{- $ruleFiles := dict }}
{{- range $glob := $ruleGlobs }}
{{- range $path, $_ := $.Files.Glob $glob }}
{{- $_ = set $ruleFiles $path true }}
{{- end }}
{{- end }}

{{- if gt (len $ruleFiles) 0 }}
{{- /* Calculate checksum of all rule files PLUS Mimir config to force sync on infra changes */ -}}
{{- $allContent := "" }}
{{- range $path, $_ := $ruleFiles }}
{{- $allContent = print $allContent ($.Files.Get $path) }}
{{- end }}
{{- $checksum := (print $allContent (toYaml .Values.mimir)) | sha256sum | trunc 8 }}

apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-rules-sync-{{ $checksum }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ruler-sync
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ruler-sync
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mimirtool
          image: "grafana/mimirtool:3.0.1"
          args:
            - rules
            - load
            - --address=http://mimir-gateway.mimir.svc.cluster.local
            - --id=1
            - /rules/rules.yaml
          volumeMounts:
            - name: rules
              mountPath: /rules
      volumes:
        - name: rules
          configMap:
            name: mimir-rules-bundle
{{- end }}
{{- end }}
