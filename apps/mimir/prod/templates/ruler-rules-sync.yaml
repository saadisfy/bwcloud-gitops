{{- $cfg := .Values.rulerRuleSync | default dict }}
{{- if ($cfg.enabled | default false) }}
{{- $ruleGlobs := list "files/**/alerts*.yaml" "files/**/alerts*.yml" }}
{{- $ruleFiles := dict }}
{{- range $glob := $ruleGlobs }}
{{- range $path, $_ := $.Files.Glob $glob }}
{{- $_ = set $ruleFiles $path true }}
{{- end }}
{{- end }}

{{- if gt (len $ruleFiles) 0 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-rules-bundle
data:
  rules.yaml: |-
{{- range $path, $_ := $ruleFiles }}
{{ $.Files.Get $path | indent 4 }}
    ---
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-ruler-rules-sync
  annotations:
{{- if ($cfg.argocdHook | default true) }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: {{ ($cfg.syncWave | default "5") | quote }}
{{- end }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mimirtool
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy | default "IfNotPresent" }}
          args:
            - rules
            - load
            - --address={{ $cfg.address }}
            - --id={{ ($cfg.tenantId | default "anonymous") }}
{{- if $cfg.auth.existingSecret }}
            - --token=$(MIMIR_TOKEN)
{{- end }}
            - /rules/rules.yaml
          env:
{{- if $cfg.auth.existingSecret }}
            - name: MIMIR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.auth.existingSecret | quote }}
                  key: {{ ($cfg.auth.tokenKey | default "token") | quote }}
                  optional: false
{{- end }}
          volumeMounts:
            - name: rules
              mountPath: /rules
      volumes:
        - name: rules
          configMap:
            name: mimir-rules-bundle
{{- end }}
{{- end }}
