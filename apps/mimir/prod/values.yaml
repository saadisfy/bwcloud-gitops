# Mimir prod stage overrides
mimir-distributed:
  mimir:
    structuredConfig:
      # Required: ruler writes temporary/state files at startup.
      # With readOnlyRootFilesystem=true, /tmp is not writable, so we must use /data.
      blocks_storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks
      limits:
        store_gateway_tenant_shard_size: 0
        ingestion_rate: 100000
        ingestion_burst_size: 500000
        max_global_series_per_user: 1500000
      ruler:
        rule_path: /data/ruler-rules
        alertmanager_url: "http://mimir-alertmanager-headless.mimir.svc.cluster.local:8080"
      ruler_storage:
        backend: filesystem
        filesystem:
          dir: /data/ruler-storage

  ingester:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 4Gi

  ruler:
    enabled: true
    replicas: 1
    persistentVolume:
      enabled: true
      size: 1Gi
    initContainers:
      - name: setup-storage
        image: busybox:latest
        command: ["sh", "-c", "mkdir -p /data/ruler-storage/1"]
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: storage
            mountPath: /data
      # Copies rules directly into ruler_storage filesystem — no API call needed.
      # ruler_storage.backend=filesystem means Mimir reads rules from /data/ruler-storage/<tenantId>/ at startup.
      # This avoids the chicken-and-egg problem (mimirtool API requires the ruler to already be running).
      - name: sync-ruler-rules
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            mkdir -p /data/ruler-storage/1
            cp /rules/rules.yaml /data/ruler-storage/1/alertrules.yaml
            echo "Rules copied to /data/ruler-storage/1/alertrules.yaml"
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: storage
            mountPath: /data
          - name: ruler-rules
            mountPath: /rules
            readOnly: true

    extraVolumes:
      - name: ruler-rules
        configMap:
          name: mimir-rules-bundle
    extraVolumeMounts: []


queryFrontendIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: mimir-query.saadisfy.me
  tlsSecretName: mimir-query-tls

# rulerRuleSync: enabled=true keeps the mimir-rules-bundle ConfigMap rendered
# (mounted by the sync-ruler-rules initContainer on the ruler pod).
# The Argo CD Job approach has been replaced by an initContainer — no more
# "job already exists" sync errors. Rules are loaded on every ruler restart.
rulerRuleSync:
  enabled: true
  # Used only to keep the mimir-rules-bundle ConfigMap rendered.
  address: "http://mimir-gateway.mimir.svc.cluster.local"
  tenantId: "1"
  auth:
    existingSecret: ""
    tokenKey: "token"
    usernameKey: "username"
    passwordKey: "password"
  # argocdHook is no longer used — Job template has been removed.
  argocdHook: false
  image:
    repository: grafana/mimirtool
    tag: "3.0.1"
    pullPolicy: IfNotPresent
