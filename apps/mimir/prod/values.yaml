# Mimir prod stage overrides
mimir-distributed:
  mimir:
    structuredConfig:
      # Required: ruler writes temporary/state files at startup.
      # With readOnlyRootFilesystem=true, /tmp is not writable, so we must use /data.
      ruler:
        rule_path: /data/ruler-rules
        alertmanager_url: "http://mimir-alertmanager-headless.mimir.svc.cluster.local:8080"
      ruler_storage:
        backend: filesystem
        filesystem:
          dir: /ruler-storage
  ruler:
    enabled: true
    replicas: 1
    podAnnotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      - name: setup-rules
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            mkdir -p /ruler-storage/1/rules
            cp /rules/rules.yaml /ruler-storage/1/rules/rules.yaml
            echo "Current storage structure:"
            ls -R /ruler-storage
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: ruler-storage
            mountPath: /ruler-storage
          - name: rules-bundle
            mountPath: /rules

    extraVolumes:
      - name: ruler-storage
        emptyDir: {}
      - name: rules-bundle
        configMap:
          name: mimir-rules-bundle
    extraVolumeMounts:
      - name: ruler-storage
        mountPath: /ruler-storage
      - name: rules-bundle
        mountPath: /rules

queryFrontendIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: mimir-query.saadisfy.me
  tlsSecretName: mimir-query-tls

rulerRuleSync:
  enabled: true
  # Mimir query-frontend/gateway URL exposing /prometheus API.
  address: "http://mimir-gateway.mimir.svc.cluster.local"
  # Tenant / OrgID used for ruler API calls.
  tenantId: "1"
  # Optional auth secret containing token or user/password.
  auth:
    existingSecret: ""
    tokenKey: "token"
    usernameKey: "username"
    passwordKey: "password"
  # Hook mode makes Argo CD rerun the sync job on each sync.
  argocdHook: true

  syncWave: "5"
  image:
    repository: grafana/mimirtool
    tag: "3.0.1"
    pullPolicy: IfNotPresent
