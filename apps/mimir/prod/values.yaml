# Mimir prod stage overrides
mimir-distributed:
  mimir:
    structuredConfig:
      # Required: ruler writes temporary/state files at startup.
      # With readOnlyRootFilesystem=true, /tmp is not writable, so we must use /data.
      ruler:
        rule_path: /data/ruler-rules
      ruler_storage:
        backend: local
        local:
          directory: /ruler-storage
  ruler:
    enabled: true
    replicas: 1
    initContainers:
      - name: setup-storage
        image: busybox:latest
        command: ["sh", "-c", "mkdir -p /ruler-storage/anonymous"]
        volumeMounts:
          - name: ruler-storage
            mountPath: /ruler-storage
    extraVolumes:
      - name: ruler-storage
        emptyDir: {}
    extraVolumeMounts:
      - name: ruler-storage
        mountPath: /ruler-storage

queryFrontendIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: mimir-query.saadisfy.me
  tlsSecretName: mimir-query-tls

rulerRuleSync:
  enabled: true
  # Mimir query-frontend/gateway URL exposing /prometheus API.
  address: "http://mimir-gateway.mimir.svc.cluster.local"
  # Tenant / OrgID used for ruler API calls.
  tenantId: "anonymous"
  # Optional auth secret containing token or user/password.
  auth:
    existingSecret: ""
    tokenKey: "token"
    usernameKey: "username"
    passwordKey: "password"
  # Hook mode makes Argo CD rerun the sync job on each sync.
  argocdHook: true

  syncWave: "5"
  image:
    repository: grafana/mimirtool
    tag: "3.0.1"
    pullPolicy: IfNotPresent
