# Instrumentation für Java Auto-Instrumentation im otel-operator Namespace.
# Apps in anderen Namespaces referenzieren mit Annotation:
#   instrumentation.opentelemetry.io/inject-java: "otel-operator/java-instrumentation"
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: java-instrumentation
  namespace: otel-operator
spec:
  env:
    # OTLP for all signals: Alloy filters stdout for otel-injected pods (no duplicates).
    - name: OTEL_LOGS_EXPORTER
      value: "otlp"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
    - name: OTEL_METRICS_EXPORTER
      value: "otlp"
    - name: OTEL_INSTRUMENTATION_RUNTIME_METRICS_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED
      value: "true"
    - name: OTEL_JAVAAGENT_DEBUG
      value: "true"
    # Attach trace_id to histogram metrics → Mimir exemplars → Grafana → Tempo
    - name: OTEL_METRICS_EXEMPLAR_FILTER
      value: "always_on"
    # Ensure HTTP spans are sampled so trace_based exemplars are emitted
    - name: OTEL_TRACES_SAMPLER
      value: "always_on"
  exporter:
    endpoint: {{ .Values.otlpGateway.endpoint | quote }}
  resource:
    resourceAttributes:
      deployment.environment.name: noctua
  propagators:
    - tracecontext
    - baggage
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
