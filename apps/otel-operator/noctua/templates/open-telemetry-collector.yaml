# OpenTelemetryCollector: OTLP-Empfang, Metrics → Mimir (otlphttp), Target Allocator (Beispiel: nur Mimir)
# v1beta1: spec.config must be an object, not a string
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: otel-operator
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlphttp:
        endpoint: http://mimir-distributor.mimir.svc.cluster.local:8080/otlp
        headers:
          X-Scope-OrgID: "1"
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [otlphttp]
