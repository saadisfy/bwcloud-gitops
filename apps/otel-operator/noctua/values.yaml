# OpenTelemetry Operator prod overrides
opentelemetry-operator: {}

# OTLP gateway for auto-instrumented apps (Alloy applicationObservability on alloy-node).
otlpGateway:
  endpoint: http://alloy-kai-alloy-node.alloy.svc.cluster.local:4318

obi:
  enabled: false
  image:
    repository: otel/ebpf-instrument
    tag: v0.9.0
    pullPolicy: IfNotPresent
  otlpEndpoint: http://otel-collector-collector.otel-operator.svc.cluster.local:4318
  autoTargetExe: "*"
  kubeMetadataEnable: "true"
