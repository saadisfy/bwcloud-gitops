# OpenTelemetryCollector: OTLP-Empfang, Metrics → Mimir (otlphttp), Target Allocator (Beispiel: nur Mimir)
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: otel-operator
spec:
  mode: deployment
  targetAllocator:
    enabled: true
  config: |
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
      prometheus:
        config:
          scrape_configs: []
        target_allocator:
          endpoint: http://otel-collector-targetallocator.otel-operator.svc.cluster.local:8080
          interval: 30s
          collector_id: ${POD_NAME}
    exporters:
      otlphttp:
        endpoint: http://mimir-mimir-distributed-distributor.mimir.svc.cluster.local:8080/otlp
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          exporters: [otlphttp]
