# Spring Petclinic - base values
# Public image (Docker Hub). Für GHCR: image in prod/values überschreiben + imagePullSecrets setzen.
image:
  repository: docker.io/springcommunity/spring-petclinic
  tag: latest
# imagePullSecrets: []   # z.B. [ { name: ghcr } ] wenn privates Image

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: spring-petclinic.saadisfy.me
  tls: false

# OTel: Collector + Instrumentation liegen im otel-operator Namespace (cross-ns)
# Annotation auf Pod: instrumentation.opentelemetry.io/inject-java: "otel-operator/java-instrumentation"
otelCollector:
  enabled: false
  name: otel-collector
mimirNamespace: mimir
