# Spring Petclinic - base values
# Public image (Docker Hub arey/springboot-petclinic, port 8080). Für GHCR: image in prod/values überschreiben + imagePullSecrets setzen.
image:
  repository: docker.io/arey/springboot-petclinic
  tag: latest
# imagePullSecrets: []   # z.B. [ { name: ghcr } ] wenn privates Image

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: spring-petclinic.saadisfy.me
  tls: false

# OTel: Instrumentation CR in otel-operator; OTLP → Alloy alloy-node (:4318), nicht otel-collector.
otelInstrumentation:
  enabled: true
otelCollector:
  enabled: false
  name: otel-collector
mimirNamespace: mimir

loadGenerator:
  enabled: true
  schedule: "*/5 * * * *"
  url: "http://spring-petclinic:8080/"
  requests: 5
