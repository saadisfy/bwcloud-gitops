# Spring Petclinic - base values
# Public image (Docker Hub arey/springboot-petclinic, port 8080). Für GHCR: image in prod/values überschreiben + imagePullSecrets setzen.
image:
  repository: docker.io/arey/springboot-petclinic
  tag: latest
# imagePullSecrets: []   # z.B. [ { name: ghcr } ] wenn privates Image

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 768Mi

ingress:
  enabled: true
  className: nginx
  host: spring-petclinic.saadisfy.me
  tls: false

# OTel: Collector + Instrumentation im otel-operator Namespace. Bei true: Annotation inject-java gesetzt (kann bei alter App/geringem RAM zu CrashLoop führen).
otelInstrumentation:
  enabled: false
otelCollector:
  enabled: false
  name: otel-collector
mimirNamespace: mimir
