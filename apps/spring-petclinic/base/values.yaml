# Spring Petclinic - base values
# GHCR image: https://github.com/saadisfy/bwcloud-gitops
image:
  repository: ghcr.io/saadisfy/spring-petclinic
  tag: latest

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: spring-petclinic.bwcloud.local
  tls: false

# OTel Collector + Instrumentation
otelCollector:
  enabled: true
  name: otel-collector
# Mimir namespace for metrics export (override per stage: mimir-dev, mimir-int, mimir)
mimirNamespace: mimir
