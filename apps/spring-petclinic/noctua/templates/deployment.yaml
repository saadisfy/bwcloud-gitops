apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic
  labels:
    app: spring-petclinic
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: spring-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic
      annotations:
        {{- if .Values.otelInstrumentation.enabled }}
        # Instrumentation CR im Namespace otel-operator (cross-namespace)
        instrumentation.opentelemetry.io/inject-java: "otel-operator/java-instrumentation"
        resource.opentelemetry.io/service.name: "spring-petclinic"
        resource.opentelemetry.io/service.namespace: "spring-petclinic"
        resource.opentelemetry.io/service.version: "{{ .Values.image.tag }}"
        resource.opentelemetry.io/deployment.environment.name: "noctua"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: petclinic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.resources.limits.memory | default "512Mi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic
  labels:
    app: spring-petclinic
spec:
  selector:
    app: spring-petclinic
  ports:
    - port: 8080
      targetPort: 8080
      name: http
