# Tempo monolithic values for the obs cluster (low resources)
tempo:
  fullnameOverride: tempo

  # The chart leaves the pod securityContext empty, so the PVC mounted at
  # /var/tempo is owned by root and Tempo -- which runs non-root -- cannot
  # create /var/tempo/traces. fsGroup makes the kubelet chown the volume to
  # root:10001 with g+rwx and adds 10001 as a supplemental group.
  securityContext:
    fsGroup: 10001
  
  persistence:
    enabled: true
    size: 5Gi
    # The monolithic tempo chart reads persistence.storageClassName -- a plain
    # `storageClass` key here is silently ignored. It only ever appeared to work
    # on the old k3s host because local-path was the default StorageClass there.
    # AKS default StorageClass is "default" (disk.csi.azure.com).
    storageClassName: default

  tempo:
    reportingEnabled: false

    # Span metrics + service graph for Grafana Service Map / tracesToMetrics
    metricsGenerator:
      enabled: true
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: "http://mimir-distributor.mimir.svc.cluster.local:8080/api/v1/push"
            headers:
              X-Scope-OrgID: "1"
            send_exemplars: true
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            - local-blocks

    # Local filesystem storage on the Tempo PVC. The former S3 setup pointed at
    # the in-cluster MinIO, which is gone (no publicly pullable image). This is
    # also exactly what the running Tempo on this cluster already used.
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    
    # OTLP support is the baseline requirement
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  # Minimal resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
