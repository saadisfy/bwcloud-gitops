apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-operator
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - namespace: otel-operator
  template:
    metadata:
      name: otel-operator
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: apps/otel-operator/noctua
        helm:
          valueFiles:
            - ../base/values.yaml
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
