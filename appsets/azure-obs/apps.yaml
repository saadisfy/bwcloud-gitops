# Azure OBS ApplicationSets
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - namespace: argocd
  template:
    metadata:
      name: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: apps/argocd/prod
        helm:
          valueFiles:
            - ../base/values.yaml
            - values.yaml
            - ../azure-obs/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: argocd-secret
          namespace: argocd
          jsonPointers:
            - /data/admin.password
            - /data/admin.passwordMtime
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-priority
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: cluster-priority
            namespace: kube-system
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: apps/cluster-priority/prod
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
