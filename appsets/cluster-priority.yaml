apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-priority
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: cluster-priority
            namespace: kube-system
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: apps/cluster-priority/prod
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
