# Kargo: only prod
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - stage: prod
            namespace: kargo
  template:
    metadata:
      name: kargo
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: apps/kargo/prod
        helm:
          valueFiles:
            - ../base/values.yaml
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: kargo
      # Secret kargo-api: Chart nutzt stringData, K8s speichert als data (base64) → Argo CD meldet sonst ständig OutOfSync
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: kargo-api
          namespace: kargo
          jqPathExpressions:
            - .data
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
