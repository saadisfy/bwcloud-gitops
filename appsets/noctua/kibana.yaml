apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kibana
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - stage: noctua
            namespace: elk
  template:
    metadata:
      name: kibana
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: 'apps/kibana/{{stage}}'
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
