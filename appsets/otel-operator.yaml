apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-operator
  namespace: argocd
spec:
  # Nur prod deployed; dev/int Code bleibt in apps/otel-operator/{dev,int}
  generators:
    - list:
        elements:
          - stage: prod
            namespace: otel-operator
  template:
    metadata:
      name: otel-operator
    spec:
      project: default
      sources:
        - repoURL: https://github.com/saadisfy/bwcloud-gitops.git
          targetRevision: main
          path: 'apps/otel-operator/{{stage}}'
          helm:
            valueFiles:
              - ../base/values.yaml
              - values.yaml
        - repoURL: https://github.com/saadisfy/bwcloud-gitops.git
          targetRevision: main
          path: 'apps/otel-operator/prod-cr'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
