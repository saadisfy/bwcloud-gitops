apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spring-petclinic
  namespace: argocd
spec:
  # Nur prod deployed; dev/int Code bleibt in apps/spring-petclinic/{dev,int}
  generators:
    - list:
        elements:
          - stage: prod
            namespace: spring-petclinic
  template:
    metadata:
      name: spring-petclinic
    spec:
      project: default
      source:
        repoURL: https://github.com/saadisfy/bwcloud-gitops.git
        targetRevision: main
        path: 'apps/spring-petclinic/{{stage}}'
        helm:
          valueFiles:
            - ../base/values.yaml
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
