apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: grafana-prod
  namespace: grafana
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: grafana-warehouse
      sources:
        stages:
          - grafana-dev
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/saadisfy/bwcloud-gitops.git
        - name: targetBranch
          value: main
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: ${{ vars.targetBranch }}
                path: ./out
        # Copy Chart.yaml from dev to prod
        - uses: copy
          as: copy-chart
          config:
            inPath: ./out/apps/grafana/dev/Chart.yaml
            outPath: ./out/apps/grafana/prod/Chart.yaml
        # Copy values.yaml from dev to prod
        - uses: copy
          as: copy-values
          config:
            inPath: ./out/apps/grafana/dev/values.yaml
            outPath: ./out/apps/grafana/prod/values.yaml
        # Copy templates folder if exists (using git-tree-clear + copy pattern)
        - uses: git-commit
          config:
            path: ./out
            message: |
              chore(grafana): promote dev → prod (Chart v${{ chartFrom("https://github.com/saadisfy/bwcloud-gitops.git", "apps/grafana/dev").Version }})
        - uses: git-push
          config:
            path: ./out
            branch: ${{ vars.targetBranch }}
